function ScriptsStage({ audit }) {
  const ci = audit.client_info || {};
  const roi = calcROI(audit, new Set(Object.keys(audit.item_states || {}).filter(id => audit.item_states[id]?.status === 'fail')));

  const [extra, setExtra] = useState({ finding1:'', finding2:'', finding3:'' });

  function fill(str) {
    const vars = {
      '%client%':   ci.client_name   || '[client name]',
      '%store%':    ci.store_url     || ci.client_name || '[store]',
      '%you%':      ci.auditor_name  || '[your name]',
      '%rev%':      ci.monthly_revenue ? Number(ci.monthly_revenue).toLocaleString() : '[monthly revenue]',
      '%roi%':      roi.hasData ? Math.round(roi.monthlyRecovery).toLocaleString() : '[recovery estimate]',
      '%finding1%': extra.finding1 || '[top finding #1]',
      '%finding2%': extra.finding2 || '[top finding #2]',
      '%finding3%': extra.finding3 || '[top finding #3]',
    };
    return Object.entries(vars).reduce((s, [k, v]) => s.split(k).join(v), str);
  }

  async function copyText(text, id) {
    try { await navigator.clipboard.writeText(text); } catch(e) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;'; document.body.appendChild(ta);
      ta.select(); try { document.execCommand('copy'); } catch(e2) {} document.body.removeChild(ta);
    }
    const btn = document.getElementById(id);
    if (!btn) return;
    const orig = btn.textContent;
    btn.textContent = 'Copied ✓'; btn.style.color = 'var(--state-pass)';
    setTimeout(() => { btn.textContent = orig; btn.style.color = ''; }, 1800);
  }

  return (
    <div style={{ maxWidth:780, margin:'0 auto', padding:'32px 24px 80px' }}>
      <h2 style={{ fontFamily:"var(--font-sans)", fontSize:26, fontWeight:600, letterSpacing:'-0.045em',
        color:'var(--ink)', marginBottom:8 }}>Scripts</h2>
      <p style={{ fontFamily:"var(--font-mono)", fontSize:11, color:'var(--ink-4)', letterSpacing:'0.04em',
        marginBottom:32 }}>
        Use the structure. Add one specific detail about their store — a product, a recent launch, something from their About page.
      </p>

      {SCRIPT_TEMPLATES.map(t => (
        <div key={t.id} style={{ border:'1px solid var(--rule)', borderRadius:4, overflow:'hidden', marginBottom:24 }}>
          {/* Card header */}
          <div style={{ background:'var(--paper-2)', borderBottom:'1px solid var(--rule)', padding:'12px 18px',
            display:'flex', alignItems:'baseline', gap:10, flexWrap:'wrap' }}>
            <span style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.12em', textTransform:'uppercase',
              background:'var(--btn-bg)', color:'var(--btn-ink)', padding:'2px 7px', flexShrink:0 }}>{t.num}</span>
            <span style={{ fontFamily:"var(--font-sans)", fontSize:16, fontWeight:600, letterSpacing:'-0.03em',
              color:'var(--ink)' }}>{t.name}</span>
            <span style={{ fontFamily:"var(--font-mono)", fontSize:11, color:'var(--ink-4)', marginLeft:'auto' }}
              className="desktop-only">{t.tagline}</span>
          </div>

          {/* Extra fields for T3 */}
          {t.extraFields && (
            <div style={{ padding:'14px 18px', borderBottom:'1px solid var(--rule)', background:'var(--paper-3)' }}>
              <div style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.1em', textTransform:'uppercase',
                color:'var(--ink-5)', marginBottom:10 }}>Audit details — pull from the Revenue step</div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10 }}>

                  <div key={f}>
                    <label style={{ display:'block', fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.08em',
                      textTransform:'uppercase', color:'var(--ink-4)', marginBottom:5 }}>Top finding #{i+1}</label>
                    <input type="text" value={extra[f]}
                      onChange={e => setExtra(prev => ({...prev, [f]:e.target.value}))}

                        color:'var(--ink)', fontFamily:"var(--font-mono)", fontSize:12, padding:'6px 9px', outline:'none' }} />
                  </div>
                ))}
              </div>
            </div>

// ─── COMPONENTS C: AuditWorkspace, App ───────────────────────────────────────

function AuditWorkspace({ auditId, store, onUpdateItem, onUpdatePricing, onSavePitch, onSaveClientInfo, onBack, theme, onToggleTheme, saveStatus }) {
  const audit = store.audits[auditId];
  const [clientInfoOpen, setClientInfoOpen] = useState(false);
  const [clientInfoSkipTarget, setClientInfoSkipTarget] = useState(null);

  // Stage layout: 0=Setup  1=Checklist  2=Revenue  3=Report  4=Scripts
  const isNewAudit = (() => {
    const ci2 = audit?.client_info || {};
    return !ci2.audit_title && !ci2.client_name && !ci2.monthly_revenue;
  })();
  const [stageIndex, setStageIndex] = useState(isNewAudit ? 0 : 1);

  const findingsKey = `liftkit-findings-${auditId}`;
  const [checkedIds, setCheckedIds] = useState(() => {
    if (demoMode) return null;
    try {
      const saved = localStorage.getItem(findingsKey);
      return saved ? new Set(JSON.parse(saved)) : null;
    } catch { return null; }
  });
  const [checklistCtx, setChecklistCtx] = useState({ short: SECTIONS[0].short, idx: 1, len: SECTIONS[0].items.length });
  const [cardGlowTrigger, setCardGlowTrigger] = useState(0);

  useEffect(() => {
    if (!demoMode && checkedIds !== null) {
      try { localStorage.setItem(findingsKey, JSON.stringify([...checkedIds])); } catch {}
    }
  }, [checkedIds]);

  if (!audit) return null;

  const ci = audit.client_info || {};
  const auditDisplayTitle = ci.audit_title || ci.client_name || 'New Audit';
  const metricsIncomplete = !ci.monthly_revenue || !ci.aov || !ci.cvr;
  const setupDone = !!(ci.audit_title || ci.client_name) && !!ci.auditor_name;

  const STEPS = [
    { label: '01 Setup',     stage: 0, activeOn: [0] },
    { label: '02 Checklist', stage: 1, activeOn: [1] },
    { label: '03 Findings',  stage: 2, activeOn: [2] },
    { label: '04 Report',    stage: 3, activeOn: [3] },
    { label: '05 Scripts',   stage: 4, activeOn: [4] },
  ];

  const NEXT_CONFIG = {
    0: { label: 'Start checklist →',  nextStage: 1 },
    1: { label: 'Findings →',         nextStage: 2, guard: () => metricsIncomplete },
    2: { label: 'View report →',      nextStage: 3 },
    3: { label: 'See scripts →',      nextStage: 4 },
    4: null,
  };

  function goNext() {
    const cfg = NEXT_CONFIG[stageIndex];
    if (!cfg) return;
    if (cfg.guard && cfg.guard()) {
      setClientInfoSkipTarget(cfg.nextStage);
      setClientInfoOpen(true);
    } else {
      setStageIndex(cfg.nextStage);
    }
  }

  function goPrev() {
    if (stageIndex === 0) { onBack(); return; }
    setStageIndex(stageIndex - 1);
  }

  const stageVisible = (n) => ({
    position:'absolute', inset:0,
    opacity: n === stageIndex ? 1 : 0,
    pointerEvents: n === stageIndex ? 'auto' : 'none',
    transition: 'opacity 0.12s ease',
  });

  const saveLabel = saveStatus === 'saved' ? '✓ Saved · just now'
    : saveStatus === 'saving' ? 'Saving…'
    : 'Draft · saved locally';
  const saveDone = saveStatus === 'saved';

  return (
    <div data-audit-root style={{ position:'fixed', inset:0, display:'flex', flexDirection:'column', background:'var(--bg)' }}>

      {/* Demo banner */}
      {demoMode && (
        <div className="demo-banner no-print">
          <span className="demo-banner__chip">DEMO</span>
          <span>Nothing here is saved. Refreshing the page clears this audit.</span>
          <a href="https://trytriage.lemonsqueezy.com/checkout/buy/9da78faa-4513-40c6-9469-621292edd053" className="demo-banner__cta">Get the full kit →</a>
        </div>
      )}

      {/* ── Audit top bar ── */}
      <div className="audit-topbar no-print">
        <button className="audit-topbar__wordmark" onClick={onBack} title="Back to audits"
          style={{ cursor:'pointer', background:'none', border:'none', padding:0 }}>
          {THEME.product.name}
        </button>
        <span className="audit-topbar__sep">/</span>
        <button className="audit-topbar__crumb" onClick={onBack}>Audits</button>
        <span className="audit-topbar__sep">/</span>
        <span className="audit-topbar__title">{auditDisplayTitle}</span>
        <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:10 }}>
          <span className={`audit-topbar__save desktop-only${saveDone ? ' saved' : ''}`}>{saveLabel}</span>
          <button onClick={() => setClientInfoOpen(true)} className="btn btn-secondary btn-sm">
            Edit info
          </button>
          {!demoMode && (
            <button onClick={() => {
              const name = (ci.audit_title || ci.client_name || 'audit').toLowerCase().replace(/\s+/g,'-');
              downloadJSON(audit, `triage-audit-${name}-${audit.id}.json`);
            }} className="btn btn-secondary btn-sm desktop-only">
              Export .json
            </button>
          )}
          <ThemeToggle theme={theme} onToggle={onToggleTheme} />
        </div>
      </div>

      {/* ── Step strip ── */}
      <div className="step-strip no-print">
        {STEPS.map(step => {
          const isActive = step.activeOn.includes(stageIndex);
          const isDone   = step.activeOn.every(s => s < stageIndex) && !isActive;
          return (
            <button
              key={step.label}
              className={`step-tab${isActive ? ' active' : ''}${isDone ? ' done' : ''}`}
              onClick={() => setStageIndex(step.stage)}>
              <span className="step-check" style={{ visibility: isDone ? 'visible' : 'hidden' }}>✓</span>
              {step.label}
            </button>
          );
        })}
        {/* Right-side summary in strip */}
        <div className="desktop-only" style={{ marginLeft:'auto', display:'flex', alignItems:'center',
          paddingRight:20, fontFamily:'var(--font-mono)', fontSize:10, color:'var(--mute)',
          letterSpacing:'0.06em', gap:14, flexShrink:0 }}>
          {/* summary lives in map strip now, not here */}
        </div>
      </div>

      {/* ── Stage container ── */}
      <div data-stages-wrap style={{ flex:1, overflow:'hidden', position:'relative' }}>

        {/* Setup */}
        <div data-stage="setup" style={{ ...stageVisible(0), overflowY:'auto' }}>
          <SetupStage audit={audit} lastAuditorName={store.last_auditor_name}
            onSave={(data) => { onSaveClientInfo(audit.id, data); setStageIndex(1); setCardGlowTrigger(n => n+1); }}
            onBack={onBack} />
        </div>

        {/* Checklist */}
        <div data-stage="checklist" style={{ ...stageVisible(1), display:'flex', flexDirection:'column', overflow:'hidden' }}>
          <ChecklistStage audit={audit} onUpdateItem={onUpdateItem}
            onScrollToFindings={() => setStageIndex(2)}
            onContextChange={setChecklistCtx}
            cardGlowTrigger={cardGlowTrigger} />
        </div>

        {/* Revenue */}
        <div data-stage="revenue" style={{ ...stageVisible(2) }}>
          <RevenueStage audit={audit} checkedIds={checkedIds} setCheckedIds={setCheckedIds}
            onUpdateItem={(itemId, updates) => onUpdateItem(audit.id, itemId, updates)}
            onUpdatePricing={onUpdatePricing}
            onSavePitch={onSavePitch} />
        </div>

        {/* Report */}
        <div data-stage="report" style={{ ...stageVisible(3), overflowY:'auto' }}>
          <ReportStage audit={audit} checkedIds={checkedIds} onGoToScripts={() => setStageIndex(4)} />
        </div>

        {/* Scripts */}
        <div data-stage="scripts" style={{ ...stageVisible(4), overflowY:'auto' }}>
          <ScriptsStage audit={audit} />
        </div>

      </div>

      {/* ── Footer action bar ── */}
      <div className="footer-bar no-print">
        <button onClick={goPrev} className="btn btn-secondary">
          ← {stageIndex === 0 ? 'Audits' : stageIndex === 1 ? 'Setup' : stageIndex === 2 ? 'Checklist' : 'Previous step'}
        </button>
        <div />
        {NEXT_CONFIG[stageIndex] && (
          <button onClick={goNext} className="btn btn-primary btn-lg">
            {NEXT_CONFIG[stageIndex].label}
          </button>
        )}
      </div>

      {/* Client info overlay */}
      {clientInfoOpen && (
        <ClientInfoOverlay audit={audit} lastAuditorName={store.last_auditor_name}
          onSave={(data) => { onSaveClientInfo(audit.id, data); if (clientInfoSkipTarget !== null) setStageIndex(clientInfoSkipTarget); setClientInfoOpen(false); setClientInfoSkipTarget(null); }}
          onClose={() => { setClientInfoOpen(false); setClientInfoSkipTarget(null); }}
          onSkip={clientInfoSkipTarget !== null ? () => { setStageIndex(clientInfoSkipTarget); setClientInfoOpen(false); setClientInfoSkipTarget(null); } : null} />
      )}
    </div>
  );
}

  const [appScreen, setAppScreen] = useState('list'); // 'list' | 'audit'
  const [activeAuditId, setActiveAuditId] = useState(null);
  const [theme, setTheme] = useState(() => localStorage.getItem('triage-theme') || 'light');
  const [user, setUser] = useState(null);
  const [profile, setProfile] = useState(null);
  const [authLoading, setAuthLoading] = useState(!demoMode);
  const [profileLoading, setProfileLoading] = useState(!demoMode);
  const [auditsLoading, setAuditsLoading] = useState(!demoMode);
  const [dbError, setDbError] = useState(null);
  const [confirmDialog, setConfirmDialog] = useState(null);
  const [showNewAuditModal, setShowNewAuditModal] = useState(false);
  const [showHelpModal, setShowHelpModal] = useState(false);
  const saveTimers = useRef({});
  // Track updated_at of last-saved version per audit to skip unnecessary Supabase writes
  const savedAt = useRef({});

  useEffect(() => {
    if (theme === 'light') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
    try { localStorage.setItem('triage-theme', theme); } catch {}
  }, [theme]);

  function toggleTheme() { setTheme(t => t === 'dark' ? 'light' : 'dark'); }

  useEffect(() => {
    if (demoMode) return;
    _supabase.auth.getUser().then(({ data: { user } }) => {
      setUser(user ?? null);
      setAuthLoading(false);
    });
    const { data: { subscription } } = _supabase.auth.onAuthStateChange((_event, session) => {
      setUser(session?.user ?? null);
      setAuthLoading(false);
    });
    return () => subscription.unsubscribe();
  }, []);

  async function handleSignOut() {
    await _supabase.auth.signOut();
    setProfile(null);
  }

  // Fetch subscription profile after auth resolves
  useEffect(() => {
    if (demoMode || !user) {
      setProfileLoading(false);
      return;
    }
    setProfileLoading(true);
    _supabase.from('profiles')
      .select('subscription_status, renews_at')
      .eq('id', user.id)
      .single()
      .then(({ data }) => {
        setProfile(data ?? null);
        setProfileLoading(false);
      })
      .catch(() => {
        setProfile(null);
        setProfileLoading(false);
      });
  }, [user?.id]);

  // Persist last_auditor_name to localStorage (audits live in Supabase now)
  useEffect(() => {
    if (!demoMode) {
      try { localStorage.setItem(THEME.storage.key, JSON.stringify({ last_auditor_name: store.last_auditor_name })); } catch {}
    }
  }, [store.last_auditor_name]);

  // Load audits from Supabase after auth resolves
  useEffect(() => {
    if (demoMode || !user) return;
    setAuditsLoading(true);
    fetchAuditsFromDB(user.id)
      .then(audits => {
        Object.values(audits).forEach(a => { savedAt.current[a.id] = a.updated_at; });
        setStore(prev => ({ ...prev, audits }));
        setAuditsLoading(false);
      })
      .catch(err => {
        console.error('fetchAudits:', err);
        setDbError('Could not load audits. Check your connection.');
        setAuditsLoading(false);
      });
  }, [user?.id]);

  // Debounced save — only fires for audits whose updated_at changed since last save
  useEffect(() => {
    if (demoMode || !user) return;
    Object.values(store.audits).forEach(audit => {
      if (savedAt.current[audit.id] === audit.updated_at) return;
      clearTimeout(saveTimers.current[audit.id]);
      saveTimers.current[audit.id] = setTimeout(() => {
        upsertAuditToDB(user.id, audit)
          .then(() => { savedAt.current[audit.id] = audit.updated_at; })
          .catch(err => {
            console.error('upsertAudit:', err);
            setDbError('Save failed. Check your connection.');
          });
      }, 1500);
    });
  }, [store.audits]);

  function updateStore(fn) { setStore(prev => fn(prev)); }

  function handleDismissError() { setDbError(null); }

  async function handleNew() {
    if (!demoMode && Object.keys(store.audits).length >= THEME.limits.maxActiveAudits) {
      setDbError(THEME.copy.workspaceFull);
      return;
    }
    // Create a blank audit, navigate to AuditWorkspace — Setup step handles the form
    const audit = newAudit(store.last_auditor_name);
    if (!demoMode) {
      try {
        await upsertAuditToDB(user.id, audit);
        savedAt.current[audit.id] = audit.updated_at;
      } catch (err) {
        setDbError('Could not create audit. Check your connection.');
        return;
      }
    }
    updateStore(prev => ({
      ...prev,
      audits: { ...prev.audits, [audit.id]: audit },
    }));
    setActiveAuditId(audit.id);
    setAppScreen('audit');
  }

  async function handleCreateAudit(formData) {
    const base = newAudit(store.last_auditor_name);
    const audit = {
      ...base,
      client_info: {
        ...base.client_info,
        audit_title:     formData.audit_title.trim(),
        client_name:     formData.client_name.trim(),
        auditor_name:    formData.auditor_name.trim(),
        store_url:       formData.store_url.trim(),
        shopify_theme:   formData.shopify_theme.trim(),
        audit_date:      formData.audit_date || today(),
        monthly_revenue: parseFloat(formData.monthly_revenue) || 0,
        aov:             parseFloat(formData.aov) || 0,
        cvr:             parseFloat(formData.cvr) || 0,
      },
      pricing: { ...base.pricing, audit_fee: parseFloat(formData.audit_fee) || 0 },
    };
    setShowNewAuditModal(false);
    if (!demoMode) {
      try {
        await upsertAuditToDB(user.id, audit);
        savedAt.current[audit.id] = audit.updated_at;
      } catch (err) {
        setDbError(err.message?.includes('audit_limit_reached')
          ? THEME.copy.workspaceFull
          : 'Could not create audit. Check your connection.');
        return;
      }
    }
    updateStore(prev => ({
      ...prev,
      last_auditor_name: formData.auditor_name.trim() || prev.last_auditor_name,
      audits: { ...prev.audits, [audit.id]: audit },
    }));
    setActiveAuditId(audit.id);
    setAppScreen('audit');
  }

  function handleOpen(id) {
    setActiveAuditId(id);
    setAppScreen('audit');
  }

  function handleArchive(id) {
    const audit = store.audits[id];
    const auditTitle = audit.client_info?.audit_title || audit.client_info?.client_name || 'this audit';
    setConfirmDialog({
      title: 'Export & Delete',
      message: `"${auditTitle}" will be exported as a JSON file and removed from your active audits. You can reimport it later if you have an open slot.`,
      confirmLabel: 'Export & Delete',
      danger: true,
      onConfirm: async () => {
        const name = auditTitle.toLowerCase().replace(/\s+/g, '-');
        downloadJSON(audit, `cro-audit-${name}-${id}.json`);
        if (!demoMode) {
          try {
            await deleteAuditFromDB(id);
            delete savedAt.current[id];
          } catch (err) {
            setDbError('Delete failed. Check your connection.');
            return;
          }
        }
        updateStore(prev => { const { [id]: _, ...rest } = prev.audits; return { ...prev, audits: rest }; });
      },
    });
  }

  async function handleDuplicate(id) {
    if (!demoMode && Object.keys(store.audits).length >= THEME.limits.maxActiveAudits) {
      setDbError(THEME.copy.workspaceFull);
      return;
    }
    const audit = store.audits[id];
    const newId = genId();
    const now = new Date().toISOString();
    const dupeAudit = { ...audit, id: newId, created_at: now, updated_at: now,
      client_info: { ...audit.client_info }, items: { ...audit.items } };
    if (!demoMode) {
      try {
        await upsertAuditToDB(user.id, dupeAudit);
        savedAt.current[newId] = dupeAudit.updated_at;
      } catch (err) {
        setDbError(err.message?.includes('audit_limit_reached')
          ? THEME.copy.workspaceFull
          : 'Could not duplicate audit. Check your connection.');
        return;
      }
    }
    updateStore(prev => ({ ...prev, audits: { ...prev.audits, [newId]: dupeAudit } }));
  }

  function handleDelete(id) {
    const audit = store.audits[id];
    const auditTitle = audit.client_info?.audit_title || audit.client_info?.client_name || 'this audit';
    setConfirmDialog({
      title: 'Delete Audit',
      message: `Delete "${auditTitle}"? This cannot be undone.`,
      confirmLabel: 'Delete',
      danger: true,
      onConfirm: async () => {
        if (!demoMode) {
          try {
            await deleteAuditFromDB(id);
            delete savedAt.current[id];
          } catch (err) {
            setDbError('Delete failed. Check your connection.');
            return;
          }
        }
        updateStore(prev => { const { [id]: _, ...rest } = prev.audits; return { ...prev, audits: rest }; });
        if (activeAuditId === id) { setActiveAuditId(null); setAppScreen('list'); }
      },
    });
  }

  async function handleImport(data) {
    if (!demoMode && Object.keys(store.audits).length >= THEME.limits.maxActiveAudits) {
      setDbError(THEME.copy.workspaceFull);
      return;
    }
    const newId = genId();
    const now = new Date().toISOString();
    const audit = { ...data, id: newId, updated_at: now };
    if (!demoMode) {
      try {
        await upsertAuditToDB(user.id, audit);
        savedAt.current[newId] = audit.updated_at;
      } catch (err) {
        setDbError(err.message?.includes('audit_limit_reached')
          ? THEME.copy.workspaceFull
          : 'Could not import audit. Check your connection.');
        return;
      }
    }
    updateStore(prev => ({ ...prev, audits: { ...prev.audits, [newId]: audit } }));
  }

  function handleUpdateItem(auditId, itemId, updates) {
    updateStore(prev => {
      const audit = prev.audits[auditId];
      return { ...prev, audits: { ...prev.audits, [auditId]: {
        ...audit, updated_at: new Date().toISOString(),
        items: { ...audit.items, [itemId]: { ...(audit.items[itemId] || {}), ...updates } },
      }}};
    });
  }

  function handleUpdatePricing(auditId, pricing) {
    updateStore(prev => {
      const audit = prev.audits[auditId];
      return { ...prev, audits: { ...prev.audits, [auditId]: {
        ...audit, updated_at: new Date().toISOString(), pricing,
      }}};
    });
  }

  function handleSavePitch(auditId, text) {
    updateStore(prev => {
      const audit = prev.audits[auditId];
      return { ...prev, audits: { ...prev.audits, [auditId]: {
        ...audit, pitch_text: text, updated_at: new Date().toISOString(),
      }}};
    });
  }

  function handleSaveClientInfo(auditId, { client_info, pricing }) {
    updateStore(prev => {
      const audit = prev.audits[auditId];
      return {
        ...prev,
        last_auditor_name: client_info.auditor_name,
        audits: { ...prev.audits, [auditId]: {
          ...audit, client_info, updated_at: new Date().toISOString(),
          pricing: { ...audit.pricing, audit_fee: pricing.audit_fee },
        }},
      };
    });
  }

  if (authLoading || profileLoading) return null;
  if (!demoMode && !user) return <LoginScreen />;
  if (!demoMode && user && profile?.subscription_status === 'expired') return <ExpiredScreen onSignOut={handleSignOut} />;

  const cancelledBanner = !demoMode && profile?.subscription_status === 'cancelled' && profile?.renews_at ? (
    <div className="demo-banner" style={{ background:'var(--state-warn-bg, #fef3c7)', borderBottom:'1px solid var(--warn, #d97706)' }}>
      <span className="demo-banner__chip" style={{ background:'var(--warn, #d97706)' }}>ENDING</span>
      <span style={{ color:'var(--ink)' }}>
        Subscription cancelled — access ends {new Date(profile.renews_at).toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' })}.
      </span>
      <a href="https://trytriage.lemonsqueezy.com/checkout/buy/9da78faa-4513-40c6-9469-621292edd053" className="demo-banner__cta" style={{ color:'var(--warn, #d97706)' }}>Renew →</a>
    </div>
  ) : null;

  if (appScreen === 'audit' && activeAuditId) {
    return (
      <>
        {cancelledBanner}
        <AuditWorkspace
          auditId={activeAuditId}
          store={store}
          onUpdateItem={handleUpdateItem}
          onUpdatePricing={handleUpdatePricing}
          onSavePitch={handleSavePitch}
          onSaveClientInfo={handleSaveClientInfo}
          onBack={() => setAppScreen('list')}
          theme={theme}
          onToggleTheme={toggleTheme}
          saveStatus={demoMode ? 'local' : (
            store.audits[activeAuditId] &&
            savedAt.current[activeAuditId] === store.audits[activeAuditId]?.updated_at
              ? 'saved' : 'saving'
          )}
        />
        <ConfirmDialog dialog={confirmDialog} onClose={() => setConfirmDialog(null)} />
      </>
    );
  }

  return (
    <>
      {demoMode && (
        <div className="demo-banner">
          <span className="demo-banner__chip">DEMO</span>
          <span>Nothing here is saved. Refreshing the page clears this audit.</span>
          <a href="https://trytriage.lemonsqueezy.com/checkout/buy/9da78faa-4513-40c6-9469-621292edd053" className="demo-banner__cta">Get the full kit →</a>
        </div>
      )}
      {cancelledBanner}
      <SiteHeader theme={theme} onToggleTheme={toggleTheme} onHelp={() => setShowHelpModal(true)} user={user} onSignOut={handleSignOut} />
      <AuditList
        store={store}
        onNew={handleNew}
        onOpen={handleOpen}
        onArchive={handleArchive}
        onDuplicate={handleDuplicate}
        onDelete={handleDelete}
        onImport={handleImport}
        onSaveClientInfo={handleSaveClientInfo}
        user={user}
        onSignOut={handleSignOut}
        theme={theme}
        onToggleTheme={toggleTheme}
        auditsLoading={auditsLoading}
        dbError={dbError}
        onDismissError={handleDismissError}
      />
      {showNewAuditModal && (
        <NewAuditModal
          lastAuditorName={store.last_auditor_name}
          onSubmit={handleCreateAudit}
          onClose={() => setShowNewAuditModal(false)}
        />
      )}
      {showHelpModal && <HelpModal onClose={() => setShowHelpModal(false)} />}
      <ConfirmDialog dialog={confirmDialog} onClose={() => setConfirmDialog(null)} />
    </>
  );
}
// ─── END COMPONENTS C ───

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
