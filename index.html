<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>triage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0B09'/%3E%3Crect x='10' y='5' width='12' height='22' fill='%23C6F432'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* ── triage role tokens · light (default) ── */
  --bg:          #EEEFEA;
  --surface:     #E3E5DD;
  --ink:         #0B0C0A;
  --mute:        #5A5D56;
  --rule:        #CBCEC4;
  --accent:      #C6F432;
  --on-accent:   #0B0C0A;
  --accent-text: #4A6400;
  --loss:        #C2381C;
  --gain:        #3E7A00;
  --btn-bg:      #0B0C0A;
  --btn-ink:     #C6F432;

  /* ── aliases · keep existing inline styles working during migration ── */
  --ink-2:              #2A2C28;
  --ink-3:              var(--mute);
  --ink-4:              #7A7D74;
  --ink-5:              #9A9D94;
  --paper:              var(--bg);
  --paper-2:            var(--surface);
  --paper-3:            #D6D8D0;
  --rule-2:             #B8BBB0;
  --accent-dk:          var(--accent-text);
  --accent-positive:    var(--gain);
  --state-pass:         var(--gain);
  --state-fail:         var(--loss);
  --impact-high:        var(--loss);
  --impact-medium:      #B85C00;
  --amber:              #B85C00;
  --row-checked-bg:     rgba(198,244,50,0.12);
  --state-pass-bg:      rgba(62,122,0,0.09);
  --state-fail-bg:      rgba(194,56,28,0.09);
  --accent-positive-bg: rgba(62,122,0,0.10);
  --impact-high-bg:     rgba(194,56,28,0.10);
  --impact-medium-bg:   rgba(184,92,0,0.10);

  --font-sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}

[data-theme="dark"] {
  /* ── triage role tokens · dark ── */
  --bg:          #0A0B09;
  --surface:     #13150F;
  --ink:         #E8EBE2;
  --mute:        #8A8E84;
  --rule:        #272A21;
  --accent:      #C6F432;
  --on-accent:   #0A0B09;
  --accent-text: #C6F432;
  --loss:        #FF6A4D;
  --gain:        #C6F432;
  --btn-bg:      #C6F432;
  --btn-ink:     #0A0B09;

  /* ── aliases ── */
  --ink-2:              #C4C8BC;
  --ink-3:              var(--mute);
  --ink-4:              #6A6E64;
  --ink-5:              #4A4E44;
  --paper:              var(--bg);
  --paper-2:            var(--surface);
  --paper-3:            #1C1E18;
  --rule-2:             #363930;
  --accent-dk:          var(--accent-text);
  --accent-positive:    var(--gain);
  --state-pass:         var(--gain);
  --state-fail:         var(--loss);
  --impact-high:        var(--loss);
  --impact-medium:      #F0A050;
  --amber:              #F0A050;
  --row-checked-bg:     rgba(198,244,50,0.10);
  --state-pass-bg:      rgba(198,244,50,0.08);
  --state-fail-bg:      rgba(255,106,77,0.08);
  --accent-positive-bg: rgba(198,244,50,0.12);
  --impact-high-bg:     rgba(255,106,77,0.12);
  --impact-medium-bg:   rgba(240,160,80,0.12);
}


*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── SITE HEADER ── */
.site-header {
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
  padding: 0 32px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.site-header__name {
  font-family: var(--font-sans);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.05em;
}
.site-header__name::after {
  content: "";
  display: inline-block;
  width: .42em;
  height: .74em;
  background: var(--accent);
  margin-left: .06em;
  transform: translateY(.06em);
}
.site-header__tag {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-4);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.site-header__back {
  background: none;
  border: none;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-5);
  cursor: pointer;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: color 0.15s;
}
.site-header__back:hover { color: var(--ink-3); }
.site-header__theme-toggle {
  background: none;
  border: none;
  color: var(--ink-4);
  cursor: pointer;
  padding: 4px 6px;
  display: flex;
  align-items: center;
  transition: color 0.15s;
  margin-left: auto;
}
.site-header__theme-toggle:hover { color: var(--ink-2); }

/* ── DEMO BANNER ── */
.demo-banner {
  background: var(--ink);
  border-bottom: 1px solid var(--ink);
  padding: 10px 32px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--bg);
  letter-spacing: 0.06em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.demo-banner__chip {
  background: var(--accent);
  color: var(--on-accent);
  padding: 1px 7px;
  font-weight: 600;
  letter-spacing: 0.1em;
  flex-shrink: 0;
}
.demo-banner__cta {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
  flex-shrink: 0;
}
.demo-banner__cta:hover { opacity: 0.82; }

/* ── BUTTONS ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  padding: 9px 18px;
  border: none;
  cursor: pointer;
  transition: opacity 0.15s;
  white-space: nowrap;
}
.btn:disabled { opacity: 0.3; cursor: not-allowed; }
.btn:not(:disabled):hover { opacity: 0.82; }
.btn-primary   { background: var(--btn-bg); color: var(--btn-ink); }
.btn-secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--rule); }
.btn-ghost     { background: none; color: var(--mute); border: 1px solid var(--rule); }
.btn-danger    { background: var(--state-fail-bg); color: var(--loss); border: 1px solid var(--loss); }
/* utility type classes */
.label { font-family:var(--font-mono); font-weight:500; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); }
.display { font-family:var(--font-sans); font-weight:600; line-height:1.12; letter-spacing:-0.045em; margin:0; text-wrap:balance; }
.hl { font-style:normal; background:var(--accent); color:var(--on-accent); padding:0 .08em; }
.btn-lg  { padding: 13px 26px; font-size: 14px; }
.btn-sm  { padding: 6px 12px; font-size: 12px; }
.btn-full { width: 100%; justify-content: center; }

/* ── FIELDS ── */
.field { margin-bottom: 18px; }
.field:last-child { margin-bottom: 0; }
.field label {
  display: block;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--mute);
  margin-bottom: 5px;
}
.field input, .field textarea, .field select {
  width: 100%;
  border: 1px solid var(--rule);
  background: var(--bg);
  padding: 9px 13px;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s;
  appearance: none;
  -webkit-appearance: none;
  border-radius: 0;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
.field .hint { font-size: 11px; color: var(--mute); margin-top: 4px; font-family: var(--font-mono); }
.field-private label::after { content: ' — private'; font-weight: 400; color: var(--mute); text-transform: none; letter-spacing: 0; }

.fg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.fg3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
.fg4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 18px; }

/* ── CHECKLIST SIDEBAR ── */
.checklist-sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--rule);
  overflow-y: auto;
  display: none;
}
.checklist-sidebar.open { display: block; }
@media (min-width: 1024px) {
  .checklist-sidebar.open { width: 380px; }
}
@media (max-width: 700px) {
  .checklist-sidebar {
    position: fixed;
    left: 0;
    top: 46px;
    bottom: 0;
    width: calc(100% - 32px) !important;
    z-index: 400;
    display: block;
    transform: translateX(-100%);
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .checklist-sidebar.open { transform: translateX(0); }
}
.sidebar-acc-btn {
  width: 100%;
  background: var(--surface);
  border: none;
  border-bottom: 1px solid var(--rule);
  padding: 9px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  transition: background 0.12s;
  position: sticky;
  top: 0;
  z-index: 1;
}
.sidebar-acc-btn:hover { background: var(--bg); }
.sidebar-acc-btn.open  { background: var(--bg); border-left: 2px solid var(--accent); padding-left: 10px; }
.sidebar-item-btn {
  width: 100%;
  background: none;
  border: none;
  border-bottom: 1px solid var(--rule);
  padding: 8px 12px 8px 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background 0.12s;
  text-align: left;
}
.sidebar-item-btn:hover { background: var(--bg); }
.sidebar-item-btn.active { background: var(--bg); border-left: 2px solid var(--accent); padding-left: 22px; }
.sidebar-item-btn.cursor { outline: 1px solid var(--accent); outline-offset: -1px; background: var(--bg); }
.sidebar-item-btn:focus { outline: none; }

/* ── MODAL OVERLAY ── */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 400;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 16px;
  overflow-y: auto;
}
.modal-panel {
  background: var(--surface);
  border: 1px solid var(--rule);
  width: 100%;
  max-width: 640px;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 24px;
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
}
.modal-body { padding: 24px; background: var(--bg); }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--rule);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  background: var(--surface);
}
@keyframes modalSlideUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}
@media (max-width: 700px) {
  .modal-backdrop {
    padding: 0;
    overflow: hidden;
    background: transparent;
  }
  .modal-panel {
    position: fixed;
    inset: 0;
    max-width: 100%;
    border: none;
    border-radius: 0;
    display: flex;
    flex-direction: column;
    animation: modalSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .modal-panel > form {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .modal-header { flex-shrink: 0; }
  .modal-body {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal-footer {
    flex-shrink: 0;
    justify-content: stretch;
  }
  .modal-footer .btn { flex: 1; justify-content: center; padding: 14px; font-size: 11px; }
}

/* ── STEP STRIP (5-tab nav under audit top bar) ── */
.step-strip {
  height: 48px;
  background: var(--bg);
  border-bottom: 1px solid var(--rule);
  display: flex;
  align-items: stretch;
  flex-shrink: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.step-strip::-webkit-scrollbar { display: none; }
.step-tab {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 18px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--mute);
  cursor: pointer;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  border-top: 2px solid transparent;
  white-space: nowrap;
  transition: color 0.12s, border-color 0.12s;
  flex-shrink: 0;
}
.step-tab:hover { color: var(--ink); }
.step-tab.active {
  color: var(--ink);
  font-weight: 600;
  border-bottom-color: var(--btn-bg);
}
.step-tab.done .step-check { color: var(--gain); }

/* ── AUDIT TOP BAR ── */
.audit-topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 0;
  flex-shrink: 0;
  z-index: 90;
}
.audit-topbar__wordmark {
  font-family: var(--font-sans);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.05em;
  color: var(--ink);
  text-decoration: none;
  flex-shrink: 0;
  display: flex;
  align-items: center;
}
.audit-topbar__wordmark::after {
  content: "";
  display: inline-block;
  width: .42em;
  height: .74em;
  background: var(--accent);
  margin-left: .06em;
  transform: translateY(.06em);
}
.audit-topbar__sep {
  color: var(--rule);
  margin: 0 10px;
  font-weight: 300;
  font-size: 18px;
  flex-shrink: 0;
}
.audit-topbar__crumb {
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  color: var(--mute);
  text-decoration: none;
  flex-shrink: 0;
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  transition: color 0.12s;
}
.audit-topbar__crumb:hover { color: var(--ink); }
.audit-topbar__title {
  font-family: var(--font-sans);
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.02em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.audit-topbar__save {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--mute);
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.audit-topbar__save.saved { color: var(--gain); }

/* ── FOOTER ACTION BAR ── */
.footer-bar {
  background: var(--surface);
  border-top: 1px solid var(--rule);
  padding: 0 24px;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
}
@media (max-width: 700px) {
  .footer-bar {
    height: 80px;
    padding: 0 16px;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
}

/* ── STAGE NAV BAR (bottom, all breakpoints) — legacy, kept for transition ── */
.mobile-bottom-bar {
  background: var(--surface);
  border-top: 1px solid var(--rule);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

/* ── PRINT ── */
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff !important; color: #111 !important; }
  .no-print, .site-header, .demo-banner, .mobile-bottom-bar { display: none !important; }
  .checklist-sidebar { display: none !important; }
  .print-section { page-break-inside: avoid; }
}

/* ── MOBILE ── */
@media (max-width: 700px) {
  .site-header { padding: 0 16px; height: 48px; }
  .site-header__tag { display: none; }
  .demo-banner { padding: 8px 16px; }
  .fg2, .fg3, .fg4 { grid-template-columns: 1fr; }
  .desktop-only { display: none !important; }
  .audits-grid { grid-template-columns: 1fr !important; }
}
@media (min-width: 701px) {
  .mobile-only { display: none !important; }
}

/* ── NAV SHEET (mobile sections slide-up) ── */
.nav-sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 500;
  cursor: pointer;
}
.nav-sheet-panel {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 2px solid var(--ink);
  z-index: 501;
  max-height: 76vh;
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}
.nav-sheet-panel.open { transform: translateY(0); }
.nav-sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--rule);
  flex-shrink: 0;
}
.nav-sheet-section-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-bottom: 1px solid var(--rule);
  flex-shrink: 0;
}
.nav-sheet-sec-btn {
  background: none;
  border: none;
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 10px 8px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  transition: background 0.12s;
}
.nav-sheet-sec-btn:nth-child(3n) { border-right: none; }
.nav-sheet-sec-btn:hover { background: var(--bg); }
.nav-sheet-sec-btn.active { background: var(--row-checked-bg); border-bottom: 2px solid var(--accent); }
.nav-sheet-items {
  overflow-y: auto;
  flex: 1;
}
.nav-sheet-item-btn {
  width: 100%;
  background: none;
  border: none;
  border-bottom: 1px solid var(--rule);
  padding: 12px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.12s;
  text-align: left;
}
.nav-sheet-item-btn:hover { background: var(--bg); }
.nav-sheet-item-btn.active { background: var(--bg); border-left: 2px solid var(--accent); padding-left: 14px; }
.nav-sheet-acc-btn {
  width: 100%;
  background: none;
  border: none;
  border-bottom: 1px solid var(--rule);
  padding: 12px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  transition: background 0.12s;
}
.nav-sheet-acc-btn:hover { background: var(--bg); }
.nav-sheet-acc-btn.open { background: var(--bg); border-left: 2px solid var(--accent); padding-left: 14px; }

/* Checklist card — reduce bottom padding on mobile since nav is outside the scroll area */
@media (max-width: 700px) {
  .checklist-card-scroll { padding-bottom: 20px !important; }
}

/* ── Checklist two-column layout ── */
.checklist-body {
  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
.checklist-left {
  width: 360px;
  flex-shrink: 0;
  border-right: 1px solid var(--rule);
  overflow-y: auto;
  padding: 24px 20px 48px;
}
.checklist-right {
  flex: 1;
  overflow-y: auto;
  padding: 24px 24px 48px;
  min-width: 0;
}
@media (max-width: 700px) {
  .checklist-body { display: block; overflow-y: auto; }
  .checklist-left { width: 100%; border-right: none; padding: 16px 16px 0; overflow: visible; }
  .checklist-right { padding: 0 16px 80px; overflow: visible; }
}

/* ── Read-only meta table ── */
.meta-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
.meta-table td {
  padding: 8px 0;
  border-bottom: 1px solid var(--rule);
  font-family: var(--font-mono);
  font-size: 11px;
  vertical-align: middle;
}
.meta-table td:first-child {
  color: var(--mute);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  width: 48%;
  padding-right: 8px;
}
.meta-table td:last-child { text-align: right; color: var(--ink); }
.meta-table tr:last-child td { border-bottom: none; }

/* ── Collapsible field row (mobile) ── */
.field-row-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
  background: none;

const SECTION_ORDER = ['General','Collection Page','Product Page','Cart','Checkout','Mobile/Performance'];
const SECTION_SHORT = {'General':'General','Collection Page':'Collection','Product Page':'Product','Cart':'Cart','Checkout':'Checkout','Mobile/Performance':'Mobile'};

const SECTIONS = SECTION_ORDER.map(s => ({
  id: s.toLowerCase().replace(/[^a-z]/g, '-').replace(/-+/g, '-'),

  short: SECTION_SHORT[s],
  items: AUDIT_ITEMS.filter(i => i.section === s),

// ── SORT UTILITIES ──
const IMPACT_RANK  = { High: 0, Medium: 1, Low: 2 };
const IMPACT_LABEL = { High: 'P0', Medium: 'P1', Low: 'P2' };
const FIX_TIME_RANK = { '< 30 min': 0, '1-2 hrs': 1, '1 day': 2, '3 days': 3, '1 week': 4, '2 weeks': 5, '1 month+': 6 };
const FIX_TIME_OPTIONS = ['< 30 min', '1-2 hrs', '1 day', '3 days', '1 week', '2 weeks', '1 month+'];

function quickWinsScore(item) {
  const fixRank = FIX_TIME_RANK[item.estimated_fix_time] ?? 2;
  return (2 - IMPACT_RANK[item.impact]) + (fixRank <= 1 ? 1 : 0);
}

function getGroupedItems(sortBy) {
  switch (sortBy) {
    case 'impact':
      return ['High', 'Medium', 'Low']
        .map(level => ({
          key: `impact-${level.toLowerCase()}`,
          label: `${level} Impact`,
          items: AUDIT_ITEMS.filter(i => i.impact === level),
        }))
        .filter(g => g.items.length > 0);
    case 'fix_time':
      return FIX_TIME_OPTIONS
        .map(v => ({ key: `ft-${v}`, label: v, items: AUDIT_ITEMS.filter(i => i.estimated_fix_time === v) }))
        .filter(g => g.items.length > 0);
    case 'quickwins':
      return [
        { key: 'qw-3', label: 'Quick Wins',       score: 3 },
        { key: 'qw-2', label: 'High Value',        score: 2 },
        { key: 'qw-1', label: 'Worth It',          score: 1 },
        { key: 'qw-0', label: 'Lower Priority',    score: 0 },
      ]
        .map(t => ({ ...t, items: AUDIT_ITEMS.filter(i => quickWinsScore(i) === t.score) }))
        .filter(g => g.items.length > 0);
    case 'lift':
      return [
        { key: 'lift-high', label: 'High Lift (≥30%)',    items: AUDIT_ITEMS.filter(i => i.lift_max >= 0.30) },
        { key: 'lift-med',  label: 'Medium Lift (15–29%)', items: AUDIT_ITEMS.filter(i => i.lift_max >= 0.15 && i.lift_max < 0.30) },
        { key: 'lift-low',  label: 'Lower Lift (<15%)',    items: AUDIT_ITEMS.filter(i => i.lift_max < 0.15) },
      ].filter(g => g.items.length > 0);
    default: // 'section'
      return SECTIONS.map(s => ({ key: s.id, label: s.label, items: s.items }));
  }
}

function sortItems(items, sortBy) {
  switch (sortBy) {
    case 'impact':
      return [...items].sort((a, b) => IMPACT_RANK[a.impact] - IMPACT_RANK[b.impact]);
    case 'fix_time':
      return [...items].sort((a, b) => FIX_TIME_RANK[a.estimated_fix_time] - FIX_TIME_RANK[b.estimated_fix_time]);
    case 'quickwins':
      return [...items].sort((a, b) => quickWinsScore(b) - quickWinsScore(a));
    case 'lift':
      return [...items].sort((a, b) => b.lift_max - a.lift_max);
    default:
      return items;
  }
}

function defaultPhase(item) {

function getItemState(audit, itemId) {

// ── SUPABASE DB HELPERS ──
async function fetchAuditsFromDB(userId) {
  const { data, error } = await _supabase
    .from('audits')

function preCheckItems(audit) {

function calcROI(audit, checkedIds) {
  const ci = audit.client_info || {};
  const revenue = parseFloat(ci.monthly_revenue) || 0;
  const aov     = parseFloat(ci.aov) || 85;
  const cvrRaw  = parseFloat(ci.cvr) || 1.8;
  const cvr     = cvrRaw / 100;
  const sessions = revenue > 0 ? revenue / (aov * cvr) : 0;

  const ids = checkedIds instanceof Set ? Array.from(checkedIds) : (checkedIds || []);

  // Sort items by lift_max descending — highest-impact findings get full decay credit
  const items = ids.map(id => AUDIT_ITEMS.find(i => i.id === id)).filter(Boolean);
  items.sort((a, b) => b.lift_max - a.lift_max);

  // ── Model tuning knobs ──────────────────────────────────────────────────────
  // DECAY: diminishing-return factor per subsequent finding (0 = no compounding, 1 = full stack).
  // Raise if projections feel too conservative; lower if they still stack unrealistically.
  const DECAY = 0.60;

  // CVR_PRACTICAL_MAX: absolute CVR ceiling for e-commerce (industry-agnostic default).
  // The sliding multiplier below scales down as the baseline approaches this value,
  // reflecting that high-performing stores have less room to improve.
  // Future: make this per-industry (apparel ~0.03, consumables ~0.05, etc.).
  const CVR_PRACTICAL_MAX = 0.05;

  // Sliding cap multiplier: 3.0× near 0% CVR, shrinks to 1.25× at CVR_PRACTICAL_MAX.
  // Stores with very low CVRs have more low-hanging fruit and can see larger relative gains.
  const room       = Math.max(0, (CVR_PRACTICAL_MAX - cvr) / CVR_PRACTICAL_MAX);
  const capMult    = 1.25 + room * 1.75;   // 1.25–3.0×
  // ────────────────────────────────────────────────────────────────────────────

  // Multiplicative compound model with diminishing-return decay.
  // Each fix multiplies the current CVR by (1 + adjusted_lift) rather than adding percentage points,
  // preventing linear stacking while preserving real compounding behaviour.
  let compMin = cvr, compMax = cvr, compMid = cvr;
  items.forEach((item, i) => {
    const d = Math.pow(DECAY, i);
    compMin *= (1 + item.lift_min * d);
    compMax *= (1 + item.lift_max * d);
    compMid *= (1 + ((item.lift_min + item.lift_max) / 2) * d);
  });

  // Sliding ceiling: projected CVR cannot exceed capMult × baseline (also capped at CVR_PRACTICAL_MAX)
  const ceiling = Math.min(cvr * capMult, CVR_PRACTICAL_MAX);
  compMin = Math.min(compMin, ceiling);
  compMax = Math.min(compMax, ceiling);
  compMid = Math.min(compMid, ceiling);

  // Relative lift % for display (e.g., 28.5 means +28.5% relative improvement)
  const cappedMin = items.length ? (compMin / cvr - 1) * 100 : 0;
  const cappedMax = items.length ? (compMax / cvr - 1) * 100 : 0;
  const cappedMid = items.length ? (compMid / cvr - 1) * 100 : 0;

  // Absolute pp gains and ceiling flag for display
  const cappedMinPP = (compMin - cvr) * 100;
  const cappedMaxPP = (compMax - cvr) * 100;
  const cappedMidPP = (compMid - cvr) * 100;
  const atCeiling   = compMid >= ceiling * 0.999;

  const newCVR          = compMid;
  const projCVRRaw      = compMid * 100;    // percentage form, parallel to cvrRaw
  const newRevenue      = sessions * aov * newCVR;
  const monthlyRecovery = newRevenue - revenue;
  const annualRecovery  = monthlyRecovery * 12;

  const pr = audit.pricing || {};
  const auditFee       = parseFloat(pr.audit_fee)  || 0;
  const hourlyRate     = parseFloat(pr.hourly_rate) || 0;
  const estHours       = parseFloat(pr.est_hours)  || 0;

  // Compute suggestedFee first so it can serve as the impl_fee default
  let highCount = 0;
  for (const id of ids) {
    if (AUDIT_ITEMS.find(i => i.id === id)?.impact === 'High') highCount++;
  }
  const highRatio      = ids.length ? highCount / ids.length : 0;
  const suggestedPct   = highRatio >= 0.5 ? 20 : highRatio >= 0.25 ? 15 : 10;
  const suggestedFee   = annualRecovery > 0 ? Math.round(annualRecovery * suggestedPct / 100) : 0;

  const implFee        = parseFloat(pr.impl_fee) || suggestedFee;
  const totalInvestment = auditFee + implFee;
  const roiMultiple    = totalInvestment > 0 ? annualRecovery / totalInvestment : 0;
  const paybackMonths  = totalInvestment > 0 && monthlyRecovery > 0 ? totalInvestment / monthlyRecovery : 0;
  const sanityCheck    = hourlyRate > 0 && estHours > 0
    ? (implFee >= hourlyRate * estHours * 0.9 ? 'pass' : implFee >= hourlyRate * estHours * 0.6 ? 'warn' : 'fail')
    : 'neutral';

  return {
    revenue, aov, cvrRaw, cvr, sessions,
    cappedMin, cappedMax, cappedMid, cappedMinPP, cappedMaxPP, cappedMidPP, atCeiling,
    newCVR, projCVRRaw, newRevenue, monthlyRecovery, annualRecovery,
    auditFee, implFee, hourlyRate, estHours, totalInvestment,
    roiMultiple, paybackMonths,
    highCount, suggestedPct, suggestedFee, sanityCheck,
    hasData: revenue > 0 && sessions > 0,
  };
}

function FieldBlock({ label, tag, tagStyle, hasReset, onReset, disabled, defaultOpen, children }) {

// Props: viewport ('mobile'|'desktop'|'both'|undefined), status, failsDesktop, failsMobile, onToggle, size
// For "both" + fail + card: renders a single 3-state cycle toggle (both → desktop → mobile → both).
// All other contexts: static display with per-icon opacity.
// Wrapped in React.memo with flat primitive props so sidebar items don't re-render on unrelated state changes.
const ViewportIcons = React.memo(function ViewportIcons({ viewport, status, failsDesktop, failsMobile, onToggle, size = 'card' }) {
  const vp = viewport || 'both';
  const isFail = status === 'fail';
  const isBoth = vp === 'both';
  const isCard = size === 'card';

  const px  = size === 'card' ? 20 : size === 'sidebar' ? 11 : 12;
  const pad = 2;

  const desktopApplies = vp === 'desktop' || vp === 'both';
  const mobileApplies  = vp === 'mobile'  || vp === 'both';

  // For "both" items in card view: always render the same DOM structure to prevent layout shift on status change.
  // Pass/TBD: wrapper is transparent and non-interactive; "+" stays in DOM at opacity:0.
  if (isBoth && isCard) {
    const deskLit = isFail && failsDesktop !== false;
    const mobLit  = isFail && failsMobile  !== false;
    const bothLit = deskLit && mobLit;
    const label   = bothLit ? 'Desktop + Mobile' : deskLit ? 'Desktop only' : 'Mobile only';
    return (
      <span
        role={isFail ? 'button' : undefined}
        tabIndex={isFail ? 0 : undefined}
        style={{ display:'inline-flex', gap:0, alignItems:'center', flexShrink:0,
          cursor: isFail ? 'pointer' : 'default', borderRadius:4, padding:'0 2px',
          background: isFail ? 'var(--state-fail-bg)' : 'transparent',
          transition:'background 0.15s' }}
        title={isFail ? `Fails on: ${label} — click to cycle` : undefined}
        onClick={isFail && onToggle ? () => onToggle() : undefined}>
        <span className={'vp-icon' + (deskLit ? ' lit' : '')}
          style={{ width:px, height:px, padding:pad, flexShrink:0,
            color: deskLit ? 'var(--state-fail)' : 'var(--ink-5)',
            opacity: deskLit ? 1 : 0.2 }}>
          {ICON_DESKTOP}
        </span>
        <span style={{ fontFamily:"var(--font-mono)", fontSize:12, fontWeight:900, lineHeight:1,
          color:'var(--state-fail)', opacity: bothLit ? 0.9 : 0,
          transition:'opacity 0.15s', userSelect:'none', flexShrink:0,
          transform:'translateX(1px)' }}>+</span>
        <span className={'vp-icon' + (mobLit ? ' lit' : '')}
          style={{ width:px, height:px, padding:pad, flexShrink:0,
            color: mobLit ? 'var(--state-fail)' : 'var(--ink-5)',
            opacity: mobLit ? 1 : 0.2 }}>
          {ICON_MOBILE}
        </span>
      </span>
    );
  }

  const desktopLit = isFail && (vp === 'desktop' || (isBoth && failsDesktop !== false));
  const mobileLit  = isFail && (vp === 'mobile'  || (isBoth && failsMobile  !== false));

  const vpIcon = (applies, lit, icon, label) => (
    <span
      className={'vp-icon' + (applies ? '' : ' vp-icon-na') + (lit ? ' lit' : '')}
      style={{ width:px, height:px, padding:pad, flexShrink:0,
        color: lit ? 'var(--state-fail)' : 'var(--ink-5)',
        opacity: applies ? (lit ? 1 : 0.2) : 0.12 }}
      title={label}>
      {icon}
    </span>
  );

  return (
    <span style={{ display:'inline-flex', gap:2, alignItems:'center', flexShrink:0 }}>
      {vpIcon(desktopApplies, desktopLit, ICON_DESKTOP, 'Desktop')}
      {vpIcon(mobileApplies,  mobileLit,  ICON_MOBILE,  'Mobile')}
    </span>
  );
});

function DonutChart({ pct, color, size = 52 }) {
  const r = (size - 6) / 2;
  const circ = 2 * Math.PI * r;
  const dash = (pct / 100) * circ;
  return React.createElement('svg', { width: size, height: size, style:{ flexShrink:0 } },
    React.createElement('circle', { cx:size/2, cy:size/2, r, fill:'none', stroke:'var(--rule)', strokeWidth:3 }),
    pct > 0 && React.createElement('circle', { cx:size/2, cy:size/2, r, fill:'none', stroke:color, strokeWidth:3,
      strokeDasharray:`${dash} ${circ}`, strokeLinecap:'round', transform:`rotate(-90 ${size/2} ${size/2})` }),
    pct > 0 && React.createElement('text', { x:size/2, y:size/2+4, textAnchor:'middle',
      fontFamily:"var(--font-mono)", fontSize:9, fill:color }, `${pct}%`)
  );
}

function AuditList({ store, onNew, onOpen, onArchive, onDuplicate, onDelete, onImport, onSaveClientInfo, user, onSignOut, auditsLoading, dbError, onDismissError }) {
  const importRef = useRef(null);
  const [menuOpen, setMenuOpen] = useState(null);
  const [view, setView] = useState(() => {
    if (demoMode) return 'table';
    try { return localStorage.getItem('triage-view') || 'table'; } catch { return 'table'; }
  });

  const audits = Object.values(store.audits).sort((a,b) => b.updated_at.localeCompare(a.updated_at));
  const atCap = audits.length >= THEME.limits.maxActiveAudits;
  const slotsOpen = THEME.limits.maxActiveAudits - audits.length;

  function switchView(v) {
    setView(v);
    if (!demoMode) { try { localStorage.setItem('triage-view', v); } catch {} }
  }

  // ── Per-audit helpers ──────────────────────────────────────────────────────
  const auditTitle   = a => a.client_info?.audit_title || a.client_info?.client_name || 'New Audit';
  const auditSubline = a => [a.client_info?.store_url, a.client_info?.client_name].filter(Boolean).join(' · ');
  const auditTheme   = a => a.client_info?.shopify_theme || '—';
  const auditProgress = a => {
    const done = Object.values(a.items || {}).filter(v => v.status && v.status !== 'tbd').length;
    return { done, pct: Math.round((done / 60) * 100) };
  };
  const auditFails = a => {
    const items = Object.entries(a.items || {});
    const fails = items.filter(([,v]) => v.status === 'fail');
    const p0 = fails.filter(([id]) => AUDIT_ITEMS.find(i => i.id === id)?.impact === 'High').length;
    return { total: fails.length, p0 };
  };
  const auditRecovery = a => {
    const ci = a.client_info || {};
    if (!ci.monthly_revenue) return null;
    const ids = preCheckItems(a);
    const roi = calcROI(a, ids);
    return roi.hasData && roi.monthlyRecovery > 0 ? roi.monthlyRecovery : null;
  };
  const auditStatus = a => {
    const { done } = auditProgress(a);
    if (done === 0) return 'not-started';
    if (done === 60) return 'complete';
    return 'in-progress';
  };
  const formatDate = iso => {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  };

  function handleImportFile(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.client_info) throw new Error();
        onImport(data);
      } catch { alert('Could not import. Make sure this is a valid triage JSON export.'); }
      e.target.value = '';
    };
    reader.readAsText(file);
  }

  // ── Row ⋯ menu ─────────────────────────────────────────────────────────────
  function AuditMenu({ auditId }) {
    const isOpen = menuOpen === auditId;
    const items = [
      { label:'Open',      action:() => { onOpen(auditId); setMenuOpen(null); } },
      { label:'Duplicate', action:() => { onDuplicate(auditId); setMenuOpen(null); } },
      ...(!demoMode ? [{ label:'Archive', sub:'Exports .json, frees a slot', action:() => { onArchive(auditId); setMenuOpen(null); } }] : []),
      { label:'Delete…', action:() => { onDelete(auditId); setMenuOpen(null); }, danger:true },
    ];
    return (
      <div style={{ position:'relative', flexShrink:0 }}>
        <button onClick={e => { e.stopPropagation(); setMenuOpen(isOpen ? null : auditId); }}
          style={{ width:36, height:36, display:'flex', alignItems:'center', justifyContent:'center',
            background:'none', border:'1px solid var(--rule)', color:'var(--mute)',
            fontFamily:'var(--font-mono)', fontSize:14, cursor:'pointer', letterSpacing:0.04 }}>
          ⋯
        </button>
        {isOpen && (
          <div style={{ position:'absolute', right:0, top:'100%', marginTop:2, background:'var(--bg)',
            border:'1px solid var(--ink)', zIndex:300, minWidth:220 }}
            onMouseLeave={() => setMenuOpen(null)}>
            {items.map((item, idx) => (
              <button key={item.label} onClick={item.action}
                style={{ display:'block', width:'100%', textAlign:'left', padding:'12px 16px',
                  background:'none', border:'none',
                  borderBottom: idx < items.length - 1 ? '1px solid var(--rule)' : 'none',
                  fontFamily:'var(--font-sans)', fontSize:14,
                  color: item.danger ? 'var(--loss)' : 'var(--ink)', cursor:'pointer' }}
                onMouseEnter={e => e.currentTarget.style.background='var(--surface)'}
                onMouseLeave={e => e.currentTarget.style.background='none'}>
                {item.label}
                {item.sub && (
                  <div style={{ fontFamily:'var(--font-mono)', fontSize:10, color:'var(--mute)',
                    marginTop:2, letterSpacing:'0.04em' }}>{item.sub}</div>
                )}
              </button>
            ))}
          </div>
        )}
      </div>
    );
  }

  // ── 60-cell mini map ───────────────────────────────────────────────────────
  function MiniMap({ audit }) {
    const cellColor = s => s === 'pass' ? 'var(--gain)' : s === 'fail' ? 'var(--loss)' : 'var(--rule)';
    return (
      <div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(10, 1fr)', gap:2, marginBottom:8 }}>
          {AUDIT_ITEMS.map(item => {
            const s = getItemState(audit, item.id).status;
            return (
              <div key={item.id} style={{ height:8, background:cellColor(s) }} title={item.name} />
            );
          })}
        </div>
        <div style={{ display:'flex', gap:12, fontFamily:'var(--font-mono)', fontSize:9,
          letterSpacing:'0.08em', textTransform:'uppercase', color:'var(--mute)' }}>
          {[['Pass','var(--gain)'],['Fail','var(--loss)'],['Not reviewed','var(--rule)']].map(([l,c]) => (
            <span key={l} style={{ display:'flex', alignItems:'center', gap:4 }}>
              <span style={{ width:8, height:8, background:c, display:'inline-block', flexShrink:0 }} />
              {l}
            </span>
          ))}
        </div>
      </div>
    );
  }

  // ── Shared header ──────────────────────────────────────────────────────────
  const Header = () => (
    <div style={{ display:'flex', alignItems:'center', gap:16, marginBottom:32, flexWrap:'wrap' }}>
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ fontFamily:'var(--font-mono)', fontSize:11, letterSpacing:'0.1em',
          textTransform:'uppercase', color:'var(--mute)', marginBottom:8 }}>
          {demoMode ? 'Demo' : 'Workspace'}
        </div>
        <h1 style={{ fontFamily:'var(--font-sans)', fontSize:36, fontWeight:600,
          letterSpacing:'-0.04em', lineHeight:1.02, color:'var(--ink)', margin:0 }}>
          Audits
        </h1>
      </div>
      <div style={{ display:'flex', alignItems:'center', gap:12, flexShrink:0, flexWrap:'wrap' }}>
        {/* Slot pips */}
        {!demoMode && (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-end', gap:4 }}>
            <div style={{ display:'flex', gap:3 }}>
              {Array.from({ length: THEME.limits.maxActiveAudits }).map((_, i) => (
                <div key={i} style={{ width:28, height:8,
                  background: i < audits.length ? 'var(--btn-bg)' : 'var(--rule)' }} />
              ))}
            </div>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:10, letterSpacing:'0.06em',
              color:'var(--mute)', textTransform:'uppercase' }}>
              {audits.length} of {THEME.limits.maxActiveAudits} active
            </span>
          </div>
        )}
        {/* TABLE / GRID toggle */}
        <div style={{ display:'flex', border:'1px solid var(--rule)', height:46 }}>
          {['table','grid'].map(v => (
            <button key={v} onClick={() => switchView(v)}
              style={{ padding:'0 16px', border:'none', fontFamily:'var(--font-mono)',
                fontSize:11, fontWeight:600, letterSpacing:'0.1em', textTransform:'uppercase',
                cursor:'pointer', transition:'background 0.12s, color 0.12s',
                background: view === v ? 'var(--ink)' : 'transparent',
                color: view === v ? 'var(--bg)' : 'var(--mute)',
                borderRight: v === 'table' ? '1px solid var(--rule)' : 'none' }}>
              {v}
            </button>
          ))}
        </div>
        {/* New audit */}
        <button onClick={onNew} disabled={!demoMode && atCap} className="btn btn-primary"
          style={{ height:46, opacity: (!demoMode && atCap) ? 0.35 : 1 }}>
          + New audit
        </button>
      </div>
    </div>
  );

  // ── Empty state ─────────────────────────────────────────────────────────────
  const EmptyState = () => (
    <div style={{ border:'1px solid var(--rule)', padding:'64px 48px', background:'var(--surface)' }}>
      <h2 style={{ fontFamily:'var(--font-sans)', fontSize:36, fontWeight:600,
        letterSpacing:'-0.04em', color:'var(--ink)', marginBottom:16, lineHeight:1.05 }}>
        Run your first <em className="hl" style={{ fontStyle:'normal' }}>audit.</em>
      </h2>
      <p style={{ fontFamily:'var(--font-sans)', fontSize:15, color:'var(--mute)', lineHeight:1.55,
        maxWidth:520, marginBottom:40 }}>
        60 checks across 6 sections of a Shopify store. Every failure gets a CVR lift range
        and a monthly dollar figure, then rolls into a report you hand the client.
      </p>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:24, marginBottom:48 }}>
        {[
          ['01','Setup',     'Client name, store URL, theme and revenue metrics.'],
          ['02','Checklist', '60 checks. Mark pass or fail. Capture evidence.'],
          ['03','Revenue',   'Every failure gets a CVR lift and a dollar figure.'],
          ['04','Report',    'Phase 1 quick wins + Phase 2 testing roadmap, print-ready.'],
        ].map(([n, label, body]) => (
          <div key={n}>
            <div style={{ fontFamily:'var(--font-mono)', fontSize:10, letterSpacing:'0.12em',
              textTransform:'uppercase', color:'var(--mute)', marginBottom:8 }}>{n}</div>
            <div style={{ fontFamily:'var(--font-sans)', fontSize:14, fontWeight:600,
              color:'var(--ink)', marginBottom:6 }}>{label}</div>
            <div style={{ fontFamily:'var(--font-sans)', fontSize:13, color:'var(--mute)', lineHeight:1.6 }}>{body}</div>
          </div>
        ))}
      </div>
      <div style={{ display:'flex', gap:12, alignItems:'center' }}>
        <button onClick={onNew} className="btn btn-primary btn-lg">+ Start first audit</button>
        {!demoMode && (
          <button onClick={() => importRef.current?.click()} className="btn btn-secondary btn-lg">
            Import .json
          </button>
        )}
      </div>
    </div>
  );

  // ── TABLE VIEW ──────────────────────────────────────────────────────────────
  const colMono = { fontFamily:'var(--font-mono)', fontSize:11, letterSpacing:'0.08em',
    textTransform:'uppercase', color:'var(--mute)', padding:'10px 16px', textAlign:'left',
    borderBottom:'1px solid var(--rule)', whiteSpace:'nowrap', background:'var(--surface)' };
  const TableView = () => (
    <div style={{ border:'1px solid var(--rule)' }}>
      {/* Header */}
      <div style={{ display:'grid', gridTemplateColumns:'1fr 100px 160px 80px 120px 100px 80px',
        background:'var(--surface)', borderBottom:'1px solid var(--rule)' }}>
        {['Audit','Theme','Progress','Fails','Est. Recovery','Updated',''].map((h,i) => (
          <div key={i} style={{ ...colMono, borderBottom:'none',
            textAlign: i >= 4 && i < 6 ? 'right' : 'left' }}>{h}</div>
        ))}
      </div>
      {/* Rows */}
      {audits.map(audit => {
        const { done, pct } = auditProgress(audit);
        const { total: failCount, p0 } = auditFails(audit);
        const recovery = auditRecovery(audit);
        const status = auditStatus(audit);
        return (
          <div key={audit.id}
            style={{ display:'grid', gridTemplateColumns:'1fr 100px 160px 80px 120px 100px 80px',
              borderBottom:'1px solid var(--rule)', alignItems:'center', cursor:'pointer',
              transition:'background 0.1s' }}
            onClick={() => onOpen(audit.id)}
            onMouseEnter={e => e.currentTarget.style.background='var(--surface)'}
            onMouseLeave={e => e.currentTarget.style.background='transparent'}>
            {/* AUDIT */}
            <div style={{ padding:'14px 16px' }}>
              <div style={{ fontFamily:'var(--font-sans)', fontSize:15, fontWeight:600,
                color:'var(--ink)', marginBottom:3, lineHeight:1.2,
                overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                {auditTitle(audit)}
              </div>
              <div style={{ fontFamily:'var(--font-mono)', fontSize:11, color:'var(--mute)',
                letterSpacing:'0.02em', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                {auditSubline(audit) || <span style={{ opacity:0.4 }}>—</span>}
              </div>
            </div>
            {/* THEME */}
            <div style={{ padding:'14px 16px', fontFamily:'var(--font-mono)', fontSize:12,
              color:'var(--mute)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
              {auditTheme(audit)}
            </div>
            {/* PROGRESS */}
            <div style={{ padding:'14px 16px' }}>
              <div style={{ height:6, background:'var(--rule)', marginBottom:5, position:'relative' }}>
                <div style={{ position:'absolute', left:0, top:0, height:'100%',
                  background: status === 'complete' ? 'var(--gain)' : 'var(--ink)',
                  width:`${pct}%`, transition:'width 0.3s' }} />
              </div>
              <div style={{ fontFamily:'var(--font-mono)', fontSize:10, color:'var(--mute)',
                letterSpacing:'0.04em' }}>
                {done}/60 · {status === 'not-started' ? 'Not started'
                  : status === 'complete' ? 'Report ready' : 'In progress'}
              </div>
            </div>
            {/* FAILS */}
            <div style={{ padding:'14px 16px' }}>
              {failCount > 0 ? (
                <span style={{ fontFamily:'var(--font-mono)', fontSize:13, fontWeight:600,
                  color:'var(--loss)', letterSpacing:'0.02em' }}>
                  {failCount}{p0 > 0 && <span style={{ fontSize:10, marginLeft:4 }}>· {p0} P0</span>}
                </span>
              ) : (
                <span style={{ fontFamily:'var(--font-mono)', fontSize:12, color:'var(--mute)' }}>—</span>
              )}
            </div>
            {/* EST. RECOVERY */}
            <div style={{ padding:'14px 16px', textAlign:'right' }}>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:13, fontWeight:600,
                color: recovery ? 'var(--gain)' : 'var(--mute)', letterSpacing:'0.02em' }}>
                {recovery ? `+$${fmt(recovery)}/mo` : '—'}
              </span>
            </div>
            {/* UPDATED */}
            <div style={{ padding:'14px 16px', fontFamily:'var(--font-mono)', fontSize:11,
              color:'var(--mute)', textAlign:'right', letterSpacing:'0.02em' }}>
              {formatDate(audit.updated_at)}
            </div>
            {/* ACTIONS */}
            <div style={{ padding:'8px 12px', display:'flex', alignItems:'center',
              gap:6, justifyContent:'flex-end' }}
              onClick={e => e.stopPropagation()}>
              <button onClick={() => onOpen(audit.id)} className="btn btn-secondary btn-sm">Open</button>
              <AuditMenu auditId={audit.id} />
            </div>
          </div>
        );
      })}
    </div>
  );

  // ── GRID VIEW ───────────────────────────────────────────────────────────────
  const GridView = () => (
    <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(280px, 1fr))', gap:12 }}>
      {audits.map(audit => {
        const { done, pct } = auditProgress(audit);
        const { total: failCount } = auditFails(audit);
        const recovery = auditRecovery(audit);
        const status = auditStatus(audit);
        const ctaLabel = status === 'complete' ? 'Report →' : status === 'in-progress' ? 'Resume →' : 'Start →';
        return (
          <div key={audit.id}
            style={{ border:'1px solid var(--rule)', background:'var(--surface)',
              display:'flex', flexDirection:'column', transition:'border-color 0.12s' }}
            onMouseEnter={e => e.currentTarget.style.borderColor='var(--ink)'}
            onMouseLeave={e => e.currentTarget.style.borderColor='var(--rule)'}>
            <div style={{ padding:'16px 18px 12px', borderBottom:'1px solid var(--rule)' }}>
              <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:8 }}>
                <div style={{ minWidth:0 }}>
                  <div style={{ fontFamily:'var(--font-sans)', fontSize:15, fontWeight:600,
                    color:'var(--ink)', lineHeight:1.2, marginBottom:3,
                    overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                    {auditTitle(audit)}
                  </div>
                  <div style={{ fontFamily:'var(--font-mono)', fontSize:10, color:'var(--mute)',
                    overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                    {audit.client_info?.store_url || '—'}
                  </div>
                </div>
                <div onClick={e => e.stopPropagation()}>
                  <AuditMenu auditId={audit.id} />
                </div>
              </div>
            </div>
            <div style={{ padding:'16px 18px' }}>
              <MiniMap audit={audit} />
            </div>
            <div style={{ padding:'0 18px 16px', display:'grid',
              gridTemplateColumns:'1fr 1fr 1fr', gap:8 }}>
              {[
                ['Reviewed', `${done}/60`],
                ['Fails',    failCount > 0 ? String(failCount) : '—'],
                ['/Mo',      recovery ? `+$${fmt(recovery)}` : '—'],
              ].map(([l, v]) => (
                <div key={l}>
                  <div style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.1em',
                    textTransform:'uppercase', color:'var(--mute)', marginBottom:3 }}>{l}</div>
                  <div style={{ fontFamily:'var(--font-mono)', fontSize:13, fontWeight:600,
                    color: l === '/Mo' && recovery ? 'var(--gain)' : 'var(--ink)' }}>{v}</div>
                </div>
              ))}
            </div>
            <div style={{ padding:'0 18px 18px', marginTop:'auto' }}>
              <button onClick={() => onOpen(audit.id)} className="btn btn-primary btn-full" style={{ height:40 }}>
                {ctaLabel}
              </button>
            </div>
          </div>
        );
      })}
      {/* Empty slot cards */}
      {!demoMode && Array.from({ length: Math.max(0, THEME.limits.maxActiveAudits - audits.length) }).map((_, i) => (
        <div key={`slot-${i}`}
          style={{ border:'1px dashed var(--rule)', minHeight:200, display:'flex', flexDirection:'column',
            alignItems:'center', justifyContent:'center', gap:8, padding:'24px', cursor:'pointer',
            transition:'border-color 0.12s' }}
          onClick={onNew}
          onMouseEnter={e => e.currentTarget.style.borderColor='var(--ink)'}
          onMouseLeave={e => e.currentTarget.style.borderColor='var(--rule)'}>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:10, letterSpacing:'0.1em',
            textTransform:'uppercase', color:'var(--mute)' }}>Open slot</div>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:11, fontWeight:600, letterSpacing:'0.08em',
            textTransform:'uppercase', color:'var(--mute)' }}>+ New audit</div>
        </div>
      ))}
    </div>
  );

  return (
    <React.Fragment>
      <input ref={importRef} type="file" accept=".json" style={{ display:'none' }} onChange={handleImportFile} />
      <main style={{ maxWidth:1100, margin:'0 auto', padding:'48px 32px 100px' }}>
        {/* Error banner */}
        {dbError && (
          <div style={{ marginBottom:20, padding:'12px 18px', background:'var(--state-fail-bg)',
            border:'1px solid var(--loss)', display:'flex', alignItems:'center', justifyContent:'space-between', gap:12 }}>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:11, color:'var(--loss)',
              letterSpacing:'0.04em', lineHeight:1.5 }}>{dbError}</span>
            <button onClick={onDismissError} style={{ background:'none', border:'none', color:'var(--mute)',
              fontFamily:'var(--font-mono)', fontSize:16, cursor:'pointer', lineHeight:1, padding:'0 4px', flexShrink:0 }}>×</button>
          </div>
        )}

        <Header />

        {/* Loading skeleton */}
        {auditsLoading && (
          <div style={{ display:'flex', flexDirection:'column', gap:1 }}>
            {[60,45,80].map((w,i) => (
              <div key={i} style={{ background:'var(--surface)', border:'1px solid var(--rule)',
                borderTop: i > 0 ? 'none' : undefined, height:64, padding:'0 16px',
                display:'flex', alignItems:'center', gap:16 }}>
                <div style={{ height:12, width:`${w}%`, background:'var(--rule)', maxWidth:240 }} />
              </div>
            ))}
          </div>
        )}

        {/* Empty state */}
        {!auditsLoading && audits.length === 0 && <EmptyState />}

        {/* Audit views */}
        {!auditsLoading && audits.length > 0 && (
          view === 'table' ? <TableView /> : <GridView />
        )}

        {/* Footer: slots + import */}
        {!auditsLoading && audits.length > 0 && !demoMode && (
          <div style={{ marginTop:20, borderTop:'1px solid var(--rule)', paddingTop:20,
            display:'flex', alignItems:'center', justifyContent:'space-between', gap:16, flexWrap:'wrap' }}>
            <div style={{ fontFamily:'var(--font-mono)', fontSize:11, color:'var(--mute)', letterSpacing:'0.04em' }}>
              {slotsOpen > 0
                ? `${slotsOpen} slot${slotsOpen !== 1 ? 's' : ''} open · Archive a delivered audit to free its slot.`
                : THEME.copy.workspaceFull}
            </div>
            <button onClick={() => !atCap && importRef.current?.click()} disabled={atCap}
              className="btn btn-secondary btn-sm" style={{ opacity: atCap ? 0.4 : 1 }}>
              Import .json
            </button>
          </div>
        )}
      </main>
    </React.Fragment>
  );
}

function ClientInfoOverlay({ audit, lastAuditorName, onSave, onClose, onSkip }) {
  const ci = audit?.client_info || {};
  const pr = audit?.pricing || {};
  const [form, setForm] = useState({
    audit_title:     ci.audit_title     || '',
    client_name:     ci.client_name     || '',
    auditor_name:    ci.auditor_name    || lastAuditorName || '',
    store_url:       ci.store_url       || '',
    shopify_theme:   ci.shopify_theme   || '',
    audit_date:      ci.audit_date      || today(),
    monthly_revenue: ci.monthly_revenue || '',
    aov:             ci.aov             || '',
    cvr:             ci.cvr             || '',
    audit_fee:       pr.audit_fee       || '',
  });
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const canSave = (form.audit_title.trim() || form.client_name.trim()) && form.auditor_name.trim();

  function handleSave(e) {
    e.preventDefault();
    onSave({
      client_info: {
        audit_title:     form.audit_title.trim(),
        client_name:     form.client_name.trim(),
        auditor_name:    form.auditor_name.trim(),
        store_url:       form.store_url.trim(),
        shopify_theme:   form.shopify_theme.trim(),
        audit_date:      form.audit_date,
        monthly_revenue: parseFloat(form.monthly_revenue) || 0,
        aov:             parseFloat(form.aov) || 0,
        cvr:             parseFloat(form.cvr) || 0,
      },
      pricing: { ...(audit?.pricing || {}), audit_fee: parseFloat(form.audit_fee) || 0 },
    });
  }

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-panel" onClick={e => e.stopPropagation()}>
        <div className="modal-header">
          <span style={{ fontFamily:"var(--font-sans)", fontSize:20, fontWeight:400, letterSpacing:'-0.3px' }}>
            Audit Info
          </span>
          <button onClick={onClose} style={{ background:'none', border:'none', color:'var(--ink-4)',
            fontFamily:"var(--font-mono)", fontSize:18, cursor:'pointer', lineHeight:1, padding:'0 4px' }}>
            ×
          </button>
        </div>
        {onSkip && (
          <div style={{ background:'rgba(200,131,74,0.1)', borderBottom:'1px solid rgba(200,131,74,0.25)',
            padding:'10px 24px', display:'flex', alignItems:'center', justifyContent:'space-between', gap:12 }}>
            <span style={{ fontFamily:"var(--font-sans)", fontSize:13, color:'var(--amber)', lineHeight:1.4 }}>
              Revenue data is needed to calculate projected uplift. Fill it in now, or skip to see lift percentages only.
            </span>
            <button type="button" onClick={onSkip}
              style={{ fontFamily:"var(--font-mono)", fontSize:10, letterSpacing:'0.06em', textTransform:'uppercase',
                background:'none', border:'1px solid rgba(200,131,74,0.4)', color:'var(--amber)',
                padding:'4px 10px', cursor:'pointer', whiteSpace:'nowrap', flexShrink:0 }}>
              Skip for now →
            </button>
          </div>
        )}
        <form onSubmit={handleSave}>
          <div className="modal-body">
            <div style={{ marginBottom:18 }}>
              <div style={{ fontFamily:"var(--font-mono)", fontSize:10, letterSpacing:'0.1em', textTransform:'uppercase',
                color:'var(--ink-5)', marginBottom:12 }}>Audit Details</div>
              <div className="field" style={{ marginBottom:10 }}>
                <label>Audit Title</label>
                <CIInput value={form.audit_title} onChange={v => set('audit_title', v)} placeholder="e.g. Acme Boards Q3 2026" />
              </div>
              <div className="fg2">
                <div className="field">
                  <label>Client Name</label>
                  <CIInput value={form.client_name} onChange={v => set('client_name', v)} placeholder="Acme Boards Co." />
                </div>
                <div className="field">
                  <label>Auditor Name *</label>
                  <CIInput value={form.auditor_name} onChange={v => set('auditor_name', v)} placeholder="Your name" />
                </div>
              </div>
              <div className="fg3">
                <div className="field">
                  <label>Store URL</label>
                  <CIInput value={form.store_url} onChange={v => set('store_url', v)} placeholder="example.myshopify.com" />
                </div>
                <div className="field">
                  <label>Shopify Theme</label>
                  <CIInput value={form.shopify_theme} onChange={v => set('shopify_theme', v)} placeholder="Dawn" />
                </div>
                <div className="field">
                  <label>Audit Date</label>
                  <CIInput type="date" value={form.audit_date} onChange={v => set('audit_date', v)} />
                </div>
              </div>
            </div>
            <div>
              <div style={{ fontFamily:"var(--font-mono)", fontSize:10, letterSpacing:'0.1em', textTransform:'uppercase',
                color:'var(--ink-5)', marginBottom:12 }}>Store Metrics</div>
              <div className="fg4">
                <div className="field">
                  <label>Monthly Revenue ($)</label>
                  <CIInput type="number" value={form.monthly_revenue} onChange={v => set('monthly_revenue', v)} placeholder="50000" min="0" />
                </div>
                <div className="field">
                  <label>Avg. Order Value ($)</label>
                  <CIInput type="number" value={form.aov} onChange={v => set('aov', v)} placeholder="85" min="0" />
                </div>
                <div className="field">
                  <label>Conversion Rate (%)</label>
                  <CIInput type="number" value={form.cvr} onChange={v => set('cvr', v)} placeholder="1.8" step="0.01" min="0" />
                </div>
                <div className="field field-private">
                  <label>Audit Fee ($)</label>
                  <CIInput type="number" value={form.audit_fee} onChange={v => set('audit_fee', v)} placeholder="2500" min="0" />
                </div>
              </div>
            </div>
          </div>
          <div className="modal-footer">
            <button type="button" className="btn btn-ghost" onClick={onClose}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={!canSave}>{onSkip ? 'Save and Continue →' : 'Save Changes'}</button>
          </div>
        </form>
      </div>
    </div>
  );
}
function NewAuditModal({ lastAuditorName, onSubmit, onClose }) {
  const [form, setForm] = useState({
    audit_title:     '',
    client_name:     '',
    auditor_name:    lastAuditorName || '',
    store_url:       '',
    shopify_theme:   '',
    audit_date:      today(),
    monthly_revenue: '',
    aov:             '',
    cvr:             '',
    audit_fee:       '',
  });
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
