    <div style={{ display:'flex', gap:4, flexWrap:'wrap' }}>
      {options.map(opt => {
        const active = value === opt.value;
        return (
          <button key={opt.value} onClick={() => onChange(opt.value)}
            style={{
              fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.08em',
              textTransform:'uppercase', padding:'4px 8px', cursor:'pointer',
              border: active ? '1px solid var(--btn-bg)' : '1px solid var(--rule-2)',
              background: active ? 'var(--btn-bg)' : 'transparent',
              color: active ? 'var(--btn-ink)' : 'var(--ink-4)',
              transition:'all 0.12s',
              whiteSpace:'nowrap',
            }}>
            {opt.label}
          </button>
        );
      })}
    </div>
  );
}

// ── Checklist sort groups (includes 'priority' mode not in getGroupedItems) ──
function getChecklistGroups(sort) {
  if (sort === 'priority') {
    return [
      { key:'p0', label:'P0 · High',   items: AUDIT_ITEMS.filter(i => i.impact === 'High') },
      { key:'p1', label:'P1 · Medium', items: AUDIT_ITEMS.filter(i => i.impact === 'Medium') },
      { key:'p2', label:'P2 · Low',    items: AUDIT_ITEMS.filter(i => i.impact === 'Low') },
    ].filter(g => g.items.length > 0);
  }
  return getGroupedItems(sort);
}

function ChecklistStage({ audit, onUpdateItem, onScrollToFindings, onContextChange, cardGlowTrigger }) {
  const [activeItemId, setActiveItemId] = useState(AUDIT_ITEMS[0].id);
  const [checklistSort, setChecklistSort] = useState('section');
  const [sortDropdownOpen, setSortDropdownOpen] = useState(false);
  const [hoverCell, setHoverCell] = useState(null); // { item, rect }
  const [showNotes, setShowNotes] = useState(false);
  const [showDetails, setShowDetails] = useState(false);
  const [cardGlowing, setCardGlowing] = useState(false);
  const [revertMsg, setRevertMsg] = useState(false);
  const [failTooltipVisible, setFailTooltipVisible] = useState(false);

  const failTooltipSeen = useRef(
    !demoMode && !!(() => { try { return localStorage.getItem('triage-fail-tooltip-seen'); } catch { return false; } })()
  );
  const mapStripRef = useRef(null);
  const cellElRefs = useRef({});
  const cardRef = useRef(null);
  const touchStartX = useRef(null);
  const touchStartY = useRef(null);

  // ── Derived ──────────────────────────────────────────────────────────────────
  const groups = getChecklistGroups(checklistSort);
  const allItemsFlat = groups.flatMap(g => g.items);
  const activeIdx = allItemsFlat.findIndex(i => i.id === activeItemId);
  const prevItem = activeIdx > 0 ? allItemsFlat[activeIdx - 1] : null;
  const nextItem = activeIdx < allItemsFlat.length - 1 ? allItemsFlat[activeIdx + 1] : null;
  const activeItem = AUDIT_ITEMS.find(i => i.id === activeItemId) || AUDIT_ITEMS[0];
  const activeSection = SECTIONS.find(s => s.items.some(i => i.id === activeItemId));
  const sectionItems = activeSection?.items || [];
  const sectionItemIdx = sectionItems.findIndex(i => i.id === activeItemId);
  const globalIdx = AUDIT_ITEMS.findIndex(i => i.id === activeItemId);
  const itemState = getItemState(audit, activeItemId);
  const isFail = itemState.status === 'fail';

  const totalDone = AUDIT_ITEMS.filter(i => {
    const s = getItemState(audit, i.id).status;
    return s === 'pass' || s === 'fail' || s === 'na';
  }).length;
  const totalFails = AUDIT_ITEMS.filter(i => getItemState(audit, i.id).status === 'fail').length;

  // Monthly recovery estimate for current item when FAIL
  const itemRecovery = (() => {
    if (!isFail) return null;
    const ci = audit.client_info || {};
    const revenue = parseFloat(ci.monthly_revenue) || 0;
    if (!revenue) return null;
    const aov = parseFloat(ci.aov) || 85;
    const cvr = parseFloat(ci.cvr) || 1.8;
    const sessions = revenue / (aov * (cvr / 100));
    const midLift = (activeItem.lift_min + activeItem.lift_max) / 2 / 100;
    return Math.round(sessions * aov * midLift);
  })();

  // ── Effects ───────────────────────────────────────────────────────────────
  useEffect(() => {
    if (!cardGlowTrigger) return;
    setCardGlowing(true);
    const t = setTimeout(() => setCardGlowing(false), 950);
    return () => clearTimeout(t);
  }, [cardGlowTrigger]);

  useEffect(() => {
    onContextChange?.({ short: activeSection?.short || '', idx: sectionItemIdx + 1, len: sectionItems.length });
  }, [activeItemId]);

  useEffect(() => {
    if (!revertMsg) return;
    const t = setTimeout(() => setRevertMsg(false), 3500);
    return () => clearTimeout(t);
  }, [revertMsg]);

  // Scroll active cell into view in the map strip
  useEffect(() => {
    const el = cellElRefs.current[activeItemId];
    const strip = mapStripRef.current;
    if (!el || !strip) return;
    // Walk up to find offset relative to strip's scrollable area
    let offset = 0;
    let node = el;
    while (node && node !== strip) { offset += node.offsetLeft; node = node.offsetParent; }
    const width = el.offsetWidth;
    if (offset < strip.scrollLeft + 60) strip.scrollLeft = offset - 60;
    else if (offset + width > strip.scrollLeft + strip.clientWidth - 60)
      strip.scrollLeft = offset + width - strip.clientWidth + 60;
  }, [activeItemId, checklistSort]);

  // ── Navigation ───────────────────────────────────────────────────────────
  function goTo(item) {
    setActiveItemId(item.id);
    setShowDetails(false);
    setShowNotes(false);
    if (cardRef.current) cardRef.current.scrollTop = 0;
  }

  // ── Status handling ───────────────────────────────────────────────────────
  function handleStatusClick(optId) {
    if (optId === 'fail') {
      if (itemState.status === 'fail' && activeItem.primary_viewport === 'both') {
        // Cycle: both → mobile only → desktop only → both
        const d = itemState.fails_on_desktop !== false;
        const m = itemState.fails_on_mobile  !== false;
        if (d && m)       onUpdateItem(audit.id, activeItemId, { fails_on_desktop: false, fails_on_mobile: true });
        else if (!d && m) onUpdateItem(audit.id, activeItemId, { fails_on_desktop: true,  fails_on_mobile: false });
        else              onUpdateItem(audit.id, activeItemId, { fails_on_desktop: true,  fails_on_mobile: true });
      } else {
        const updates = { status: 'fail' };
        if (activeItem.primary_viewport === 'both') {
          updates.fails_on_desktop = true;
          updates.fails_on_mobile  = true;
          if (!failTooltipSeen.current) {
            failTooltipSeen.current = true;
            if (!demoMode) { try { localStorage.setItem('triage-fail-tooltip-seen', '1'); } catch {} }
            setFailTooltipVisible(true);
            setTimeout(() => setFailTooltipVisible(false), 3400);
          }
        }
        onUpdateItem(audit.id, activeItemId, updates);
      }
    } else {
      onUpdateItem(audit.id, activeItemId, { status: optId });
    }
  }

  // ── Keyboard shortcuts ────────────────────────────────────────────────────
  useEffect(() => {
    function handleKey(e) {
      const tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.key === 'j' || e.key === 'J' || e.key === 'ArrowRight') { if (nextItem) goTo(nextItem); }
      else if (e.key === 'k' || e.key === 'K' || e.key === 'ArrowLeft') { if (prevItem) goTo(prevItem); }
      else if (e.key === 'p' || e.key === 'P') handleStatusClick('pass');
      else if (e.key === 'f' || e.key === 'F') handleStatusClick('fail');
      else if (e.key === 't' || e.key === 'T') handleStatusClick('tbd');
      else if (e.key === 'n' || e.key === 'N') handleStatusClick('na');
    }
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, [activeItemId, prevItem, nextItem, itemState]);

  // ── Cell status color ─────────────────────────────────────────────────────
  function cellColor(itemId) {
    const s = getItemState(audit, itemId).status;
    if (s === 'pass' || s === 'na') return 'var(--gain)';
    if (s === 'fail') return 'var(--loss)';
    if (s === 'tbd')  return 'var(--mute)';
    return 'var(--rule-2)'; // slightly more visible than --rule for unreviewed
  }

  // ── Sort options ──────────────────────────────────────────────────────────
  const SORT_OPTIONS = [
    { value:'section',  label:'Section',    note:'Grouped by store area' },
    { value:'priority', label:'Priority',   note:'P0 first · highest CVR impact' },
    { value:'quickwins',label:'Quick wins', note:'Fastest to ship first' },
    { value:'lift',     label:'CVR lift',   note:'Highest lift range first' },
  ];
  const activeSortLabel = SORT_OPTIONS.find(o => o.value === checklistSort)?.label || 'Section';
  const truncate = (str, n=28) => str && str.length > n ? str.slice(0, n) + '…' : str;

  // ── Viewport state for FAIL key display ───────────────────────────────────
  const failD = itemState.fails_on_desktop !== false;
  const failM = itemState.fails_on_mobile  !== false;
  const dApplies = activeItem.primary_viewport !== 'mobile';
  const mApplies = activeItem.primary_viewport !== 'desktop';
  const dOpacity = !isFail ? 0.15 : (dApplies ? (failD ? 1 : 0.3) : 0.12);
  const mOpacity = !isFail ? 0.15 : (mApplies ? (failM ? 1 : 0.3) : 0.12);

  // ── Render ────────────────────────────────────────────────────────────────
  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, minHeight:0, overflow:'hidden' }}>

      {/* ── Map strip ── */}
      <div style={{ background:'var(--surface)', borderBottom:'1px solid var(--rule)', flexShrink:0 }}>
        {/* Strip row: sort button + scrollable cells + summary */}
        <div style={{ display:'flex', alignItems:'stretch', height:56, position:'relative' }}>

          {/* Sort button — sticky left */}
          <div style={{ position:'sticky', left:0, zIndex:10, flexShrink:0,
            background:'var(--surface)', borderRight:'1px solid var(--rule)',
            display:'flex', alignItems:'center' }}>
            <button
              onClick={() => setSortDropdownOpen(v => !v)}
              style={{ padding:'0 14px', height:'100%', background:'none', border:'none',
                fontFamily:'var(--font-mono)', fontSize:10, fontWeight:600,
                letterSpacing:'0.08em', textTransform:'uppercase',
                color: sortDropdownOpen ? 'var(--ink)' : 'var(--mute)',
                cursor:'pointer', display:'flex', alignItems:'center', gap:6,
                whiteSpace:'nowrap' }}>
              ⇅ {activeSortLabel} ▾
            </button>
            {sortDropdownOpen && (
              <div style={{ position:'absolute', top:'100%', left:0, background:'var(--bg)',
                border:'1px solid var(--ink)', zIndex:50, minWidth:220 }}
                onMouseLeave={() => setSortDropdownOpen(false)}>
                {SORT_OPTIONS.map(opt => (
                  <button key={opt.value}
                    onClick={() => { setChecklistSort(opt.value); setSortDropdownOpen(false); }}
                    style={{ display:'block', width:'100%', padding:'12px 16px', background:'none', border:'none',
                      borderBottom:'1px solid var(--rule)', textAlign:'left', cursor:'pointer',
                      background: checklistSort === opt.value ? 'var(--surface)' : 'transparent' }}
                    onMouseEnter={e => e.currentTarget.style.background='var(--surface)'}
                    onMouseLeave={e => e.currentTarget.style.background = checklistSort === opt.value ? 'var(--surface)' : 'transparent'}>
                    <div style={{ fontFamily:'var(--font-mono)', fontSize:11, fontWeight:600,
                      letterSpacing:'0.06em', textTransform:'uppercase',
                      color: checklistSort === opt.value ? 'var(--accent-text)' : 'var(--ink)', marginBottom:2 }}>
                      {opt.label}
                    </div>
                    <div style={{ fontFamily:'var(--font-mono)', fontSize:10, color:'var(--mute)',
                      letterSpacing:'0.04em' }}>{opt.note}</div>
                  </button>
                ))}
              </div>
            )}
          </div>

          {/* Scrollable cells */}
          <div ref={mapStripRef} style={{ flex:1, overflowX:'auto', scrollbarWidth:'none',
            display:'flex', alignItems:'center', gap:0, padding:'0 12px' }}>
            <style>{`.map-strip::-webkit-scrollbar{display:none}`}</style>
            {groups.map((group, gi) => {
              const groupDone = group.items.filter(i => {
                const s = getItemState(audit, i.id).status;
                return s === 'pass' || s === 'fail' || s === 'na';
              }).length;
              return (
                <div key={group.key} style={{ display:'flex', alignItems:'center', gap:6,
                  flexShrink:0, marginRight:16 }}>
                  {/* Group label */}
                  <div style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.08em',
                    textTransform:'uppercase', color:'var(--mute)', whiteSpace:'nowrap',
                    marginRight:4, flexShrink:0 }}>
                    {group.label}
                    <span style={{ marginLeft:4, color: groupDone === group.items.length ? 'var(--gain)' : 'var(--mute)',
                      opacity:0.7 }}>{groupDone}/{group.items.length}</span>
                  </div>
                  {/* Cells */}
                  {group.items.map(item => {
                    const isActive = item.id === activeItemId;
                    const color = cellColor(item.id);
                    return (
                      <div key={item.id}
                        ref={el => { cellElRefs.current[item.id] = el; }}
                        onClick={() => goTo(item)}
                        onMouseEnter={e => {
                          const rect = e.currentTarget.getBoundingClientRect();
                          setHoverCell({ item, x: rect.left + rect.width / 2, y: rect.bottom + 6 });
                        }}
                        onMouseLeave={() => setHoverCell(null)}
                        style={{ width:18, height:18, background:color, cursor:'pointer',
                          flexShrink:0, position:'relative',
                          outline: isActive ? '2px solid var(--ink)' : 'none',
                          outlineOffset: isActive ? '2px' : '0',
                          transition:'outline 0.1s' }} />
                    );
                  })}
                </div>
              );
            })}
          </div>

          {/* Summary — right */}
          <div className="desktop-only" style={{ flexShrink:0, borderLeft:'1px solid var(--rule)',
            padding:'0 16px', display:'flex', alignItems:'center', gap:12,
            fontFamily:'var(--font-mono)', fontSize:10, color:'var(--mute)',
            letterSpacing:'0.04em', whiteSpace:'nowrap' }}>
            <span>{totalDone}/60 reviewed</span>
            {totalFails > 0 && <span style={{ color:'var(--loss)' }}>{totalFails} fail{totalFails !== 1 ? 's' : ''}</span>}
          </div>
        </div>
      </div>

      {/* ── Cell hover tooltip (fixed, rendered outside strip overflow) ── */}
      {hoverCell && (
        <div style={{ position:'fixed', left: Math.min(hoverCell.x - 150, window.innerWidth - 316),
          top: hoverCell.y, width:300, background:'var(--bg)', border:'1px solid var(--ink)',
          padding:'12px 14px', zIndex:200, pointerEvents:'none',
          boxShadow:'0 4px 16px rgba(0,0,0,0.12)' }}>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.1em',
            textTransform:'uppercase', color:'var(--mute)', marginBottom:6 }}>
            {hoverCell.item.section} · {getItemState(audit, hoverCell.item.id).status?.toUpperCase() || 'NOT REVIEWED'}
          </div>
          <div style={{ fontFamily:'var(--font-sans)', fontSize:15, fontWeight:600,
            color:'var(--ink)', lineHeight:1.25, marginBottom:4 }}>
            {hoverCell.item.name.split(':')[0]}
          </div>
          {hoverCell.item.name.includes(':') && (
            <div style={{ fontFamily:'var(--font-sans)', fontSize:13, color:'var(--mute)', lineHeight:1.5 }}>
              {hoverCell.item.name.split(':').slice(1).join(':').trim()}
            </div>
          )}
        </div>
      )}

      {/* ── Item card — two-column on desktop ── */}
      <div className="checklist-body"
        ref={cardRef}
        tabIndex={-1}
        onTouchStart={e => { touchStartX.current = e.touches[0].clientX; touchStartY.current = e.touches[0].clientY; }}
        onTouchEnd={e => {
          if (touchStartX.current === null) return;
          const dx = e.changedTouches[0].clientX - touchStartX.current;
          const dy = Math.abs(e.changedTouches[0].clientY - touchStartY.current);
          touchStartX.current = null; touchStartY.current = null;
          if (dy > 60 || Math.abs(dx) < 50) return;
          if (dx < 0 && nextItem) goTo(nextItem);
          if (dx > 0 && prevItem) goTo(prevItem);
        }}>

        {/* ── LEFT COLUMN: meta + status keys + data table ── */}
        <div className="checklist-left">

          {/* Meta line */}
          <div style={{ fontFamily:'var(--font-mono)', fontSize:10, letterSpacing:'0.1em',
            textTransform:'uppercase', color:'var(--mute)', marginBottom:12 }}>
            {activeSection?.label || activeItem.section}
            {' · '}
            <span className="desktop-only">Item {String(sectionItemIdx + 1).padStart(2,'0')} of {sectionItems.length} · #{globalIdx + 1} of 60</span>
            <span className="mobile-only">{String(sectionItemIdx + 1).padStart(2,'0')}/{sectionItems.length}</span>
          </div>

          {/* Title + question */}
          <div className={cardGlowing ? 'card-glow' : undefined} style={{ marginBottom:20 }}>
            {(() => {
              const colonIdx = activeItem.name.indexOf(':');
              const title = colonIdx === -1 ? activeItem.name : activeItem.name.slice(0, colonIdx);
              const question = colonIdx === -1 ? null : activeItem.name.slice(colonIdx + 1).trim();
              return (
                <>
                  <h2 style={{ fontFamily:'var(--font-sans)', fontSize:22, fontWeight:600,
                    letterSpacing:'-0.03em', lineHeight:1.2, color:'var(--ink)',
                    marginBottom: question ? 8 : 0 }}>
                    {title}
                  </h2>
                  {question && (
                    <p style={{ fontFamily:'var(--font-sans)', fontSize:15, color:'var(--mute)',
                      lineHeight:1.55, margin:0 }}>
                      {question}
                    </p>
                  )}
                </>
              );
            })()}
          </div>

          {/* Status keys — 4 column, 80px tall */}
          <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:6,
            marginBottom:0, position:'relative' }}>
            {[
              { id:'pass', label:'Pass', shortcut:'P',
                activeBg:'var(--gain)', activeColor:'var(--bg)', activeBorder:'var(--gain)',
                idleBg:'var(--surface)', idleColor:'var(--mute)' },
              { id:'fail', label:'Flag', shortcut:'F',
                activeBg:'var(--loss)', activeColor:'var(--bg)', activeBorder:'var(--loss)',
                idleBg:'var(--surface)', idleColor:'var(--mute)' },
              { id:'tbd',  label:'TBD',  shortcut:'T',
                activeBg:'var(--ink)', activeColor:'var(--bg)', activeBorder:'var(--ink)',
                idleBg:'var(--surface)', idleColor:'var(--mute)' },
              { id:'na',   label:'N/A',  shortcut:'N',
                activeBg:'var(--ink)', activeColor:'var(--bg)', activeBorder:'var(--ink)',
                idleBg:'var(--surface)', idleColor:'var(--mute)' },
            ].map(opt => {
              const active = itemState.status === opt.id;
              return (
                <button key={opt.id} onClick={() => handleStatusClick(opt.id)}
                  style={{ height:60, position:'relative', cursor:'pointer',
                    background: active ? opt.activeBg : opt.idleBg,
                    border: `1px solid ${active ? opt.activeBorder : 'var(--rule)'}`,
                    color: active ? opt.activeColor : opt.idleColor,
                    transition:'background 0.12s, border-color 0.12s, color 0.12s',
                    display:'flex', padding: 6, flexDirection:'column', alignItems:'flex-start',
                    justifyContent:'flex-start', gap:4 }}>
                  {/* Keyboard shortcut — top right, desktop only */}
                  <span className="desktop-only" style={{ position:'absolute', bottom:6, right:7,
                    fontFamily:'var(--font-mono)', fontSize:11, fontWeight:600,
                    opacity:0.55, lineHeight:1 }}>
                    {opt.shortcut}
                  </span>
                  <span style={{ fontFamily:'var(--font-mono)', fontSize:11, fontWeight:600,
                    letterSpacing:'0.08em', textTransform:'uppercase' }}>
                    {opt.label}
                  </span>
                  {/* Viewport icons in FAIL key */}
                  {opt.id === 'fail' && (
                    <div style={{ display:'flex', alignItems:'center', gap:3,
                      position:'absolute', bottom:7, left:8 }}>
                      <svg width="14" height="11" viewBox="0 0 14 11" fill="none"
                        style={{ opacity: dOpacity, transition:'opacity 0.15s' }}>
                        <rect x="0.5" y="0.5" width="13" height="8" stroke="currentColor" strokeWidth="1"/>
                        <rect x="4" y="9" width="6" height="1.5" fill="currentColor"/>
                        <rect x="2" y="10" width="10" height="0.5" fill="currentColor"/>
                      </svg>
                      <span style={{ fontFamily:'var(--font-mono)', fontSize:9, fontWeight:900,
                          lineHeight:1, color:'currentColor', opacity: failD && failM && isFail ? 0.9 : 0 }}>+</span>
                      <svg width="8" height="13" viewBox="0 0 8 13" fill="none"
                        style={{ opacity: mOpacity, transition:'opacity 0.15s' }}>
                        <rect x="0.5" y="0.5" width="7" height="12" stroke="currentColor" strokeWidth="1"/>
                        <rect x="3" y="10.5" width="2" height="1.5" fill="currentColor"/>
                      </svg>
                    </div>
                  )}
                </button>
              );
            })}

            {/* First-time FAIL tooltip — rendered via a portal-like fixed div outside the grid */}
          </div>

          {/* First-time FAIL tooltip — fixed so it doesn't clip inside the column */}
          {failTooltipVisible && (
            <div style={{ position:'fixed', bottom:120, left:'50%', transform:'translateX(-50%)',
              width:300, background:'var(--ink)', color:'var(--bg)', padding:'14px 16px',
              zIndex:500, pointerEvents:'none',
              animation:'fadeIn 0.2s ease' }}>
              <div style={{ fontFamily:'var(--font-mono)', fontSize:10, fontWeight:600,
                letterSpacing:'0.1em', textTransform:'uppercase', marginBottom:6, color:'var(--accent)' }}>
                Fails on desktop + mobile
              </div>
              <div style={{ fontFamily:'var(--font-sans)', fontSize:13, lineHeight:1.5, color:'var(--bg)', opacity:0.85 }}>
                Click Flag again for mobile only, then desktop only.
              </div>
            </div>
          )}

          {/* Read-only meta table (desktop) */}
          <table className="meta-table desktop-only">
            <tbody>
              <tr>
                <td>Priority</td>
                <td>{activeItem.impact} · {IMPACT_LABEL[activeItem.impact]}</td>
              </tr>
              <tr>
                <td>Est. fix time</td>
                <td>
                  <select value={itemState.estimated_fix_time}
                    onChange={e => onUpdateItem(audit.id, activeItemId, { estimated_fix_time: e.target.value })}
                    style={{ fontFamily:'var(--font-mono)', fontSize:11, background:'transparent',
                      color:'var(--ink)', border:'none', cursor:'pointer',
                      appearance:'none', WebkitAppearance:'none', textAlign:'right' }}>
                    {FIX_TIME_OPTIONS.map(v => React.createElement('option', { key:v, value:v }, v))}
                  </select>
                </td>
              </tr>
              <tr>
                <td>Impact area</td>
                <td>{activeItem.impact_area}</td>
              </tr>
              <tr>
                <td>Shopify fix</td>
                <td>{activeItem.shopify_fix_complexity}</td>
              </tr>
              <tr>
                <td>CVR lift</td>
                <td style={{ color:'var(--gain)' }}>+{activeItem.lift_min}–{activeItem.lift_max}%</td>
              </tr>
              {isFail && itemRecovery !== null && (
                <tr>
                  <td>Est. recovery if fixed</td>
                  <td style={{ color:'var(--gain)', fontWeight:600, fontSize:14 }}>
                    +${fmt(itemRecovery)}/MO
                  </td>
                </tr>
              )}
            </tbody>
          </table>

          {/* Mobile meta row: single line */}
          <div className="mobile-only" style={{ fontFamily:'var(--font-mono)', fontSize:11,
            color:'var(--mute)', letterSpacing:'0.06em', marginTop:12, marginBottom:4,
            display:'flex', alignItems:'center', justifyContent:'space-between' }}>
            <span>
              {activeItem.impact} · {IMPACT_LABEL[activeItem.impact]}
              {' · '}{itemState.estimated_fix_time}
              {' · '}{activeItem.shopify_fix_complexity}
            </span>
            {isFail && itemRecovery !== null && (
              <span style={{ color:'var(--gain)', fontWeight:600 }}>+${fmt(itemRecovery)}/MO</span>
            )}
          </div>

          {/* Desktop prev/next inside left column */}
          <div className="desktop-only" style={{ display:'grid', gridTemplateColumns:'1fr 1fr',
            gap:6, marginTop:24 }}>
            <button onClick={() => prevItem && goTo(prevItem)} disabled={!prevItem}
              style={{ background:'var(--surface)', border:'1px solid var(--rule)',
                color: prevItem ? 'var(--ink)' : 'var(--mute)', padding:'11px 12px',
                cursor: prevItem ? 'pointer' : 'default', opacity: prevItem ? 1 : 0.35,
                textAlign:'left', display:'flex', flexDirection:'column', gap:3 }}>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.08em',
                textTransform:'uppercase', color:'var(--mute)' }}>← Prev</span>
              {prevItem && <span style={{ fontFamily:'var(--font-sans)', fontSize:11,
                color:'var(--ink)', lineHeight:1.2 }}>{truncate(prevItem.name.split(':')[0])}</span>}
            </button>
            <button onClick={() => nextItem ? goTo(nextItem) : onScrollToFindings()}
              style={{ background: nextItem ? 'var(--surface)' : 'var(--btn-bg)',
                border: nextItem ? '1px solid var(--rule)' : 'none',
                color: nextItem ? 'var(--ink)' : 'var(--btn-ink)',
                padding:'11px 12px', cursor:'pointer',
                textAlign:'right', display:'flex', flexDirection:'column', gap:3, alignItems:'flex-end' }}>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.08em',
                textTransform:'uppercase', color: nextItem ? 'var(--mute)' : 'var(--btn-ink)' }}>
                {nextItem ? 'Next →' : 'Findings →'}
              </span>
              {nextItem && <span style={{ fontFamily:'var(--font-sans)', fontSize:11,
                color:'var(--ink)', lineHeight:1.2 }}>{truncate(nextItem.name.split(':')[0])}</span>}
            </button>
          </div>
          <div className="desktop-only" style={{ marginTop:12, fontFamily:'var(--font-mono)',
            fontSize:10, color:'var(--mute)', letterSpacing:'0.06em' }}>
            J/K move
          </div>

        </div>{/* end checklist-left */}

        {/* ── RIGHT COLUMN: text fields ── */}
        <div className="checklist-right">

          {/* FINDING */}
          <FieldBlock
            label="Finding" tag="IN REPORT" tagColor="var(--loss)"
            hasReset={!!(audit.items?.[activeItemId]?.finding)}
            onReset={() => onUpdateItem(audit.id, activeItemId, { finding: undefined })}
            disabled={!isFail}>
            <AuditTextarea value={itemState.finding} placeholder={activeItem.default_finding}
              onChange={v => onUpdateItem(audit.id, activeItemId, { finding: v })} rows={4} />
          </FieldBlock>

          {/* RECOMMENDATION */}
          <FieldBlock
            label="Recommendation" tag="IN REPORT"
            hasReset={!!(audit.items?.[activeItemId]?.recommendation)}
            onReset={() => onUpdateItem(audit.id, activeItemId, { recommendation: undefined })}
            disabled={!isFail}>
            <AuditTextarea value={itemState.recommendation} placeholder={activeItem.default_recommendation}
              onChange={v => onUpdateItem(audit.id, activeItemId, { recommendation: v })} rows={4} />
          </FieldBlock>

          {/* SCREENSHOT URL */}
          <FieldBlock label="Screenshot URL" tag="IN REPORT" disabled={!isFail}>
            <AuditUrlInput value={itemState.screenshot_url}
              onChange={v => onUpdateItem(audit.id, activeItemId, { screenshot_url: v })} />
          </FieldBlock>

          {/* NOTES — private */}
          <FieldBlock label="Notes" tag="PRIVATE" tagStyle="private">
            <AuditTextarea value={itemState.notes}
              placeholder="Private notes (not in report)…"
              onChange={v => onUpdateItem(audit.id, activeItemId, { notes: v })} rows={8} />
          </FieldBlock>

        </div>{/* end checklist-right */}

      </div>{/* end checklist-body */}

      {/* Mobile prev/next — outside scroll area */}
      <div className="mobile-only" style={{ display:'grid', gridTemplateColumns:'1fr 1fr',
        borderTop:'1px solid var(--rule)', flexShrink:0 }}>
        <button onClick={() => prevItem && goTo(prevItem)} disabled={!prevItem}
          style={{ background:'var(--surface)', border:'none', borderRight:'1px solid var(--rule)',
            color: prevItem ? 'var(--ink)' : 'var(--mute)', padding:'14px',
            cursor: prevItem ? 'pointer' : 'default', opacity: prevItem ? 1 : 0.35,
            textAlign:'left', display:'flex', flexDirection:'column', gap:3 }}>
          <span style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.08em',
            textTransform:'uppercase', color:'var(--mute)' }}>← Prev</span>
          {prevItem && <span style={{ fontFamily:'var(--font-sans)', fontSize:12, color:'var(--ink)',
            lineHeight:1.2 }}>{truncate(prevItem.name.split(':')[0])}</span>}
        </button>
        <button onClick={() => nextItem ? goTo(nextItem) : onScrollToFindings()}
          style={{ background: nextItem ? 'var(--surface)' : 'var(--btn-bg)',
            border:'none', color: nextItem ? 'var(--ink)' : 'var(--btn-ink)',
            padding:'14px', cursor:'pointer',
            textAlign:'right', display:'flex', flexDirection:'column', gap:3, alignItems:'flex-end' }}>
          <span style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.08em',
            textTransform:'uppercase', color: nextItem ? 'var(--mute)' : 'var(--btn-ink)' }}>
            {nextItem ? 'Next item →' : 'Findings →'}
          </span>
          {nextItem && <span style={{ fontFamily:'var(--font-sans)', fontSize:12, color:'var(--ink)',
            lineHeight:1.2 }}>{truncate(nextItem.name.split(':')[0])}</span>}
        </button>
      </div>

    </div>
  );
}

function useIsMobile(bp) {
  const [m, setM] = useState(window.innerWidth <= bp);
  useEffect(() => {
    const h = () => setM(window.innerWidth <= bp);
    window.addEventListener('resize', h);
    return () => window.removeEventListener('resize', h);
  }, [bp]);
  return m;
}

function RevenueStage({ audit, checkedIds, setCheckedIds, onUpdateItem, onUpdatePricing, onSavePitch }) {
  const ci = audit.client_info || {};
  const pr = audit.pricing || {};
  const failItems = AUDIT_ITEMS.filter(i => getItemState(audit, i.id).status === 'fail');
  const isMobile = useIsMobile(900);

  const [cols, setCols] = useState({ sec: true, imp: true, time: true, lift: true });
  const [sort, setSort] = useState('imp');
  const [pitchEdit, setPitchEdit] = useState(false);
  const [pitchDraft, setPitchDraft] = useState('');
  const [pricingOpen, setPricingOpen] = useState(false);
  const [sanityEdit, setSanityEdit] = useState(false);
  const sanityRateRef = useRef(null);
  useEffect(() => { if (sanityEdit && sanityRateRef.current) sanityRateRef.current.focus(); }, [sanityEdit]);

  useEffect(() => {
    if (checkedIds === null && failItems.length > 0) setCheckedIds(preCheckItems(audit));
  }, []);

  const ids = checkedIds || new Set();
  const roi = calcROI(audit, ids);

  const toggle = id => setCheckedIds(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  function togglePhase(itemId) {
    if (!onUpdateItem) return;
    const cur = getItemState(audit, itemId).phase;
    onUpdateItem(itemId, { phase: cur === 'quick-win' ? 'test' : 'quick-win' });
  }
  function setPricing(k, v) { onUpdatePricing(audit.id, { ...pr, [k]: parseFloat(v) || 0 }); }

  const sorters = {
    imp:  (a, b) => IMPACT_RANK[a.impact] - IMPACT_RANK[b.impact] || b.lift_max - a.lift_max,
    sec:  (a, b) => a.section.localeCompare(b.section),
    time: (a, b) => (FIX_TIME_RANK[a.estimated_fix_time] ?? 99) - (FIX_TIME_RANK[b.estimated_fix_time] ?? 99),
    lift: (a, b) => b.lift_max - a.lift_max,
  };
  const sorted = [...failItems].sort(sorters[sort] || sorters.imp);
  const quick  = sorted.filter(i => getItemState(audit, i.id).phase === 'quick-win');
  const test   = sorted.filter(i => getItemState(audit, i.id).phase !== 'quick-win');

  function rowMo(item) {
    const rev = parseFloat(ci.monthly_revenue) || 0;
    const aov = parseFloat(ci.aov) || 85;
    const cvr = parseFloat(ci.cvr) || 1.8;
    if (!rev) return 0;
    return (rev / (aov * (cvr / 100))) * aov * ((item.lift_min + item.lift_max) / 2 / 100);
  }
  function groupSum(rows) { return rows.filter(i => ids.has(i.id)).reduce((s, i) => s + rowMo(i), 0); }

  const groups = [
    { key:'PHASE 1', title:'Quick wins',       desc:'Ship in week 1 · implementation fee',      rows:quick, sum:groupSum(quick) },
    { key:'PHASE 2', title:'Testing roadmap',  desc:'A/B test over 12 weeks · monthly retainer', rows:test,  sum:groupSum(test), trailer:' if proven' },
  ];

  const gridCols = ['28px','minmax(0,1fr)',cols.sec&&'120px',cols.imp&&'96px',cols.time&&'80px',cols.lift&&'110px','74px','80px'].filter(Boolean).join(' ');

  // Pitch
  const autoPitch = generatePitch(audit, roi, ids);
  const pitchText = audit.pitch_text || autoPitch;
  const openEdit  = () => { setPitchDraft(pitchText); setPitchEdit(true); };
  const savePitch = t  => { onSavePitch(audit.id, t); setPitchEdit(false); };
  const resetPitch = () => { onSavePitch(audit.id, ''); setPitchEdit(false); };

  // Pricing
  const implFee       = parseFloat(pr.impl_fee) || 0;
  const auditFee      = parseFloat(pr.audit_fee) || 0;
  const retainerRate  = parseFloat(pr.retainer_rate) || 0;
  const retainerMos   = parseFloat(pr.retainer_months) !== undefined ? parseFloat(pr.retainer_months) : 3;
  const totalEng      = auditFee + implFee + retainerRate * retainerMos;
  const testCount     = test.filter(i => ids.has(i.id)).length;
  const canSanity     = roi.hourlyRate > 0 && roi.estHours > 0 && implFee > 0;
  const feeBase       = totalEng || roi.totalInvestment;
  const roiLine = roi.hasData && roi.monthlyRecovery > 0 && feeBase > 0
    ? `${(roi.annualRecovery / feeBase).toFixed(1)}× return on $${fmt(feeBase)} · pays back in ${(feeBase / roi.monthlyRecovery).toFixed(1)} months`
    : null;

  const P_COLOR = { High:'var(--impact-high)', Medium:'var(--impact-medium)', Low:'var(--ink-5)' };
  const P_BG    = { High:'var(--impact-high-bg)', Medium:'var(--impact-medium-bg)', Low:'var(--paper-3)' };

  function PBadge({ impact, muted }) {
    return (
      <span style={{ fontFamily:'var(--font-mono)', fontSize:10, padding:'2px 6px',
        background: muted ? 'transparent' : P_BG[impact],
        color: muted ? 'var(--ink-5)' : P_COLOR[impact],
        border:`1px solid ${muted ? 'var(--rule)' : P_COLOR[impact] + '44'}`,
        letterSpacing:'0.04em', whiteSpace:'nowrap' }}>
        {IMPACT_LABEL[impact] || impact}
      </span>
    );
  }

  function ColChip({ k, label }) {
    const on = cols[k];
    return (
      <button onClick={() => setCols(c => ({ ...c, [k]:!c[k] }))}
        style={{ height:34, display:'flex', alignItems:'center', gap:6, padding:'0 10px',
          background:'transparent', border:`1px solid ${on ? 'var(--rule)' : 'transparent'}`,
          color: on ? 'var(--ink)' : 'var(--ink-5)', fontFamily:'var(--font-mono)',
          fontSize:11, fontWeight:600, letterSpacing:'.06em', cursor:'pointer' }}>
        <span style={{ width:12, height:12, boxSizing:'border-box', display:'grid', placeItems:'center',
          background: on ? 'var(--btn-bg)' : 'transparent',
          border:`1px solid ${on ? 'var(--btn-bg)' : 'var(--ink-5)'}`,
          color:'var(--btn-ink)', fontSize:9 }}>{on ? '✓' : ''}</span>
        {label}
      </button>
    );
  }

  function HeadBtn({ label, sortKey, align='left' }) {
    const active = sort === sortKey;
    return (
      <button onClick={() => sortKey && setSort(sortKey)}
        style={{ padding:0, background:'transparent', border:0, textAlign:align,
          fontFamily:'var(--font-mono)', fontSize:11, fontWeight: active ? 600 : 500,
          letterSpacing:'.08em', color: active ? 'var(--ink)' : 'var(--ink-5)',
          cursor: sortKey ? 'pointer' : 'default', whiteSpace:'nowrap' }}>
        {label}{active && sortKey ? ' ↓' : ''}
      </button>
    );
  }

  function FindingRow({ item }) {
    const checked = ids.has(item.id);
    const phase   = getItemState(audit, item.id).phase;
    const state   = getItemState(audit, item.id);
    const isQW    = phase === 'quick-win';
    const mo      = rowMo(item);
    const ink     = checked ? 'var(--ink)' : 'var(--ink-5)';
    const liftInk = checked ? 'var(--gain)' : 'var(--ink-5)';
    const rowBg   = checked ? 'var(--bg)' : 'var(--surface)';
    const title   = item.name.split(':')[0];
    const finding = state.finding || '';

    if (isMobile) {
      return (
        <div className="rev-row" style={{ background:rowBg }}>
          <button onClick={() => toggle(item.id)}
            style={{ width:44, height:44, padding:0, display:'grid', placeItems:'center', background:'transparent', border:0, cursor:'pointer' }}>
            <span style={{ width:24, height:24, boxSizing:'border-box', display:'grid', placeItems:'center',
              background: checked ? 'var(--btn-bg)' : 'transparent',
              border:`1px solid ${checked ? 'var(--btn-bg)' : 'var(--ink-5)'}`,
              color:'var(--btn-ink)', fontSize:15, fontWeight:700 }}>{checked ? '✓' : ''}</span>
          </button>
          <div style={{ display:'flex', flexDirection:'column', gap:4, minWidth:0 }}>
            <span style={{ fontSize:16, fontWeight:600, color:ink }}>{title}</span>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:12, color:'var(--ink-5)' }}>
              {IMPACT_LABEL[item.impact]} · {state.estimated_fix_time}
            </span>
          </div>
          <span style={{ fontFamily:'var(--font-mono)', fontSize:14, fontWeight:600, color:liftInk }}>
            {checked && roi.hasData ? `+$${fmt(mo)}` : '—'}
          </span>
        </div>
      );
    }

    return (
      <div className="rev-row" style={{ gridTemplateColumns:gridCols, background:rowBg }}>
        <button onClick={() => toggle(item.id)}
          style={{ width:22, height:22, padding:0, boxSizing:'border-box', display:'grid', placeItems:'center',
            background: checked ? 'var(--btn-bg)' : 'transparent',
            border:`1px solid ${checked ? 'var(--btn-bg)' : 'var(--ink-5)'}`,
            color:'var(--btn-ink)', fontSize:14, fontWeight:700, cursor:'pointer' }}>
          {checked ? '✓' : ''}
        </button>
        <div style={{ display:'flex', flexDirection:'column', gap:3, minWidth:0 }}>
          <span style={{ fontSize:15, fontWeight:600, color:ink }}>{title}</span>
          {finding && <span style={{ fontSize:14, color:'var(--ink-5)' }}>{finding}</span>}
        </div>
        {cols.sec  && <span style={{ fontSize:14, color:ink }}>{SECTION_SHORT[item.section] || item.section}</span>}
        {cols.imp  && <PBadge impact={item.impact} muted={!checked} />}
        {cols.time && <span style={{ fontFamily:'var(--font-mono)', fontSize:13, color:ink }}>{state.estimated_fix_time}</span>}
        {cols.lift && <span style={{ fontFamily:'var(--font-mono)', fontSize:13, color:liftInk }}>+{item.lift_min}–{item.lift_max}%</span>}
        <button onClick={e => { e.stopPropagation(); togglePhase(item.id); }}
          style={{ height:28, padding:'0 8px', background:'transparent', border:'1px solid var(--rule)',
            color:'var(--ink)', fontFamily:'var(--font-mono)', fontSize:11, fontWeight:600,
            letterSpacing:'.06em', cursor:'pointer' }}>
          {isQW ? '→ TEST' : '→ SHIP'}
        </button>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:15, fontWeight:600, textAlign:'right', color:liftInk }}>
          {checked && roi.hasData ? `+$${fmt(mo)}` : '—'}
        </span>
      </div>
    );
  }

  function GroupHeader({ g }) {
    const sumInk = g.sum > 0 ? 'var(--gain)' : 'var(--ink-5)';
    if (isMobile) {
      return (
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline',
          padding:'16px 16px 8px', borderBottom:`1px solid var(--ink)` }}>
          <span style={{ fontSize:15, fontWeight:600 }}>{g.title}</span>
          <span style={{ fontFamily:'var(--font-mono)', fontSize:12, fontWeight:600, color:sumInk }}>
            {g.sum > 0 ? `+$${fmt(g.sum)}/mo${g.trailer || ''}` : '—'}
          </span>
        </div>
      );
    }
    return (
      <div style={{ display:'flex', alignItems:'baseline', gap:12, padding:'14px 18px 10px',
        borderBottom:'1px solid var(--rule)', background:'var(--bg)' }}>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:11, fontWeight:600, letterSpacing:'.1em', color:'var(--ink-5)' }}>{g.key}</span>
        <span style={{ fontSize:16, fontWeight:600 }}>{g.title}</span>
        <span style={{ fontSize:14, color:'var(--ink-5)' }}>{g.desc}</span>
        <div style={{ flex:1 }} />
        <span style={{ fontFamily:'var(--font-mono)', fontSize:13, fontWeight:600, color:sumInk }}>
          {g.sum > 0 ? `+$${fmt(g.sum)}/mo${g.trailer || ''}` : '—'}
        </span>
      </div>
    );
  }

  function PricingRail() {
    const suggested = roi.hasData && roi.annualRecovery > 0
      ? fmt(roi.suggestedFee || Math.round(roi.annualRecovery * 0.2)) : '—';
    const floor  = roi.hourlyRate * roi.estHours;
    const above  = implFee - floor;
    const abovePct = floor > 0 ? Math.round(above / floor * 100) : 0;
    const scColor = { pass:'var(--gain)', warn:'var(--amber)', fail:'var(--impact-high)' };
    return (
      <div style={{ display:'flex', flexDirection:'column', gap:14, padding:'18px 24px' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline' }}>
          <span style={{ fontFamily:'var(--font-mono)', fontSize:12, letterSpacing:'.06em', color:'var(--ink-5)' }}>PHASE 1 · SUGGESTED FEE</span>
          <span style={{ fontSize:22, fontWeight:600, letterSpacing:'-0.03em' }}>${suggested}</span>
        </div>
        <label style={{ display:'flex', flexDirection:'column', gap:6 }}>
          <span style={{ fontFamily:'var(--font-mono)', fontSize:12, fontWeight:500, letterSpacing:'.08em' }}>YOUR IMPLEMENTATION FEE</span>
          <div style={{ display:'flex', height:46, border:'1px solid var(--ink)', background:'var(--bg)', alignItems:'center' }}>
            <span style={{ paddingLeft:12, fontFamily:'var(--font-mono)', color:'var(--ink-5)' }}>$</span>
            <input value={pr.impl_fee || ''} onChange={e => setPricing('impl_fee', e.target.value)}
              placeholder={roi.suggestedFee ? fmt(roi.suggestedFee) : '3500'}
              style={{ flex:1, minWidth:0, padding:'0 8px', background:'transparent', border:0, color:'var(--ink)',
                fontFamily:'var(--font-mono)', fontSize:17, fontWeight:600, outline:'none' }} />
            {auditFee > 0 && <span style={{ paddingRight:12, fontFamily:'var(--font-mono)', fontSize:12, color:'var(--ink-5)' }}>+ ${fmt(auditFee)} audit</span>}
          </div>
        </label>
        <div style={{ border:`1px solid ${!sanityEdit && canSanity ? (scColor[roi.sanityCheck] || 'var(--rule)') : 'var(--rule)'}`,
          fontFamily:'var(--font-mono)', fontSize:12 }}>
          {sanityEdit ? (
            <div style={{ display:'flex', alignItems:'center', gap:6, padding:'8px 12px' }}>
              <span style={{ color:'var(--ink-5)', fontSize:11, whiteSpace:'nowrap' }}>$/hr</span>
              <input ref={sanityRateRef} value={pr.hourly_rate || ''} onChange={e => setPricing('hourly_rate', e.target.value)}
                placeholder="100"
                onKeyDown={e => { if (e.key === 'Enter') setSanityEdit(false); }}
                style={{ width:52, padding:'2px 6px', background:'var(--bg)', border:'1px solid var(--ink)',
                  color:'var(--ink)', fontFamily:'var(--font-mono)', fontSize:13, outline:'none', minWidth:0 }} />
              <span style={{ color:'var(--ink-5)', fontSize:11 }}>×</span>
              <input value={pr.est_hours || ''} onChange={e => setPricing('est_hours', e.target.value)}
                placeholder="30"
                onKeyDown={e => { if (e.key === 'Enter') setSanityEdit(false); }}
                style={{ width:44, padding:'2px 6px', background:'var(--bg)', border:'1px solid var(--ink)',
                  color:'var(--ink)', fontFamily:'var(--font-mono)', fontSize:13, outline:'none', minWidth:0 }} />
              <span style={{ color:'var(--ink-5)', fontSize:11, flex:1 }}>hrs</span>
              <button onClick={() => setSanityEdit(false)}
                style={{ background:'var(--btn-bg)', color:'var(--btn-ink)', border:0, padding:'3px 10px',
                  fontFamily:'var(--font-mono)', fontSize:11, fontWeight:600, letterSpacing:'.08em', cursor:'pointer' }}>
                DONE
              </button>
            </div>
          ) : (
            <div style={{ display:'flex', alignItems:'center', gap:8, padding:'10px 12px' }}>
              {canSanity && (
                <span style={{ background: scColor[roi.sanityCheck] || 'var(--ink-5)', color:'var(--bg)',
                  fontWeight:600, padding:'2px 6px', fontSize:10, letterSpacing:'.08em', flexShrink:0 }}>
                  {roi.sanityCheck.toUpperCase()}
                </span>
              )}
              <span style={{ flex:1, color: canSanity ? 'var(--ink)' : 'var(--ink-5)' }}>
                {canSanity ? (
                  <>
                    <span onClick={() => setSanityEdit(true)}
                      style={{ textDecoration:'underline', textDecorationStyle:'dotted', cursor:'pointer' }}>
                      ${roi.hourlyRate}/hr
                    </span>
                    {' × '}
                    <span onClick={() => setSanityEdit(true)}
                      style={{ textDecoration:'underline', textDecorationStyle:'dotted', cursor:'pointer' }}>
                      {roi.estHours}h
                    </span>
                    {` floor · ${above >= 0 ? '+' : ''}${abovePct}%`}
                  </>
                ) : 'Set hourly rate + hours to check your fee'}
              </span>
              <button onClick={() => setSanityEdit(true)}
                style={{ background:'transparent', border:0, color:'var(--ink-3)', cursor:'pointer',
                  padding:'0 2px', fontSize:14, lineHeight:1, flexShrink:0 }}
                title="Edit hourly rate and hours">
                ✎
              </button>
            </div>
          )}
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:10, paddingTop:14, borderTop:'1px solid var(--rule)' }}>
          <span style={{ fontFamily:'var(--font-mono)', fontSize:12, letterSpacing:'.06em', color:'var(--ink-5)' }}>PHASE 2 · TESTING RETAINER</span>
          <div style={{ display:'grid', gridTemplateColumns:'1.4fr 1fr', gap:10, minWidth:0 }}>
            {[['retainer_rate','1500','/ month'],['retainer_months','3','months']].map(([k,ph,unit]) => (
              <div key={k} style={{ display:'flex', height:44, border:'1px solid var(--rule)', background:'var(--bg)',
                alignItems:'center', fontFamily:'var(--font-mono)', fontSize:14, padding:'0 12px', justifyContent:'space-between',
                minWidth:0, overflow:'hidden' }}>
                <input value={pr[k] !== undefined && pr[k] !== 0 ? pr[k] : ''} onChange={e => setPricing(k, e.target.value)}
                  placeholder={ph}
                  style={{ flex:1, minWidth:0, background:'transparent', border:0, color:'var(--ink)',
                    fontFamily:'var(--font-mono)', fontSize:14, outline:'none' }} />
                <span style={{ color:'var(--ink-5)', fontSize:12, flexShrink:0 }}>{unit}</span>
              </div>
            ))}
          </div>
          <span style={{ fontFamily:'var(--font-mono)', fontSize:12, color:'var(--ink-5)' }}>
            {testCount} test{testCount !== 1 ? 's' : ''} · ~4 weeks each · renews monthly
          </span>
        </div>
        {totalEng > 0 && (
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline',
            padding:'12px 0', borderTop:'1px solid var(--rule)' }}>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:12, letterSpacing:'.06em', color:'var(--ink-5)' }}>TOTAL ENGAGEMENT</span>
            <span style={{ fontSize:22, fontWeight:600 }}>${fmt(totalEng)}</span>
          </div>
        )}
      </div>
    );
  }

  if (failItems.length === 0) {
    return (
      <div className="rev-stage" style={{ alignItems:'center', justifyContent:'center' }}>
        <div style={{ textAlign:'center', padding:40, fontFamily:'var(--font-sans)', fontSize:14, color:'var(--ink-5)' }}>
          No failures marked yet — go back to the checklist and mark items as Fail.
        </div>
      </div>
    );
  }

  const annual = roi.hasData && roi.annualRecovery > 0 ? `$${fmt(roi.annualRecovery)}` : '—';

  return (
    <div className="rev-stage">
      {/* Mobile summary bar */}
      <div className="rev-mob-bar" style={{ gridTemplateColumns:'1fr auto', alignItems:'end', gap:8,
        padding:'16px', background:'var(--surface)', borderBottom:'1px solid var(--rule)' }}>
        <div style={{ display:'flex', flexDirection:'column', gap:2 }}>
          <span style={{ fontFamily:'var(--font-mono)', fontSize:10, letterSpacing:'.08em', color:'var(--ink-5)' }}>ANNUAL AT RISK · IN REPORT</span>
          <span style={{ fontSize:40, fontWeight:600, letterSpacing:'-0.045em', lineHeight:1, color:'var(--gain)' }}>{annual}</span>
        </div>
        <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-end', gap:2, fontFamily:'var(--font-mono)', fontSize:12 }}>
          <span style={{ fontWeight:600 }}>{roi.hasData ? `+$${fmt(roi.monthlyRecovery)}/mo` : '—'}</span>
          <span>{roi.hasData ? `${fmtPct(roi.cvrRaw)} → ${fmtPct(roi.projCVRRaw)}` : ''}</span>
          {roi.hasData && roi.roiMultiple > 0 && <span style={{ color:'var(--ink-5)' }}>{roi.roiMultiple.toFixed(1)}× ROI</span>}
        </div>
      </div>

      <div className="rev-grid">
        {/* ── Left: findings ── */}
        <div className="rev-main">
          {/* Desktop header */}
          {!isMobile && (
            <div style={{ display:'flex', alignItems:'flex-end', gap:16, flexWrap:'wrap' }}>
              <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                <h1 style={{ margin:0, fontSize:32, fontWeight:600, letterSpacing:'-0.04em', lineHeight:1.05 }}>Findings</h1>
                <p style={{ margin:0, fontSize:16, color:'var(--ink-5)' }}>Select what items to include in the report. Decide what is a quick win and what is a testing candidate.</p>
              </div>
              <div style={{ flex:1 }} />
              <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:12, fontWeight:500, letterSpacing:'.08em', color:'var(--ink-5)' }}>COLUMNS</span>
                <div style={{ display:'flex', gap:6 }}>
                  {[['sec','SECTION'],['imp','PRIORITY'],['time','FIX TIME'],['lift','CVR LIFT']].map(([k,l]) => <ColChip key={k} k={k} label={l} />)}
                </div>
              </div>
            </div>
          )}

          {/* Table */}
          <div style={{ display:'flex', flexDirection:'column', border:'1px solid var(--rule)' }}>
            <div className="rev-head" style={{ gridTemplateColumns:gridCols }}>
              <HeadBtn label="" sortKey={null} />
              <HeadBtn label="FINDING" sortKey={null} />
              {cols.sec  && <HeadBtn label="SECTION"  sortKey="sec" />}
              {cols.imp  && <HeadBtn label="PRIORITY" sortKey="imp" />}
              {cols.time && <HeadBtn label="FIX TIME" sortKey="time" />}
              {cols.lift && <HeadBtn label="CVR LIFT" sortKey="lift" />}
              <HeadBtn label="PHASE" sortKey={null} />
              <HeadBtn label="/MO" sortKey={null} align="right" />
            </div>
            {groups.map(g => g.rows.length > 0 && (
              <React.Fragment key={g.key}>
                <GroupHeader g={g} />
                {g.rows.map(item => <FindingRow key={item.id} item={item} />)}
              </React.Fragment>
            ))}
          </div>

          {/* Mobile pricing disclosure */}
          <div className="rev-mob-pricing-row"
            style={{ alignItems:'center', justifyContent:'space-between', height:56,
              padding:'0 16px', borderTop:`2px solid var(--ink)`, cursor:'pointer' }}
            onClick={() => setPricingOpen(o => !o)}>
            <span style={{ display:'flex', gap:8, alignItems:'center' }}>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:10, fontWeight:600,
                background:'var(--ink)', color:'var(--bg)', padding:'3px 6px' }}>PRIVATE</span>
              <span style={{ fontSize:15, fontWeight:600 }}>Your pricing</span>
            </span>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:13 }}>
              {implFee > 0 ? `$${fmt(implFee)}` : '—'}{retainerRate > 0 ? ` + $${fmt(retainerRate)}/mo` : ''} {'▾'}
            </span>
          </div>
          {pricingOpen && <div style={{ padding:'0 16px 16px' }}>{PricingRail()}</div>}

          {/* Pitch paragraph (desktop only) */}
          {!isMobile && (
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:12, fontWeight:600, letterSpacing:'.08em' }}>PITCH PARAGRAPH</span>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:10, fontWeight:600, border:'1px solid var(--rule)', padding:'2px 5px', color:'var(--ink-5)' }}>IN REPORT</span>
                <div style={{ flex:1 }} />
                {!pitchEdit && <button onClick={openEdit} style={{ background:'none', border:0, fontFamily:'var(--font-mono)', fontSize:12, color:'var(--ink-5)', cursor:'pointer', padding:0 }}>Click to edit</button>}
                {!pitchEdit && audit.pitch_text && <button onClick={resetPitch} style={{ background:'none', border:0, fontFamily:'var(--font-mono)', fontSize:12, color:'var(--ink-5)', cursor:'pointer', padding:0 }}>· Reset</button>}
              </div>
              {pitchEdit ? (
                <div>
                  <textarea value={pitchDraft} onChange={e => setPitchDraft(e.target.value)} autoFocus
                    rows={4} onBlur={() => savePitch(pitchDraft)}
                    style={{ width:'100%', boxSizing:'border-box', padding:'16px 18px', background:'var(--surface)',
                      border:'1px solid var(--accent)', color:'var(--ink)', fontFamily:'var(--font-sans)',
                      fontSize:16, lineHeight:1.6, resize:'vertical', outline:'none' }} />
                  <button onClick={() => savePitch(pitchDraft)}
                    style={{ marginTop:6, fontFamily:'var(--font-mono)', fontSize:11, fontWeight:600,
                      letterSpacing:'.08em', padding:'6px 14px', background:'var(--btn-bg)', color:'var(--btn-ink)', border:0, cursor:'pointer' }}>
                    SAVE
                  </button>
                </div>
              ) : (
                <p onClick={openEdit} style={{ margin:0, padding:'16px 18px', background:'var(--surface)', border:'1px solid var(--rule)',
                  fontSize:16, lineHeight:1.6, cursor:'text',
                  color: pitchText ? 'var(--ink)' : 'var(--ink-5)', fontStyle: pitchText ? 'normal' : 'italic' }}>
                  {pitchText || (roi.hasData ? 'Click to add a pitch paragraph.' : 'Add revenue metrics in Setup to generate the pitch.')}
                </p>
              )}
            </div>
          )}
        </div>

        {/* ── Right: ROI rail ── */}
        <div className="rev-rail">
          {/* CLIENT SEES */}
          <div style={{ padding:'22px 24px', display:'flex', flexDirection:'column', gap:14, borderBottom:'1px solid var(--rule)' }}>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:12, fontWeight:600, letterSpacing:'.08em' }}>CLIENT SEES</span>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:10, fontWeight:600, border:'1px solid var(--rule)', padding:'2px 5px', color:'var(--ink-5)' }}>IN REPORT</span>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
              <span style={{ fontSize:56, fontWeight:600, letterSpacing:'-0.045em', lineHeight:1, color:'var(--gain)' }}>{annual}</span>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:13, color:'var(--ink-5)' }}>
                annual revenue at risk · {ids.size} finding{ids.size !== 1 ? 's' : ''}
              </span>
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', border:'1px solid var(--rule)', background:'var(--bg)' }}>
              {[
                { l:'CURRENT CVR',      v: roi.hasData ? fmtPct(roi.cvrRaw)     : '—', c:'var(--ink)' },
                { l:'PROJECTED CVR',    v: roi.hasData ? fmtPct(roi.projCVRRaw) : '—', c: roi.hasData ? 'var(--gain)' : 'var(--ink)' },
                { l:'MONTHLY RECOVERY', v: roi.hasData ? `+$${fmt(roi.monthlyRecovery)}` : '—', c: roi.hasData ? 'var(--gain)' : 'var(--ink)' },
                { l:'TESTS PLANNED',    v: `${testCount} · 12 wks`, c:'var(--ink)' },
              ].map(g => (
                <div key={g.l} style={{ padding:'12px 14px', display:'flex', flexDirection:'column', gap:2,
                  borderBottom:'1px solid var(--rule)', borderRight:'1px solid var(--rule)' }}>
                  <span style={{ fontFamily:'var(--font-mono)', fontSize:10, letterSpacing:'.08em', color:'var(--ink-5)' }}>{g.l}</span>
                  <span style={{ fontSize:20, fontWeight:600, color:g.c }}>{g.v}</span>
                </div>
              ))}
            </div>
            {roiLine && <span style={{ fontFamily:'var(--font-mono)', fontSize:13 }}>{roiLine}</span>}
          </div>
          {/* PRIVATE divider */}
          <div style={{ display:'flex', alignItems:'center', gap:10, padding:'12px 24px', background:'var(--ink)', color:'var(--bg)', flexShrink:0 }}>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:11, fontWeight:600, letterSpacing:'.1em' }}>PRIVATE</span>
            <span style={{ fontSize:14, fontWeight:600 }}>Only you see below</span>
          </div>
          {PricingRail()}
        </div>
      </div>
    </div>
  );
}

// ─── COMPONENTS C: ReportStage, AuditWorkspace, App ───

function ReportStage({ audit, checkedIds, onGoToScripts }) {
  // ── state ──────────────────────────────────────────────────────────────────
  const [showPricing,     setShowPricing]     = useState(false);
  const [showFindings,    setShowFindings]    = useState(true);
  const [showScreenshots, setShowScreenshots] = useState(true);
  const [pageIdx,         setPageIdx]         = useState(0);
  const [fromIdx,         setFromIdx]         = useState(null);
  const [navDir,          setNavDir]          = useState(null);
  const [transitioning,   setTransitioning]   = useState(false);

  // ── data ───────────────────────────────────────────────────────────────────
  const ids  = checkedIds || new Set();
  const roi  = calcROI(audit, ids);
  const ci   = audit.client_info || {};
  const pr   = audit.pricing || {};

  const failItems = AUDIT_ITEMS.filter(i => getItemState(audit, i.id).status === 'fail' && ids.has(i.id));
  const sorted = [...failItems].sort((a, b) => {
    const r = IMPACT_RANK[a.impact] - IMPACT_RANK[b.impact];
    return r !== 0 ? r : (FIX_TIME_RANK[a.estimated_fix_time] ?? 99) - (FIX_TIME_RANK[b.estimated_fix_time] ?? 99);
  });
  const phase1Items = sorted.filter(i => getItemState(audit, i.id).phase === 'quick-win');
  const phase2Items = sorted.filter(i => getItemState(audit, i.id).phase !== 'quick-win');

  const phase1ROI    = calcROI(audit, new Set(phase1Items.map(i => i.id)));
  const phase2Upside = Math.round(Math.max(0, roi.monthlyRecovery - phase1ROI.monthlyRecovery));
  const pitch        = audit.pitch_text || generatePitch(audit, roi, ids);
  const totalWeeks   = Math.max(12, phase2Items.length * 4);
  const numMonths    = Math.ceil(totalWeeks / 4);
  const TOTAL_PAGES  = 5;

  // ── design tokens ──────────────────────────────────────────────────────────
  const mono = 'var(--font-mono)';
  const sans = 'var(--font-sans)';
  const ink  = '#0B0C0A';
  const mute = '#5A5D56';
  const rule = '#CBCEC4';
  const bg   = '#EEEFEA';

  const SECTION_METRIC = {
    'General':            'Sitewide CVR',
    'Collection Page':    'Collection CVR',
    'Product Page':       'Add-to-Cart Rate',
    'Cart':               'Cart Conversion',
    'Checkout':           'Checkout Rate',
    'Mobile/Performance': 'Mobile CVR',
  };

  // ── print handler ──────────────────────────────────────────────────────────
  function handlePrint() {
    window.print();
  }

  // ── page navigation with slide animation ───────────────────────────────────
  function navigate(newIdx) {
    if (transitioning) return;
    setFromIdx(pageIdx);
    setNavDir(newIdx > pageIdx ? 'next' : 'prev');
    setTransitioning(true);
    setPageIdx(newIdx);
  }

  function handleTransitionEnd() {
    setTransitioning(false);
    setFromIdx(null);
  }

  // ── shared page sub-components ─────────────────────────────────────────────
  function PageHdr() {
    return (
      <div style={{ display:'flex', justifyContent:'space-between', fontFamily:mono, fontSize:10, letterSpacing:'.1em' }}>
        <span style={{ fontWeight:600 }}>SHOPIFY CRO AUDIT</span>
        <span style={{ color:mute }}>CONFIDENTIAL · FOR {(ci.client_name || 'CLIENT').toUpperCase()}</span>
      </div>
    );
  }

  function SectionHdr({ label, title, meta }) {
    return (
      <div style={{ display:'flex', flexDirection:'column', gap:10, paddingBottom:14, borderBottom:`2px solid ${ink}` }}>
        <span style={{ fontFamily:mono, fontSize:11, letterSpacing:'.12em', color:mute }}>{label}</span>
        <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', gap:16 }}>
          <h2 style={{ margin:0, fontSize:34, fontWeight:600, letterSpacing:'-0.04em', lineHeight:1.05, fontFamily:sans }}>{title}</h2>
          {meta && <span style={{ flexShrink:0, whiteSpace:'nowrap', fontFamily:mono, fontSize:11, color:mute }}>{meta}</span>}
        </div>
      </div>
    );
  }

  function PageFtr({ n }) {
    const line = [ci.client_name, 'Shopify CRO Audit', fmtDate(ci.audit_date)].filter(Boolean).join(' · ');
    return (
      <>
        <div style={{ flex:1 }} />
        <div style={{ display:'flex', justifyContent:'space-between', paddingTop:12, borderTop:`1px solid ${rule}`, fontFamily:mono, fontSize:10, color:mute }}>
          <span>{line}</span>
          <span>{n} / {TOTAL_PAGES}</span>
        </div>
      </>
    );
  }

  // common page padding
  const pageStyle = { padding:'56px 64px 40px', display:'flex', flexDirection:'column', gap:20 };

  // metrics cells (4 base + 2 if pricing)
  const metrics = [
    { l:'MONTHLY SESSIONS',  v: roi.hasData ? fmt(roi.sessions)        : '—' },
    { l:'CURRENT CVR',       v: roi.hasData ? fmtPct(roi.cvrRaw)       : '—' },
    { l:'PROJECTED CVR',     v: roi.hasData ? fmtPct(roi.projCVRRaw)   : '—' },
    { l:'MONTHLY RECOVERY',  v: roi.hasData ? `+$${fmt(roi.monthlyRecovery)}` : '—' },
    ...(showPricing ? [
      { l:'RETURN',  v: roi.roiMultiple  > 0 ? `${roi.roiMultiple.toFixed(1)}×`    : '—' },
      { l:'PAYBACK', v: roi.paybackMonths > 0 ? `${roi.paybackMonths.toFixed(1)} mo` : '—' },
    ] : []),
  ];

  // table-of-contents rows for Page 1
  const toc = [
    { n:'02', t:'Findings',                  d:`${sorted.length} issue${sorted.length !== 1 ? 's' : ''}, ranked` },
    { n:'03', t:'Phase 1 · Quick wins',      d:`${phase1Items.length} fix${phase1Items.length !== 1 ? 'es' : ''}, week 1` },
    { n:'04', t:'Phase 2 · Testing roadmap', d:`${phase2Items.length} A/B test${phase2Items.length !== 1 ? 's' : ''}, ${totalWeeks} weeks` },
    { n:'05', t:'Next steps',                d:'Questions and contact' },
  ];

  // next-steps for Page 5
  const nextSteps = [
    { n:'01', t:'Review the findings',   d:"Flag anything that needs more context or doesn't match how the store works." },
    { n:'02', t:'Ship Phase 1',          d:'Quick wins go live in the first week, with before and after screenshots.' },
    { n:'03', t:'Start testing',         d:'Phase 2 tests run one at a time, with results reported monthly.' },
  ];

  // ── CLIENT VIEW toggle helper ───────────────────────────────────────────────
  function Toggle({ checked, label, onClick }) {
    return (
      <button onClick={onClick} style={{
        height:44, display:'flex', alignItems:'center', gap:8, padding:'0 4px',
        background:'transparent', border:0, color:'var(--ink)',
        fontFamily:mono, fontSize:12, cursor:'pointer', whiteSpace:'nowrap'
      }}>
        <span style={{
          width:16, height:16, boxSizing:'border-box', flexShrink:0,
          display:'grid', placeItems:'center',
          background: checked ? 'var(--btn-bg)' : 'transparent',
          border: checked ? '0' : '1px solid var(--mute)',
          color:'var(--btn-ink)', fontSize:11, fontWeight:700
        }}>{checked ? '✓' : ''}</span>
        {label}
      </button>
    );
  }

  // ── Page 1: Summary ────────────────────────────────────────────────────────
  const page1 = (
    <div className="rpt-page" style={pageStyle}>
      <PageHdr />
      {/* Cover */}
      <div style={{ display:'flex', flexDirection:'column', gap:16, paddingBottom:22, borderBottom:`2px solid ${ink}` }}>
        <h1 style={{ margin:0, fontSize:48, fontWeight:600, letterSpacing:'-0.045em', lineHeight:1.02, fontFamily:sans }}>
          {ci.audit_title || ci.client_name || 'Client'}
        </h1>
        <div style={{ display:'flex', gap:32, flexWrap:'wrap' }}>
          {[
            ['PREPARED FOR', ci.client_name   || '—'],
            ['PREPARED BY',  ci.auditor_name  || '—'],
            ['AUDIT DATE',   fmtDate(ci.audit_date)],
            ['STORE',        ci.store_url     || '—'],
            ['THEME',        ci.shopify_theme || '—'],
          ].map(([l, v]) => (
            <div key={l} style={{ display:'flex', flexDirection:'column', gap:4 }}>
              <span style={{ fontFamily:mono, fontSize:10, letterSpacing:'.1em', color:mute }}>{l}</span>
              <span style={{ fontSize:13, fontWeight:500, fontFamily:sans }}>{v}</span>
            </div>
          ))}
        </div>
      </div>
      {/* Short version */}
      <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
        <span style={{ fontFamily:mono, fontSize:11, letterSpacing:'.1em', color:mute }}>THE SHORT VERSION</span>
        <h2 className="rpt-stake" style={{ margin:0, maxWidth:600, fontSize:44, fontWeight:600, letterSpacing:'-0.045em', lineHeight:1.04, fontFamily:sans }}>
          {roi.hasData ? (
            <>
              ${fmt(roi.annualRecovery)} a year is at{' '}
              <em style={{ fontStyle:'normal', background:'#C6F432', color:ink, padding:'0 .08em' }}>stake</em>
              {' '}on {ci.store_url || 'your store'}.
            </>
          ) : 'Add revenue data to see the projection.'}
        </h2>
        <span style={{ fontSize:14, color:mute, fontFamily:sans }}>
          Across {failItems.length} finding{failItems.length !== 1 ? 's' : ''}.
          {showPricing && roi.paybackMonths > 0 && ` Fixing them pays back in about ${roi.paybackMonths.toFixed(1)} months.`}
        </span>
      </div>
      {/* Metrics 2-row × N-col grid */}
      <div style={{ display:'grid', gridTemplateRows:'repeat(2, auto)', gridAutoFlow:'column', gridAutoColumns:'minmax(0,1fr)', borderTop:`1px solid ${rule}`, borderLeft:`1px solid ${rule}` }}>
        {metrics.map(m => (
          <div key={m.l} style={{ padding:'12px 16px', display:'flex', flexDirection:'column', gap:6, borderRight:`1px solid ${rule}`, borderBottom:`1px solid ${rule}` }}>
            <span style={{ fontFamily:mono, fontSize:10, letterSpacing:'.1em', color:mute }}>{m.l}</span>
            <span style={{ fontSize:24, fontWeight:600, letterSpacing:'-0.03em', fontFamily:sans }}>{m.v}</span>
          </div>
        ))}
      </div>
      {/* Investment strip — pricing only */}
      {showPricing && roi.totalInvestment > 0 && (
        <div style={{ display:'flex', alignItems:'baseline', gap:16, flexWrap:'wrap', padding:'12px 16px', border:`1px solid ${ink}` }}>
          <span style={{ fontFamily:mono, fontSize:10, fontWeight:600, letterSpacing:'.1em' }}>INVESTMENT</span>
          <span style={{ fontSize:16, fontWeight:600, letterSpacing:'-0.02em', fontFamily:sans }}>${fmt(roi.totalInvestment)}</span>
          {roi.auditFee > 0 && roi.implFee > 0 && (
            <span style={{ fontSize:13, color:mute, fontFamily:sans }}>${fmt(roi.auditFee)} audit + ${fmt(roi.implFee)} implementation</span>
          )}
        </div>
      )}
      {/* Pitch */}
      {pitch && (
        <p style={{ margin:0, padding:'18px 22px', borderLeft:`3px solid ${ink}`, background:bg, fontSize:14, lineHeight:1.65, fontFamily:sans }}>
          {pitch}
        </p>
      )}
      {/* TOC */}
      <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
        <span style={{ fontFamily:mono, fontSize:11, letterSpacing:'.1em', color:mute }}>IN THIS REPORT</span>
        {toc.map(c => (
          <div key={c.n} style={{ display:'flex', gap:14, alignItems:'baseline', paddingBottom:8, borderBottom:`1px solid ${rule}`, fontSize:14 }}>
            <span style={{ fontFamily:mono, fontSize:11, color:mute, width:20, flexShrink:0 }}>{c.n}</span>
            <span style={{ flex:1, fontWeight:500, fontFamily:sans }}>{c.t}</span>
            <span style={{ color:mute, fontFamily:sans }}>{c.d}</span>
          </div>
        ))}
      </div>
      <PageFtr n={1} />
    </div>
  );

  // ── Page 2: Findings ───────────────────────────────────────────────────────
  const page2 = (
    <div className="rpt-page" style={pageStyle}>
      <PageHdr />
      <SectionHdr label="FINDINGS" title="What we found"
        meta={`${sorted.length} in scope · ranked by priority, then effort`} />
      <div style={{ display:'flex', flexDirection:'column' }}>
        <div style={{ display:'grid', gridTemplateColumns:'24px minmax(0,1fr) 84px 64px 64px 84px', gap:12, paddingBottom:8, borderBottom:`1px solid ${rule}`, fontFamily:mono, fontSize:9, letterSpacing:'.1em', color:mute }}>
          <span>#</span><span>FINDING</span><span>SECTION</span><span>PRIORITY</span><span>FIX</span><span>CVR LIFT</span>
        </div>
        {sorted.length === 0 ? (
          <div style={{ padding:'32px', textAlign:'center', fontFamily:mono, fontSize:12, color:mute }}>
            No findings in scope — flag items in the checklist and select them in the revenue step.
          </div>
        ) : sorted.map((item, i) => {
          const state   = getItemState(audit, item.id);
          const finding = state.finding || item.default_finding || '';
          return (

      <PageFtr n={2} />
    </div>

  // ── Page 3: Quick wins ─────────────────────────────────────────────────────
  const page3 = (

      <SectionHdr label="PHASE 1" title="Quick wins"
        meta={`${phase1Items.length} finding${phase1Items.length !== 1 ? 's' : ''} · ship in week 1`} />

        <div style={{ padding:'32px', textAlign:'center', border:`1px solid ${rule}`, fontFamily:mono, fontSize:12, color:mute }}>

            <div style={{ display:'flex', flexDirection:'column', gap:6 }}>

              <span style={{ fontFamily:mono, fontSize:10, letterSpacing:'.06em', color:mute }}>

  const pages = [page1, page2, page3, page4, page5];

  // ── render ─────────────────────────────────────────────────────────────────
  return (
    <div data-stage="report">

          {pageIdx + 1} / {TOTAL_PAGES}

        <button onClick={handlePrint} style={{

        }}>Print / Save PDF</button>
      </div>

      {/* ── Page carousel ── */}
      {/* maxWidth 914 = 794 page + 60 left col + 60 right col (44px arrow + 16px gap each side) */}
      <div className="no-print" style={{ display:'flex', alignItems:'flex-start', maxWidth:914, margin:'0 auto', padding:'32px 0 80px', gap:0 }}>

        {/* Left arrow — right-aligned in its 60px column → 16px gap to page */}
        <div style={{ width:60, flexShrink:0, position:'sticky', top:'calc(50vh - 22px)', display:'flex', justifyContent:'flex-start' }}>
          <button onClick={() => navigate(pageIdx - 1)} disabled={pageIdx === 0}
            style={{ width:44, height:44, display:'flex', alignItems:'center', justifyContent:'center',
              background:'var(--surface)', border:'1px solid var(--rule)', color:'var(--ink)',
              fontFamily:mono, fontSize:18, cursor:'pointer',
              opacity: pageIdx === 0 ? 0.25 : 1, transition:'opacity 0.15s' }}>←</button>
        </div>

        <div className="rpt-pages-wrap" style={{ flex:1 }}>
        {pages.map((page, i) => {
          const isActive   = i === pageIdx;
          const isFrom     = transitioning && i === fromIdx;
          const show       = isActive || isFrom;
          // next: new page slides IN from right (animated = active)
          // prev: old page slides OUT to right (animated = from)
          const isAnimated = transitioning && (navDir === 'next' ? isActive : isFrom);
          const anim       = navDir === 'next' ? 'rptSlideInRight' : 'rptSlideOutRight';
          return (
            <div key={i}
              className={`rpt-page-slot${isActive ? ' rpt-page-slot--active' : ''}`}
              style={isAnimated ? {
                display: 'block', position: 'absolute', top: 0, left: 0, right: 0, zIndex: 2,
                animation: `${anim} 0.34s cubic-bezier(0.25,0.46,0.45,0.94) forwards`,
              } : { display: show ? 'block' : 'none' }}
              onAnimationEnd={isAnimated ? handleTransitionEnd : undefined}>
              {page}
            </div>
          );
        })}
        </div>{/* end rpt-pages-wrap */}

        {/* Right arrow — left-aligned in its 60px column → 16px gap to page */}
        <div style={{ width:60, flexShrink:0, position:'sticky', top:'calc(50vh - 22px)', display:'flex', justifyContent:'flex-end' }}>
          <button onClick={() => navigate(pageIdx + 1)} disabled={pageIdx === TOTAL_PAGES - 1}
            style={{ width:44, height:44, display:'flex', alignItems:'center', justifyContent:'center',
              background:'var(--surface)', border:'1px solid var(--rule)', color:'var(--ink)',
              fontFamily:mono, fontSize:18, cursor:'pointer',
              opacity: pageIdx === TOTAL_PAGES - 1 ? 0.25 : 1, transition:'opacity 0.15s' }}>→</button>
        </div>

      </div>{/* end outer flex */}

      {/* ── Mobile bottom bar ── */}
      <div className="no-print rpt-mob-bar" style={{
        display:'none', position:'fixed', left:0, right:0, bottom:0,
        padding:'12px 16px 28px', gap:8,
        borderTop:'1px solid var(--rule)', background:'var(--bg)',
        gridTemplateColumns:'1fr 1fr', zIndex:20
      }}>
        <button onClick={handlePrint} style={{ height:52, background:'transparent', color:'var(--ink)', border:'1px solid var(--rule)', fontFamily:mono, fontWeight:600, fontSize:13, letterSpacing:'.1em', cursor:'pointer' }}>PRINT / PDF</button>
        <button onClick={onGoToScripts} style={{ height:52, background:'var(--btn-bg)', color:'var(--btn-ink)', border:0, fontFamily:mono, fontWeight:600, fontSize:13, letterSpacing:'.1em', cursor:'pointer' }}>SCRIPTS →</button>
      </div>

    </div>
  );
}
