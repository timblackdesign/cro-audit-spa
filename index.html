<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>triage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0B09'/%3E%3Crect x='10' y='5' width='12' height='22' fill='%23C6F432'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* ── triage role tokens · light (default) ── */
  --bg:          #EEEFEA;
  --surface:     #E3E5DD;
  --ink:         #0B0C0A;
  --mute:        #5A5D56;
  --rule:        #CBCEC4;
  --accent:      #C6F432;
  --on-accent:   #0B0C0A;
  --accent-text: #4A6400;
  --loss:        #C2381C;
  --gain:        #3E7A00;
  --btn-bg:      #0B0C0A;
  --btn-ink:     #C6F432;

  /* ── aliases · keep existing inline styles working during migration ── */
  --ink-2:              #2A2C28;
  --ink-3:              var(--mute);
  --ink-4:              #7A7D74;
  --ink-5:              #9A9D94;
  --paper:              var(--bg);
  --paper-2:            var(--surface);
  --paper-3:            #D6D8D0;
  --rule-2:             #B8BBB0;
  --accent-dk:          var(--accent-text);
  --accent-positive:    var(--gain);
  --state-pass:         var(--gain);
  --state-fail:         var(--loss);
  --impact-high:        var(--loss);
  --impact-medium:      #B85C00;
  --amber:              #B85C00;
  --row-checked-bg:     rgba(198,244,50,0.12);
  --state-pass-bg:      rgba(62,122,0,0.09);
  --state-fail-bg:      rgba(194,56,28,0.09);
  --accent-positive-bg: rgba(62,122,0,0.10);
  --impact-high-bg:     rgba(194,56,28,0.10);
  --impact-medium-bg:   rgba(184,92,0,0.10);

  --font-sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}

[data-theme="dark"] {
  /* ── triage role tokens · dark ── */
  --bg:          #0A0B09;
  --surface:     #13150F;
  --ink:         #E8EBE2;
  --mute:        #8A8E84;
  --rule:        #272A21;
  --accent:      #C6F432;
  --on-accent:   #0A0B09;
  --accent-text: #C6F432;
  --loss:        #FF6A4D;
  --gain:        #C6F432;
  --btn-bg:      #C6F432;
  --btn-ink:     #0A0B09;

  /* ── aliases ── */
  --ink-2:              #C4C8BC;
  --ink-3:              var(--mute);
  --ink-4:              #6A6E64;
  --ink-5:              #4A4E44;
  --paper:              var(--bg);
  --paper-2:            var(--surface);
  --paper-3:            #1C1E18;
  --rule-2:             #363930;
  --accent-dk:          var(--accent-text);
  --accent-positive:    var(--gain);
  --state-pass:         var(--gain);
  --state-fail:         var(--loss);
  --impact-high:        var(--loss);
  --impact-medium:      #F0A050;
  --amber:              #F0A050;
  --row-checked-bg:     rgba(198,244,50,0.10);
  --state-pass-bg:      rgba(198,244,50,0.08);
  --state-fail-bg:      rgba(255,106,77,0.08);
  --accent-positive-bg: rgba(198,244,50,0.12);
  --impact-high-bg:     rgba(255,106,77,0.12);
  --impact-medium-bg:   rgba(240,160,80,0.12);
}


*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── SITE HEADER ── */
.site-header {
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
  padding: 0 32px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.site-header__name {
  font-family: var(--font-sans);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.05em;
}
.site-header__name::after {
  content: "";
  display: inline-block;
  width: .42em;
  height: .74em;
  background: var(--accent);
  margin-left: .06em;
  transform: translateY(.06em);
}
.site-header__tag {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-4);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.site-header__back {
  background: none;
  border: none;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-5);
  cursor: pointer;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: color 0.15s;
}
.site-header__back:hover { color: var(--ink-3); }
.site-header__theme-toggle {
  background: none;
  border: none;
  color: var(--ink-4);
  cursor: pointer;
  padding: 4px 6px;
  display: flex;
  align-items: center;
  transition: color 0.15s;
  margin-left: auto;
}
.site-header__theme-toggle:hover { color: var(--ink-2); }

/* ── DEMO BANNER ── */
.demo-banner {
  background: var(--ink);
  border-bottom: 1px solid var(--ink);
  padding: 10px 32px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--bg);
  letter-spacing: 0.06em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.demo-banner__chip {
  background: var(--accent);
  color: var(--on-accent);
  padding: 1px 7px;
  font-weight: 600;
  letter-spacing: 0.1em;
  flex-shrink: 0;
}
.demo-banner__cta {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
  flex-shrink: 0;
}
.demo-banner__cta:hover { opacity: 0.82; }

/* ── BUTTONS ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  padding: 9px 18px;
  border: none;
  cursor: pointer;
  transition: opacity 0.15s;
  white-space: nowrap;
}
.btn:disabled { opacity: 0.3; cursor: not-allowed; }
.btn:not(:disabled):hover { opacity: 0.82; }
.btn-primary   { background: var(--btn-bg); color: var(--btn-ink); }
.btn-secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--rule); }
.btn-ghost     { background: none; color: var(--mute); border: 1px solid var(--rule); }
.btn-danger    { background: var(--state-fail-bg); color: var(--loss); border: 1px solid var(--loss); }
/* utility type classes */
.label { font-family:var(--font-mono); font-weight:500; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); }
.display { font-family:var(--font-sans); font-weight:600; line-height:1.12; letter-spacing:-0.045em; margin:0; text-wrap:balance; }
.hl { font-style:normal; background:var(--accent); color:var(--on-accent); padding:0 .08em; }
.btn-lg  { padding: 13px 26px; font-size: 14px; }
.btn-sm  { padding: 6px 12px; font-size: 12px; }
.btn-full { width: 100%; justify-content: center; }

/* ── FIELDS ── */
.field { margin-bottom: 18px; }
.field:last-child { margin-bottom: 0; }
.field label {
  display: block;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--mute);
  margin-bottom: 5px;
}
.field input, .field textarea, .field select {
  width: 100%;
  border: 1px solid var(--rule);
  background: var(--bg);
  padding: 9px 13px;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s;
  appearance: none;
  -webkit-appearance: none;
  border-radius: 0;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
.field .hint { font-size: 11px; color: var(--mute); margin-top: 4px; font-family: var(--font-mono); }
.field-private label::after { content: ' — private'; font-weight: 400; color: var(--mute); text-transform: none; letter-spacing: 0; }

.fg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.fg3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
.fg4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 18px; }

/* ── CHECKLIST SIDEBAR ── */
.checklist-sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--rule);
  overflow-y: auto;
  display: none;
}
.checklist-sidebar.open { display: block; }
@media (min-width: 1024px) {
  .checklist-sidebar.open { width: 380px; }
}
@media (max-width: 700px) {
  .checklist-sidebar {
    position: fixed;
    left: 0;
    top: 46px;
    bottom: 0;
    width: calc(100% - 32px) !important;
    z-index: 400;
    display: block;
    transform: translateX(-100%);
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .checklist-sidebar.open { transform: translateX(0); }
}
.sidebar-acc-btn {
  width: 100%;
  background: var(--surface);
  border: none;
  border-bottom: 1px solid var(--rule);
  padding: 9px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  transition: background 0.12s;
  position: sticky;
  top: 0;
  z-index: 1;
}
.sidebar-acc-btn:hover { background: var(--bg); }
.sidebar-acc-btn.open  { background: var(--bg); border-left: 2px solid var(--accent); padding-left: 10px; }
.sidebar-item-btn {
  width: 100%;
  background: none;
  border: none;
  border-bottom: 1px solid var(--rule);
  padding: 8px 12px 8px 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background 0.12s;
  text-align: left;
}
.sidebar-item-btn:hover { background: var(--bg); }
.sidebar-item-btn.active { background: var(--bg); border-left: 2px solid var(--accent); padding-left: 22px; }
.sidebar-item-btn.cursor { outline: 1px solid var(--accent); outline-offset: -1px; background: var(--bg); }
.sidebar-item-btn:focus { outline: none; }

/* ── MODAL OVERLAY ── */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 400;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 16px;
  overflow-y: auto;
}
.modal-panel {
  background: var(--surface);
  border: 1px solid var(--rule);
  width: 100%;
  max-width: 640px;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 24px;
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
}
.modal-body { padding: 24px; background: var(--bg); }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--rule);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  background: var(--surface);
}
@keyframes modalSlideUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}
@media (max-width: 700px) {
  .modal-backdrop {
    padding: 0;
    overflow: hidden;
    background: transparent;
  }
  .modal-panel {
    position: fixed;
    inset: 0;
    max-width: 100%;
    border: none;
    border-radius: 0;
    display: flex;
    flex-direction: column;
    animation: modalSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .modal-panel > form {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .modal-header { flex-shrink: 0; }
  .modal-body {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal-footer {
    flex-shrink: 0;
    justify-content: stretch;
  }
  .modal-footer .btn { flex: 1; justify-content: center; padding: 14px; font-size: 11px; }
}

/* ── STAGE NAV BAR (bottom, all breakpoints) ── */
.mobile-bottom-bar {
  background: var(--surface);
  border-top: 1px solid var(--rule);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

/* ── PRINT ── */
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff !important; color: #111 !important; }
  .no-print, .site-header, .demo-banner, .mobile-bottom-bar { display: none !important; }
  .checklist-sidebar { display: none !important; }
  .print-section { page-break-inside: avoid; }
}

/* ── MOBILE ── */
@media (max-width: 700px) {
  .site-header { padding: 0 16px; height: 48px; }
  .site-header__tag { display: none; }
  .demo-banner { padding: 8px 16px; }
  .fg2, .fg3, .fg4 { grid-template-columns: 1fr; }
  .desktop-only { display: none !important; }
  .audits-grid { grid-template-columns: 1fr !important; }
}
@media (min-width: 701px) {
  .mobile-only { display: none !important; }
}

/* ── NAV SHEET (mobile sections slide-up) ── */
.nav-sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 500;
  cursor: pointer;
}
.nav-sheet-panel {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 2px solid var(--ink);
  z-index: 501;
  max-height: 76vh;
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}
.nav-sheet-panel.open { transform: translateY(0); }
.nav-sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--rule);
  flex-shrink: 0;
}
.nav-sheet-section-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-bottom: 1px solid var(--rule);
  flex-shrink: 0;
}
.nav-sheet-sec-btn {
  background: none;
  border: none;
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 10px 8px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  transition: background 0.12s;
}
.nav-sheet-sec-btn:nth-child(3n) { border-right: none; }
.nav-sheet-sec-btn:hover { background: var(--bg); }
.nav-sheet-sec-btn.active { background: var(--row-checked-bg); border-bottom: 2px solid var(--accent); }
.nav-sheet-items {
  overflow-y: auto;
  flex: 1;
}
.nav-sheet-item-btn {
  width: 100%;
  background: none;
  border: none;
  border-bottom: 1px solid var(--rule);
  padding: 12px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.12s;
  text-align: left;
}
.nav-sheet-item-btn:hover { background: var(--bg); }
.nav-sheet-item-btn.active { background: var(--bg); border-left: 2px solid var(--accent); padding-left: 14px; }
.nav-sheet-acc-btn {
  width: 100%;
  background: none;
  border: none;
  border-bottom: 1px solid var(--rule);
  padding: 12px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  transition: background 0.12s;
}
.nav-sheet-acc-btn:hover { background: var(--bg); }
.nav-sheet-acc-btn.open { background: var(--bg); border-left: 2px solid var(--accent); padding-left: 14px; }

/* Checklist card — reduce bottom padding on mobile since nav is outside the scroll area */
@media (max-width: 700px) {
  .checklist-card-scroll { padding-bottom: 20px !important; }
}

/* Audit list view — tighter top padding on mobile */
@media (max-width: 700px) {
  .audits-main { padding-top: 20px !important; }
}

/* Calculator metric grid — 1 col on mobile */
@media (max-width: 700px) {
  .calc-metrics { grid-template-columns: 1fr !important; }
}
/* Proposal summary rows — stack on mobile */
@media (max-width: 700px) {
  .proposal-row { flex-direction: column !important; align-items: flex-start !important; gap: 6px !important; }
  .proposal-val { text-align: left !important; }
}

/* Findings table / card responsive */
.findings-header { display: grid; grid-template-columns: 32px 1fr 80px 80px 80px 100px; background: var(--surface); border-bottom: 1px solid var(--rule); padding: 8px 16px; }
.findings-row { display: grid; grid-template-columns: 32px 1fr 80px 80px 80px 100px; border-bottom: 1px solid var(--rule); padding: 10px 16px; align-items: start; cursor: pointer; transition: background 0.12s; }
@media (min-width: 701px) {
  .findings-row-top, .findings-row-btm { display: contents; }
  .findings-lbl { display: none !important; }
}
@media (max-width: 700px) {
  .findings-header { display: none !important; }
  .findings-row { display: block !important; padding: 14px 16px; }
  .findings-row-top { display: flex !important; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .findings-row-btm { display: flex !important; align-items: center; gap: 14px; padding-left: 32px; flex-wrap: wrap; }
  .findings-cb { width: 22px !important; height: 22px !important; min-width: 22px !important; }
  .findings-cb-check { font-size: 13px !important; }
  .findings-col-lift, .findings-col-rev { text-align: left !important; }
  .findings-lbl { display: inline !important; }
}
@keyframes cardGlow {
  0%   { border-color: var(--rule);   box-shadow: none; }
  25%  { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(198,244,50,0.25); }
  100% { border-color: var(--rule);   box-shadow: none; }
}
.card-glow { animation: cardGlow 900ms ease-out forwards; }
/* Report Revenue Impact Summary — 2-col on mobile (screen only) */
@media screen and (max-width: 700px) {
  .rpt-metric-grid { grid-template-columns: repeat(2, 1fr) !important; }
  .rpt-metric-cell { padding: 14px 14px !important; }
  .rpt-metric-cell:nth-child(odd)  { border-right: 1px solid #e5e7eb !important; }
  .rpt-metric-cell:nth-child(even) { border-right: none !important; }
}
/* Viewport icons */
.vp-icon { display:inline-flex; align-items:center; justify-content:center; border-radius:3px; transition:transform 0.15s, background 0.15s, opacity 0.15s; position:relative; }
.vp-icon.lit { transform:scale(1.05); }
.vp-icon.interactive { cursor:pointer; }
.vp-icon.interactive:hover { filter:brightness(1.15); }
/* Strikethrough overlay for non-applicable viewport icons */
.vp-icon-na::after {
  content:''; position:absolute; top:1px; left:1px; right:1px; bottom:1px;
  background: linear-gradient(to bottom right,
    transparent calc(50% - 0.6px), var(--ink-5) calc(50% - 0.6px),
    var(--ink-5) calc(50% + 0.6px), transparent calc(50% + 0.6px));
  opacity:0.5; pointer-events:none; border-radius:2px;
}
</style>

<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.23.2/babel.min.js"></script>
<script src="audit-items.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ── SUPABASE AUTH ──
// Replace these placeholders with your project values from supabase.com → Project Settings → API
const SUPABASE_URL      = 'https://wnwcpgqyenredfuhkhlx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_oakmrMU0If3qwd2xpIvhGg_TZuUBTN3';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── THEME CONFIG ──
const THEME = {
  product: { name: 'triage', tagline: 'for Shopify', version: 'v1' },
  storage: { key: 'liftkit-audits-v1' },
  limits: { maxActiveAudits: 5, maxPreChecked: 10, liftCapMin: 3.0, liftCapMax: 6.0 },
  copy: {
    status:       { pass: 'Pass', fail: 'Flag', tbd: 'TBD', na: 'N/A' },
    statusReport: { pass: 'Passed', fail: 'Flagged', tbd: 'Not Assessed', na: 'Not Applicable' },
    demoNotice:   'Demo mode — nothing is saved. Refresh to start over.',
    workspaceFull: 'Active audit limit reached. Archive a completed audit to open a slot.',
  },
};

const demoMode = /\/demo(\/|$)/.test(window.location.pathname);

// ── DATA ──
const SECTION_ORDER = ['General','Collection Page','Product Page','Cart','Checkout','Mobile/Performance'];
const SECTION_SHORT = {'General':'General','Collection Page':'Collection','Product Page':'Product','Cart':'Cart','Checkout':'Checkout','Mobile/Performance':'Mobile'};

const SECTIONS = SECTION_ORDER.map(s => ({
  id: s.toLowerCase().replace(/[^a-z]/g, '-').replace(/-+/g, '-'),
  label: s,
  short: SECTION_SHORT[s],
  items: AUDIT_ITEMS.filter(i => i.section === s),
}));

// ── SORT UTILITIES ──
const IMPACT_RANK  = { High: 0, Medium: 1, Low: 2 };
const IMPACT_LABEL = { High: 'P0', Medium: 'P1', Low: 'P2' };
const FIX_TIME_RANK = { '< 30 min': 0, '1-2 hrs': 1, '1 day': 2, '3 days': 3, '1 week': 4, '2 weeks': 5, '1 month+': 6 };
const FIX_TIME_OPTIONS = ['< 30 min', '1-2 hrs', '1 day', '3 days', '1 week', '2 weeks', '1 month+'];

function quickWinsScore(item) {
  const fixRank = FIX_TIME_RANK[item.estimated_fix_time] ?? 2;
  return (2 - IMPACT_RANK[item.impact]) + (fixRank <= 1 ? 1 : 0);
}

function getGroupedItems(sortBy) {
  switch (sortBy) {
    case 'impact':
      return ['High', 'Medium', 'Low']
        .map(level => ({
          key: `impact-${level.toLowerCase()}`,
          label: `${level} Impact`,
          items: AUDIT_ITEMS.filter(i => i.impact === level),
        }))
        .filter(g => g.items.length > 0);
    case 'fix_time':
      return FIX_TIME_OPTIONS
        .map(v => ({ key: `ft-${v}`, label: v, items: AUDIT_ITEMS.filter(i => i.estimated_fix_time === v) }))
        .filter(g => g.items.length > 0);
    case 'quickwins':
      return [
        { key: 'qw-3', label: 'Quick Wins',       score: 3 },
        { key: 'qw-2', label: 'High Value',        score: 2 },
        { key: 'qw-1', label: 'Worth It',          score: 1 },
        { key: 'qw-0', label: 'Lower Priority',    score: 0 },
      ]
        .map(t => ({ ...t, items: AUDIT_ITEMS.filter(i => quickWinsScore(i) === t.score) }))
        .filter(g => g.items.length > 0);
    case 'lift':
      return [
        { key: 'lift-high', label: 'High Lift (≥30%)',    items: AUDIT_ITEMS.filter(i => i.lift_max >= 0.30) },
        { key: 'lift-med',  label: 'Medium Lift (15–29%)', items: AUDIT_ITEMS.filter(i => i.lift_max >= 0.15 && i.lift_max < 0.30) },
        { key: 'lift-low',  label: 'Lower Lift (<15%)',    items: AUDIT_ITEMS.filter(i => i.lift_max < 0.15) },
      ].filter(g => g.items.length > 0);
    default: // 'section'
      return SECTIONS.map(s => ({ key: s.id, label: s.label, items: s.items }));
  }
}

function sortItems(items, sortBy) {
  switch (sortBy) {
    case 'impact':
      return [...items].sort((a, b) => IMPACT_RANK[a.impact] - IMPACT_RANK[b.impact]);
    case 'fix_time':
      return [...items].sort((a, b) => FIX_TIME_RANK[a.estimated_fix_time] - FIX_TIME_RANK[b.estimated_fix_time]);
    case 'quickwins':
      return [...items].sort((a, b) => quickWinsScore(b) - quickWinsScore(a));
    case 'lift':
      return [...items].sort((a, b) => b.lift_max - a.lift_max);
    default:
      return items;
  }
}

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function today() { return new Date().toISOString().slice(0,10); }
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
}
function fmt(n) { return Math.round(n).toLocaleString(); }
function fmtPct(n) { return n.toFixed(2) + '%'; }

function newAudit(lastAuditorName) {
  const id = genId();
  const now = new Date().toISOString();
  return {
    id,
    client_info: {
      audit_title: '', client_name: '', auditor_name: lastAuditorName || '',
      store_url: '', shopify_theme: '', audit_date: today(),
      monthly_revenue: 0, aov: 0, cvr: 0,
    },
    items: {},

    calculator_selections: null,
    created_at: now, updated_at: now,
  };
}

function defaultPhase(item) {
  return item?.estimated_fix_time === '< 30 min' || item?.estimated_fix_time === '1-2 hrs' ? 'quick-win' : 'test';
}

function getItemState(audit, itemId) {
  const item = AUDIT_ITEMS.find(i => i.id === itemId);
  const saved = audit?.items?.[itemId] || {};
  return {
    status:             saved.status             ?? 'tbd',
    finding:            saved.finding            !== undefined ? saved.finding            : (item?.default_finding || ''),
    recommendation:     saved.recommendation     !== undefined ? saved.recommendation     : (item?.default_recommendation || ''),
    notes:              saved.notes              ?? '',
    screenshot_url:     saved.screenshot_url     ?? '',
    estimated_fix_time: saved.estimated_fix_time ?? item?.estimated_fix_time ?? '< 30 min',
    fails_on_desktop:   saved.fails_on_desktop   ?? null,
    fails_on_mobile:    saved.fails_on_mobile    ?? null,
    phase:              saved.phase              ?? defaultPhase(item),
  };
}

function auditProgress(audit) {
  const c = { pass:0, fail:0, tbd:0, na:0 };
  for (const item of AUDIT_ITEMS) c[getItemState(audit, item.id).status]++;
  return c;
}

function downloadJSON(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// ── SUPABASE DB HELPERS ──
async function fetchAuditsFromDB(userId) {
  const { data, error } = await _supabase
    .from('audits')
    .select('id, data, created_at, updated_at')
    .eq('user_id', userId)
    .order('created_at', { ascending: false });
  if (error) throw error;
  const audits = {};
  (data || []).forEach(row => {
    audits[row.id] = { ...row.data, id: row.id, created_at: row.created_at, updated_at: row.updated_at };
  });
  return audits;
}

async function upsertAuditToDB(userId, audit) {
  const { error } = await _supabase.from('audits').upsert({
    id: audit.id,
    user_id: userId,
    data: audit,
    updated_at: audit.updated_at,
  });
  if (error) throw error;
}

async function deleteAuditFromDB(auditId) {
  const { error } = await _supabase.from('audits').delete().eq('id', auditId);
  if (error) throw error;
}

function preCheckItems(audit) {
  const failItems = AUDIT_ITEMS.filter(i => getItemState(audit, i.id).status === 'fail');
  return new Set(failItems.filter(i => i.impact === 'High').map(i => i.id));
}

function calcROI(audit, checkedIds) {
  const ci = audit.client_info || {};
  const revenue = parseFloat(ci.monthly_revenue) || 0;
  const aov     = parseFloat(ci.aov) || 85;
  const cvrRaw  = parseFloat(ci.cvr) || 1.8;
  const cvr     = cvrRaw / 100;
  const sessions = revenue > 0 ? revenue / (aov * cvr) : 0;

  const ids = checkedIds instanceof Set ? Array.from(checkedIds) : (checkedIds || []);

  // Sort items by lift_max descending — highest-impact findings get full decay credit
  const items = ids.map(id => AUDIT_ITEMS.find(i => i.id === id)).filter(Boolean);
  items.sort((a, b) => b.lift_max - a.lift_max);

  // ── Model tuning knobs ──────────────────────────────────────────────────────
  // DECAY: diminishing-return factor per subsequent finding (0 = no compounding, 1 = full stack).
  // Raise if projections feel too conservative; lower if they still stack unrealistically.
  const DECAY = 0.60;

  // CVR_PRACTICAL_MAX: absolute CVR ceiling for e-commerce (industry-agnostic default).
  // The sliding multiplier below scales down as the baseline approaches this value,
  // reflecting that high-performing stores have less room to improve.
  // Future: make this per-industry (apparel ~0.03, consumables ~0.05, etc.).
  const CVR_PRACTICAL_MAX = 0.05;

  // Sliding cap multiplier: 3.0× near 0% CVR, shrinks to 1.25× at CVR_PRACTICAL_MAX.
  // Stores with very low CVRs have more low-hanging fruit and can see larger relative gains.
  const room       = Math.max(0, (CVR_PRACTICAL_MAX - cvr) / CVR_PRACTICAL_MAX);
  const capMult    = 1.25 + room * 1.75;   // 1.25–3.0×
  // ────────────────────────────────────────────────────────────────────────────

  // Multiplicative compound model with diminishing-return decay.
  // Each fix multiplies the current CVR by (1 + adjusted_lift) rather than adding percentage points,
  // preventing linear stacking while preserving real compounding behaviour.
  let compMin = cvr, compMax = cvr, compMid = cvr;
  items.forEach((item, i) => {
    const d = Math.pow(DECAY, i);
    compMin *= (1 + item.lift_min * d);
    compMax *= (1 + item.lift_max * d);
    compMid *= (1 + ((item.lift_min + item.lift_max) / 2) * d);
  });

  // Sliding ceiling: projected CVR cannot exceed capMult × baseline (also capped at CVR_PRACTICAL_MAX)
  const ceiling = Math.min(cvr * capMult, CVR_PRACTICAL_MAX);
  compMin = Math.min(compMin, ceiling);
  compMax = Math.min(compMax, ceiling);
  compMid = Math.min(compMid, ceiling);

  // Relative lift % for display (e.g., 28.5 means +28.5% relative improvement)
  const cappedMin = items.length ? (compMin / cvr - 1) * 100 : 0;
  const cappedMax = items.length ? (compMax / cvr - 1) * 100 : 0;
  const cappedMid = items.length ? (compMid / cvr - 1) * 100 : 0;

  // Absolute pp gains and ceiling flag for display
  const cappedMinPP = (compMin - cvr) * 100;
  const cappedMaxPP = (compMax - cvr) * 100;
  const cappedMidPP = (compMid - cvr) * 100;
  const atCeiling   = compMid >= ceiling * 0.999;

  const newCVR          = compMid;
  const projCVRRaw      = compMid * 100;    // percentage form, parallel to cvrRaw
  const newRevenue      = sessions * aov * newCVR;
  const monthlyRecovery = newRevenue - revenue;
  const annualRecovery  = monthlyRecovery * 12;

  const pr = audit.pricing || {};
  const auditFee       = parseFloat(pr.audit_fee)  || 0;
  const hourlyRate     = parseFloat(pr.hourly_rate) || 0;
  const estHours       = parseFloat(pr.est_hours)  || 0;

  // Compute suggestedFee first so it can serve as the impl_fee default
  let highCount = 0;
  for (const id of ids) {
    if (AUDIT_ITEMS.find(i => i.id === id)?.impact === 'High') highCount++;
  }
  const highRatio      = ids.length ? highCount / ids.length : 0;
  const suggestedPct   = highRatio >= 0.5 ? 20 : highRatio >= 0.25 ? 15 : 10;
  const suggestedFee   = annualRecovery > 0 ? Math.round(annualRecovery * suggestedPct / 100) : 0;

  const implFee        = parseFloat(pr.impl_fee) || suggestedFee;
  const totalInvestment = auditFee + implFee;
  const roiMultiple    = totalInvestment > 0 ? annualRecovery / totalInvestment : 0;
  const paybackMonths  = totalInvestment > 0 && monthlyRecovery > 0 ? totalInvestment / monthlyRecovery : 0;
  const sanityCheck    = hourlyRate > 0 && estHours > 0
    ? (implFee >= hourlyRate * estHours * 0.9 ? 'pass' : implFee >= hourlyRate * estHours * 0.6 ? 'warn' : 'fail')
    : 'neutral';

  return {
    revenue, aov, cvrRaw, cvr, sessions,
    cappedMin, cappedMax, cappedMid, cappedMinPP, cappedMaxPP, cappedMidPP, atCeiling,
    newCVR, projCVRRaw, newRevenue, monthlyRecovery, annualRecovery,
    auditFee, implFee, hourlyRate, estHours, totalInvestment,
    roiMultiple, paybackMonths,
    highCount, suggestedPct, suggestedFee, sanityCheck,
    hasData: revenue > 0 && sessions > 0,
  };
}

function LoginScreen() {

    setStatus('sending');

          Enter your email and we'll send a magic link.

// Props: viewport ('mobile'|'desktop'|'both'|undefined), status, failsDesktop, failsMobile, onToggle, size
// For "both" + fail + card: renders a single 3-state cycle toggle (both → desktop → mobile → both).
// All other contexts: static display with per-icon opacity.
// Wrapped in React.memo with flat primitive props so sidebar items don't re-render on unrelated state changes.
const ViewportIcons = React.memo(function ViewportIcons({ viewport, status, failsDesktop, failsMobile, onToggle, size = 'card' }) {
  const vp = viewport || 'both';
  const isFail = status === 'fail';
  const isBoth = vp === 'both';
  const isCard = size === 'card';

  const px  = size === 'card' ? 20 : size === 'sidebar' ? 11 : 12;
  const pad = 2;

  const desktopApplies = vp === 'desktop' || vp === 'both';
  const mobileApplies  = vp === 'mobile'  || vp === 'both';

  // For "both" items in card view: always render the same DOM structure to prevent layout shift on status change.
  // Pass/TBD: wrapper is transparent and non-interactive; "+" stays in DOM at opacity:0.
  if (isBoth && isCard) {
    const deskLit = isFail && failsDesktop !== false;
    const mobLit  = isFail && failsMobile  !== false;
    const bothLit = deskLit && mobLit;
    const label   = bothLit ? 'Desktop + Mobile' : deskLit ? 'Desktop only' : 'Mobile only';
    return (
      <span
        role={isFail ? 'button' : undefined}
        tabIndex={isFail ? 0 : undefined}
        style={{ display:'inline-flex', gap:0, alignItems:'center', flexShrink:0,
          cursor: isFail ? 'pointer' : 'default', borderRadius:4, padding:'0 2px',
          background: isFail ? 'var(--state-fail-bg)' : 'transparent',
          transition:'background 0.15s' }}
        title={isFail ? `Fails on: ${label} — click to cycle` : undefined}
        onClick={isFail && onToggle ? () => onToggle() : undefined}>
        <span className={'vp-icon' + (deskLit ? ' lit' : '')}
          style={{ width:px, height:px, padding:pad, flexShrink:0,
            color: deskLit ? 'var(--state-fail)' : 'var(--ink-5)',
            opacity: deskLit ? 1 : 0.2 }}>
          {ICON_DESKTOP}
        </span>
        <span style={{ fontFamily:"var(--font-mono)", fontSize:12, fontWeight:900, lineHeight:1,
          color:'var(--state-fail)', opacity: bothLit ? 0.9 : 0,
          transition:'opacity 0.15s', userSelect:'none', flexShrink:0,
          transform:'translateX(1px)' }}>+</span>
        <span className={'vp-icon' + (mobLit ? ' lit' : '')}
          style={{ width:px, height:px, padding:pad, flexShrink:0,
            color: mobLit ? 'var(--state-fail)' : 'var(--ink-5)',
            opacity: mobLit ? 1 : 0.2 }}>
          {ICON_MOBILE}
        </span>
      </span>
    );
  }

  const desktopLit = isFail && (vp === 'desktop' || (isBoth && failsDesktop !== false));
  const mobileLit  = isFail && (vp === 'mobile'  || (isBoth && failsMobile  !== false));

  const vpIcon = (applies, lit, icon, label) => (
    <span
      className={'vp-icon' + (applies ? '' : ' vp-icon-na') + (lit ? ' lit' : '')}
      style={{ width:px, height:px, padding:pad, flexShrink:0,
        color: lit ? 'var(--state-fail)' : 'var(--ink-5)',
        opacity: applies ? (lit ? 1 : 0.2) : 0.12 }}
      title={label}>
      {icon}
    </span>
  );

  return (
    <span style={{ display:'inline-flex', gap:2, alignItems:'center', flexShrink:0 }}>
      {vpIcon(desktopApplies, desktopLit, ICON_DESKTOP, 'Desktop')}
      {vpIcon(mobileApplies,  mobileLit,  ICON_MOBILE,  'Mobile')}
    </span>
  );
});

function DonutChart({ pct, color, size = 52 }) {
  const r = (size - 6) / 2;
  const circ = 2 * Math.PI * r;
  const dash = (pct / 100) * circ;
  return React.createElement('svg', { width: size, height: size, style:{ flexShrink:0 } },
    React.createElement('circle', { cx:size/2, cy:size/2, r, fill:'none', stroke:'var(--rule)', strokeWidth:3 }),
    pct > 0 && React.createElement('circle', { cx:size/2, cy:size/2, r, fill:'none', stroke:color, strokeWidth:3,
      strokeDasharray:`${dash} ${circ}`, strokeLinecap:'round', transform:`rotate(-90 ${size/2} ${size/2})` }),
    pct > 0 && React.createElement('text', { x:size/2, y:size/2+4, textAnchor:'middle',
      fontFamily:"var(--font-mono)", fontSize:9, fill:color }, `${pct}%`)
  );
}

function ChecklistStage({ audit, onUpdateItem, onScrollToFindings, onContextChange, cardGlowTrigger }) {
  const [activeItemId, setActiveItemId] = useState(SECTIONS[0].items[0].id);
  const [openSections, setOpenSections] = useState(() => new Set(getGroupedItems('section').map(g => g.key)));
  const [checklistSort, setChecklistSort] = useState('section');
  const sidebarRef = useRef(null);
  const prevSidebarOpenRef = useRef(false);
  const isMobileLayout = useRef(window.matchMedia('(max-width: 700px)').matches);
  const groupsRef = useRef(getGroupedItems('section'));
  const [showDetails, setShowDetails] = useState(false);
  const [showNotes, setShowNotes] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [sidebarCursor, setSidebarCursor] = useState(0);
  const [cardGlowing, setCardGlowing] = useState(false);
  const [revertMsg, setRevertMsg] = useState(false);

  useEffect(() => {
    if (!cardGlowTrigger) return;
    setCardGlowing(true);
    const t = setTimeout(() => setCardGlowing(false), 950);
    return () => clearTimeout(t);
  }, [cardGlowTrigger]);

  useEffect(() => {
    const sidebar = sidebarRef.current;
    if (!sidebar) return;
    function onScroll() {
      const { scrollTop, scrollHeight, clientHeight } = sidebar;
      if (scrollTop + clientHeight >= scrollHeight - 8) {
        setOpenSections(prev => {
          const gs = groupsRef.current;
          const lastOpenIdx = gs.reduce((max, g, i) => prev.has(g.key) ? i : max, -1);
          if (lastOpenIdx >= 0 && lastOpenIdx < gs.length - 1) {
            return new Set([...prev, gs[lastOpenIdx + 1].key]);
          }
          return prev;
        });
      }
    }
    sidebar.addEventListener('scroll', onScroll, { passive: true });
    return () => sidebar.removeEventListener('scroll', onScroll);
  }, []);

  useEffect(() => {
    const mq = window.matchMedia('(max-width: 700px)');
    const handler = (e) => { isMobileLayout.current = e.matches; };
    mq.addEventListener('change', handler);
    return () => mq.removeEventListener('change', handler);
  }, []);

  const cardRef = useRef(null);
  const touchStartX = useRef(null);
  const touchStartY = useRef(null);

  const activeItem = AUDIT_ITEMS.find(i => i.id === activeItemId) || AUDIT_ITEMS[0];
  const activeSection = SECTIONS.find(s => s.items.some(i => i.id === activeItemId));
  const sectionItems = activeSection ? activeSection.items : [];
  const sectionItemIdx = sectionItems.findIndex(i => i.id === activeItemId);

  useEffect(() => {
    onContextChange?.({ short: activeSection?.short || '', idx: sectionItemIdx + 1, len: sectionItems.length });
  }, [activeItemId]);
  const itemState = getItemState(audit, activeItemId);
  const isFail = itemState.status === 'fail';
  // Ref gives callbacks stable access to current itemState without adding `audit` to their dep arrays
  const itemStateRef = useRef(itemState);
  itemStateRef.current = itemState;

  const prog = auditProgress(audit);
  const totalDone = prog.pass + prog.fail + prog.na;
  const totalPct = Math.round((totalDone / 60) * 100);
  const anyMarked = totalDone > 0;

  useEffect(() => {
    if (!revertMsg) return;
    const t = setTimeout(() => setRevertMsg(false), 3500);
    return () => clearTimeout(t);
  }, [revertMsg]);

  const updateItem = useCallback((field, value) => {
    if (field === 'status' && value === 'fail' && activeItem.primary_viewport === 'both') {
      onUpdateItem(audit.id, activeItemId, { status: 'fail', fails_on_desktop: true, fails_on_mobile: true });
    } else {
      onUpdateItem(audit.id, activeItemId, { [field]: value });
    }
  }, [audit.id, activeItemId, activeItem, onUpdateItem]);

  const toggleViewport = useCallback(() => {
    const { fails_on_desktop, fails_on_mobile } = itemStateRef.current;
    const deskActive = fails_on_desktop !== false;
    const mobActive  = fails_on_mobile  !== false;
    // Cycle: both → desktop only → mobile only → both
    if (deskActive && mobActive) {
      onUpdateItem(audit.id, activeItemId, { fails_on_desktop: true, fails_on_mobile: false });
    } else if (deskActive) {
      onUpdateItem(audit.id, activeItemId, { fails_on_desktop: false, fails_on_mobile: true });
    } else {
      onUpdateItem(audit.id, activeItemId, { fails_on_desktop: true, fails_on_mobile: true });
    }
  }, [audit.id, activeItemId, onUpdateItem]);

  const groups = getGroupedItems(checklistSort);
  groupsRef.current = groups;
  const allItemsFlat = groups.flatMap(g => g.items);
  const activeIdx = allItemsFlat.findIndex(i => i.id === activeItemId);
  const prevItem = activeIdx > 0 ? allItemsFlat[activeIdx - 1] : null;
  const nextItem = activeIdx < allItemsFlat.length - 1 ? allItemsFlat[activeIdx + 1] : null;
  const sidebarCursorId = allItemsFlat[sidebarCursor]?.id ?? null;

  function handleSortChange(newSort) {
    const newGroups = getGroupedItems(newSort);
    setChecklistSort(newSort);
    setOpenSections(new Set(newGroups.map(g => g.key)));
  }

  function goTo(item) {
    setActiveItemId(item.id);
    setSidebarCursor(allItemsFlat.findIndex(i => i.id === item.id));
    const group = groupsRef.current.find(g => g.items.some(i => i.id === item.id));
    if (group) setOpenSections(prev => new Set([...prev, group.key]));
    setShowDetails(false);
    setShowNotes(false);
    if (cardRef.current) cardRef.current.scrollTop = 0;
  }

  useEffect(() => {
    function handleKey(e) {
      const tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (sidebarOpen && sidebarRef.current && sidebarRef.current.contains(document.activeElement)) {
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          setSidebarCursor(prev => Math.max(0, prev - 1));
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          setSidebarCursor(prev => Math.min(allItemsFlat.length - 1, prev + 1));
        }
        return;
      }
      if (e.key === 'ArrowLeft'  && prevItem) goTo(prevItem);
      if (e.key === 'ArrowRight' && nextItem) goTo(nextItem);
    }
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, [activeItemId, sidebarOpen, sidebarCursor]);

  useEffect(() => {
    if (!sidebarRef.current || !sidebarCursorId) return;
    const btn = sidebarRef.current.querySelector(`[data-item-id="${sidebarCursorId}"]`);
    if (!btn) { prevSidebarOpenRef.current = sidebarOpen; return; }
    btn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    const sidebarJustOpened = sidebarOpen && !prevSidebarOpenRef.current;
    prevSidebarOpenRef.current = sidebarOpen;
    if (sidebarRef.current.contains(document.activeElement) || sidebarJustOpened) {
      btn.focus({ preventScroll: true });
    }
  }, [sidebarCursor, sidebarOpen]);

  const statusDot = (itemId) => {
    const s = (audit.items || {})[itemId]?.status;
    if (!s || s === 'tbd') return { color:'var(--rule-2)', border:true };
    if (s === 'pass') return { color:'var(--state-pass)', border:false };
    if (s === 'fail') return { color:'var(--state-fail)', border:false };
    return { color:'var(--ink-5)', border:false };
  };

  const sectionDone = (sec) => sec.items.filter(i => {
    const s = (audit.items || {})[i.id]?.status;
    return s && s !== 'tbd';
  }).length;

  const IMPACT_COLOR = { High:'var(--impact-high)', Medium:'var(--impact-medium)', Low:'var(--ink-3)' };
  const IMPACT_BG    = { High:'var(--impact-high-bg)', Medium:'var(--impact-medium-bg)', Low:'var(--paper-3)' };

  const STATUS_OPTS = [
    { id:'pass', label:'Pass', color:'var(--state-pass)',  bg:'var(--state-pass-bg)',  border:'var(--state-pass)' },
    { id:'fail', label:'Flag', color:'var(--state-fail)',  bg:'var(--state-fail-bg)',  border:'var(--state-fail)' },
    { id:'tbd',  label:'TBD',  color:'var(--ink-3)',       bg:'var(--paper-3)',         border:'var(--rule-2)' },
    { id:'na',   label:'N/A',  color:'var(--ink-5)',       bg:'var(--paper)',            border:'var(--rule)' },
  ];

  const truncate = (str, n=24) => str && str.length > n ? str.slice(0,n) + '…' : str;

  return (
    <div data-stage="checklist" style={{ display:'flex', flexDirection:'column', flex:1, minHeight:0, overflow:'hidden' }}>
      {/* Stage header bar */}
      <div style={{ background:'var(--paper-2)', borderBottom:'1px solid var(--rule)', flexShrink:0 }}>
        <div style={{ padding:'10px 20px', display:'flex', alignItems:'center', gap:12 }}>
          <button onClick={() => setSidebarOpen(v => !v)}
            style={{ background:'none', border:'1px solid var(--rule)',
              color: sidebarOpen ? 'var(--accent)' : 'var(--ink-4)',
              fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.08em',
              textTransform:'uppercase', padding:'5px 10px', cursor:'pointer',
              display:'flex', alignItems:'center', gap:5 }}>
            <span>≡</span><span>{sidebarOpen ? 'Hide' : 'Sections'}</span>
          </button>
          <span style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.12em', textTransform:'uppercase',
            color:'var(--btn-ink)', background:'var(--btn-bg)', padding:'2px 8px' }}>01 — Checklist</span>
          <span style={{ fontFamily:"var(--font-mono)", fontSize:10, color:'var(--ink-4)', letterSpacing:'0.04em' }}>
            {totalDone}/60 assessed
          </span>
          <div style={{ width:80, height:2, background:'var(--rule)', position:'relative', marginLeft:4 }} className="desktop-only">
            <div style={{ position:'absolute', left:0, top:0, height:'100%', background:'var(--accent)',
              width:`${totalPct}%`, transition:'width 0.4s' }} />
          </div>
        </div>
        <div className="mobile-only" style={{ height:2, background:'var(--rule)' }}>
          <div style={{ height:'100%', width:`${totalPct}%`, background:'var(--accent)', transition:'width 0.4s' }} />
        </div>
      </div>

      {/* Sidebar + card */}
      <div style={{ display:'flex', flex:1, overflow:'hidden', minHeight:0 }}>
        {/* Mobile sidebar backdrop */}
        {sidebarOpen && (
          <div className="mobile-only" onClick={() => setSidebarOpen(false)}
            style={{ position:'fixed', top:46, left:0, right:0, bottom:0, zIndex:399, background:'rgba(0,0,0,0.55)', cursor:'pointer' }} />
        )}
        {/* Sidebar */}
        <div ref={sidebarRef} className={`checklist-sidebar${sidebarOpen ? ' open' : ''}`}>
          {/* Sort control */}
          <div style={{ padding:'10px 12px 8px', borderBottom:'1px solid var(--rule)', background:'var(--paper)' }}>
            <div style={{ fontFamily:"var(--font-mono)", fontSize:8, letterSpacing:'0.1em', textTransform:'uppercase',
              color:'var(--ink-5)', marginBottom:6 }}>Sort by</div>
            <SortControl
              value={checklistSort}
              onChange={handleSortChange}
              options={[
                { value:'section',   label:'Section' },
                { value:'impact',    label:'Impact' },
                { value:'fix_time',  label:'Fix Time' },
                { value:'quickwins', label:'Quick Wins' },
                { value:'lift',      label:'CVR Lift' },
              ]}
            />
          </div>
          {groups.map(group => {
            const isOpen = openSections.has(group.key);
            const done = sectionDone(group);
            return (
              <div key={group.key}>
                <button className={`sidebar-acc-btn${isOpen ? ' open' : ''}`}
                  onClick={() => setOpenSections(prev => { const n = new Set(prev); n.has(group.key) ? n.delete(group.key) : n.add(group.key); return n; })}>
                  <span style={{ fontFamily:"var(--font-mono)", fontSize:10, letterSpacing:'0.08em',
                    textTransform:'uppercase', color: isOpen ? 'var(--ink-2)' : 'var(--ink-5)' }}>
                    {group.label}
                  </span>
                  <span style={{ display:'flex', alignItems:'center', gap:6, flexShrink:0 }}>
                    <span style={{ fontFamily:"var(--font-mono)", fontSize:10,
                      color: done === group.items.length ? 'var(--state-pass)' : 'var(--ink-5)' }}>
                      {done}/{group.items.length}
                    </span>
                    <span style={{ fontFamily:"var(--font-mono)", fontSize:8, color:'var(--ink-5)',
                      transform: isOpen ? 'rotate(180deg)' : 'none', transition:'transform 0.15s', display:'inline-block' }}>▼</span>
                  </span>
                </button>
                {isOpen && group.items.map((item, idx) => {
                  const isActive = item.id === activeItemId;
                  const isCursor = item.id === sidebarCursorId;
                  const dot = statusDot(item.id);
                  const rawSt = (audit.items || {})[item.id] || {};
                  return (
                    <button key={item.id} data-item-id={item.id}
                      className={`sidebar-item-btn${isActive ? ' active' : ''}${isCursor && !isActive ? ' cursor' : ''}`}
                      onClick={() => {
                        goTo(item);
                        setSidebarOpen(false);
                        if (cardRef.current) cardRef.current.focus();
                      }}>
                      <span style={{ width:7, height:7, borderRadius:'50%', background:dot.color, flexShrink:0,
                        border: dot.border ? '1px solid var(--rule-2)' : 'none' }} />
                      <ViewportIcons viewport={item.primary_viewport} status={rawSt.status ?? 'tbd'} failsDesktop={rawSt.fails_on_desktop ?? null} failsMobile={rawSt.fails_on_mobile ?? null} size="sidebar" />
                      <span style={{ fontFamily:"var(--font-sans)", fontSize:11,
                        color: (isActive || isCursor) ? 'var(--ink)' : 'var(--ink-4)', lineHeight:1.3, flex:1,
                        overflow:'hidden', display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical' }}>
                        {item.name}
                      </span>
                      <span style={{ fontFamily:"var(--font-mono)", fontSize:9, color:'var(--ink-5)', flexShrink:0 }}>
                        {idx + 1}
                      </span>
                    </button>
                  );
                })}
              </div>
            );
          })}
        </div>

        {/* Item card */}
        <div ref={cardRef} tabIndex={-1} className="checklist-card-scroll" style={{ flex:1, padding:'16px 20px 80px', overflowY:'auto', minWidth:0, minHeight:0, outline:'none' }}
          onTouchStart={e => { touchStartX.current = e.touches[0].clientX; touchStartY.current = e.touches[0].clientY; }}
          onTouchEnd={e => {
            if (touchStartX.current === null) return;
            const dx = e.changedTouches[0].clientX - touchStartX.current;
            const dy = Math.abs(e.changedTouches[0].clientY - touchStartY.current);
            touchStartX.current = null; touchStartY.current = null;
            if (dy > 60 || Math.abs(dx) < 50) return;
            if (dx < 0 && nextItem) goTo(nextItem);
            if (dx > 0 && prevItem) goTo(prevItem);
          }}>
          <div style={{ maxWidth:600, margin:'0 auto', display:'flex', flexDirection:'column', gap:2 }}>

            {/* Item header */}
            <div className={cardGlowing ? 'card-glow' : undefined}>
              {(() => {
                const colonIdx = activeItem.name.indexOf(':');
                if (colonIdx === -1) return (
                  <h2 style={{ fontFamily:"var(--font-sans)", fontSize:19, fontWeight:400, color:'var(--ink)',
                    letterSpacing:'-0.3px', lineHeight:1.25, marginBottom:10 }}>
                    {activeItem.name}
                  </h2>
                );
                const before = activeItem.name.slice(0, colonIdx);
                const after = activeItem.name.slice(colonIdx + 1).trim();
                return (
                  <>
                    <h2 style={{ fontFamily:"var(--font-sans)", fontSize:19, fontWeight:400, color:'var(--ink)',
                      letterSpacing:'-0.3px', lineHeight:1.25, marginBottom:4 }}>
                      {before}:
                    </h2>
                    <p style={{ fontFamily:"var(--font-sans)", fontSize:14, color:'var(--ink-3)',
                      lineHeight:1.35, marginBottom:10 }}>
                      {after}
                    </p>
                  </>
                );
              })()}
              <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:5, marginBottom:10 }}>
                {STATUS_OPTS.map(opt => {
                  const active = itemState.status === opt.id;
                  return (
                    <button key={opt.id} onClick={() => updateItem('status', opt.id)}
                      style={{ padding:'12px 6px', background: active ? opt.bg : 'var(--paper-3)',
                        border:`1px solid ${active ? opt.border : 'var(--rule)'}`,
                        color: active ? opt.color : 'var(--ink-5)',
                        fontFamily:"var(--font-mono)", fontSize:12, fontWeight: active ? 600 : 400,
                        letterSpacing:'0.06em', textTransform:'uppercase', cursor:'pointer', transition:'all 0.12s' }}>
                      {opt.label}
                    </button>
                  );
                })}
              </div>
              <div style={{ display:'flex', gap:5, flexWrap:'wrap', alignItems:'center', marginBottom:10 }}>
                <ViewportIcons viewport={activeItem.primary_viewport} status={itemState.status} failsDesktop={itemState.fails_on_desktop} failsMobile={itemState.fails_on_mobile} onToggle={toggleViewport} size="card" />
                {revertMsg && (
                  <span style={{ fontFamily:"var(--font-mono)", fontSize:9, color:'var(--ink-4)',
                    letterSpacing:'0.04em' }}>
                    Reverted to TBD — mark at least one viewport as failed.
                  </span>
                )}
                <span style={{ fontFamily:"var(--font-mono)", fontSize:10, padding:'2px 8px',
                  background:IMPACT_BG[activeItem.impact], color:IMPACT_COLOR[activeItem.impact],
                  letterSpacing:'0.04em', textTransform:'uppercase' }}>{IMPACT_LABEL[activeItem.impact] || activeItem.impact}</span>
                <select value={itemState.estimated_fix_time}
                  onChange={e => updateItem('estimated_fix_time', e.target.value)}
                  style={{ fontFamily:"var(--font-mono)", fontSize:10, padding:'2px 8px',
                    background:'var(--paper-3)', color:'var(--ink-4)', letterSpacing:'0.04em',
                    textTransform:'uppercase', border:'none', cursor:'pointer', appearance:'none',
                    WebkitAppearance:'none' }}>
                  {FIX_TIME_OPTIONS.map(v => React.createElement('option', { key:v, value:v }, v))}
                </select>
                <span style={{ fontFamily:"var(--font-mono)", fontSize:10, padding:'2px 8px',
                  background:'var(--paper-3)', color:'var(--accent-positive)', letterSpacing:'0.04em' }}>
                  +{activeItem.lift_min}–{activeItem.lift_max}% CVR
                </span>
              </div>
              <button onClick={() => setShowDetails(v => !v)}
                style={{ background:'none', border:'none', color:'var(--ink-5)', fontFamily:"var(--font-mono)",
                  fontSize:10, letterSpacing:'0.06em', textTransform:'uppercase', cursor:'pointer', padding:0,
                  display:'flex', alignItems:'center', gap:5 }}>
                <span style={{ transform:showDetails ? 'rotate(180deg)' : 'none', display:'inline-block',
                  transition:'transform 0.15s', fontSize:8 }}>▼</span>
                {showDetails ? 'Hide details' : 'Details'}
              </button>
              {showDetails && (
                <div style={{ marginTop:10, display:'grid', gridTemplateColumns:'1fr 1fr', gap:6 }}>
                  {[['Impact Area', activeItem.impact_area], ['Shopify Complexity', activeItem.shopify_fix_complexity]].map(([lbl, val]) => (
                    <div key={lbl} style={{ background:'var(--paper-3)', padding:'8px 10px' }}>
                      <div style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.1em',
                        textTransform:'uppercase', color:'var(--ink-5)', marginBottom:3 }}>{lbl}</div>
                      <div style={{ fontFamily:"var(--font-sans)", fontSize:12, color:'var(--ink-3)' }}>{val}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Finding */}
            <div style={{ background:'var(--paper-2)', border:'1px solid rgba(252,165,165,0.2)',
              opacity: isFail ? 1 : 0.35, pointerEvents: isFail ? 'auto' : 'none',
              transition:'opacity 0.15s' }}>
              <div style={{ padding:'10px 18px', borderBottom:'1px solid var(--rule)',
                display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                <span style={{ fontFamily:"var(--font-mono)", fontSize:10, fontWeight:600,
                  letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--state-fail)' }}>Finding</span>
                <span style={{ fontFamily:"var(--font-mono)", fontSize:9, color:'var(--ink-5)',
                  letterSpacing:'0.04em' }}>in client report</span>
              </div>
              <div style={{ padding:'10px 18px' }}>
                <AuditTextarea value={itemState.finding} placeholder={activeItem.default_finding}
                  onChange={v => updateItem('finding', v)} rows={3} />
              </div>
            </div>

            {/* Recommendation */}
            <div style={{ background:'var(--paper-2)', border:'1px solid var(--rule)',
              opacity: isFail ? 1 : 0.35, pointerEvents: isFail ? 'auto' : 'none',
              transition:'opacity 0.15s' }}>
              <div style={{ padding:'10px 18px', borderBottom:'1px solid var(--rule)',
                display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                <span style={{ fontFamily:"var(--font-mono)", fontSize:10, fontWeight:600,
                  letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--ink-3)' }}>Finding</span>
                <span style={{ fontFamily:"var(--font-mono)", fontSize:9, color:'var(--ink-5)',
                  letterSpacing:'0.04em' }}>in client report</span>
              </div>
              <div style={{ padding:'10px 18px' }}>
                <AuditTextarea value={itemState.recommendation} placeholder={activeItem.default_recommendation}
                  onChange={v => updateItem('recommendation', v)} rows={3} />
              </div>
            </div>

            {/* Notes + screenshot — collapsible */}
            <div style={{ background:'var(--paper-2)', border:'1px solid var(--rule)' }}>
              <button onClick={() => setShowNotes(v => !v)}
                style={{ width:'100%', background:'none', border:'none', padding:'10px 18px',
                  display:'flex', alignItems:'center', justifyContent:'space-between', cursor:'pointer' }}>
                <span style={{ fontFamily:"var(--font-mono)", fontSize:10, fontWeight:600,
                  letterSpacing:'0.1em', textTransform:'uppercase',
                  color:(itemState.notes || itemState.screenshot_url) ? 'var(--ink-3)' : 'var(--ink-5)' }}>
                  Notes {itemState.screenshot_url ? '· screenshot' : ''}
                </span>
                <span style={{ fontFamily:"var(--font-mono)", fontSize:8, color:'var(--ink-5)',
                  transform:showNotes ? 'rotate(180deg)' : 'none', display:'inline-block', transition:'transform 0.15s' }}>▼</span>
              </button>
              {showNotes && (
                <div style={{ padding:'0 18px 12px', display:'flex', flexDirection:'column', gap:10 }}>
                  <AuditTextarea value={itemState.notes} placeholder="Private notes (not in report)…"
                    onChange={v => updateItem('notes', v)} rows={2} />
                  <div>
                    <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:5 }}>
                      <span style={{ fontFamily:"var(--font-mono)", fontSize:10, color:'var(--ink-5)',
                        letterSpacing:'0.06em', textTransform:'uppercase' }}>Screenshot URL</span>
                      <ScreenshotTooltip />
                    </div>
                    <AuditUrlInput value={itemState.screenshot_url} onChange={v => updateItem('screenshot_url', v)} />
                  </div>
                </div>
              )}
            </div>

            {/* Prev / Next — desktop only; mobile version lives outside the scroll container below */}
            <div className="checklist-item-nav desktop-only" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:5, paddingTop:6 }}>
              <button onClick={() => prevItem && goTo(prevItem)} disabled={!prevItem}
                style={{ background:'var(--paper-2)', border:'1px solid var(--rule)',
                  color: prevItem ? 'var(--ink-3)' : 'var(--ink-5)', padding:'11px 14px',
                  cursor: prevItem ? 'pointer' : 'default', opacity: prevItem ? 1 : 0.3,
                  textAlign:'left', display:'flex', flexDirection:'column', gap:2 }}>
                <span style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.08em',
                  textTransform:'uppercase', color:'var(--ink-5)' }}>← Prev</span>
                {prevItem && <span style={{ fontFamily:"var(--font-sans)", fontSize:11,
                  color:'var(--ink-4)', lineHeight:1.2 }}>{truncate(prevItem.name)}</span>}
              </button>
              {!nextItem ? (
                <button onClick={onScrollToFindings}
                  style={{ background:'var(--btn-bg)', border:'none', color:'var(--btn-ink)', padding:'11px 14px',
                    cursor:'pointer', fontFamily:"var(--font-sans)", fontSize:12, fontWeight:600,
                    letterSpacing:'0.06em', textTransform:'uppercase', textAlign:'right' }}>
                  Review Findings →
                </button>
              ) : (
                <button onClick={() => goTo(nextItem)}
                  style={{ background:'var(--paper-2)', border:'1px solid var(--rule)',
                    color:'var(--ink-3)', padding:'11px 14px', cursor:'pointer',
                    textAlign:'right', display:'flex', flexDirection:'column', gap:2, alignItems:'flex-end' }}>
                  <span style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.08em',
                    textTransform:'uppercase', color:'var(--ink-5)' }}>Next →</span>
                  <span style={{ fontFamily:"var(--font-sans)", fontSize:11,
                    color:'var(--ink-4)', lineHeight:1.2 }}>{truncate(nextItem.name)}</span>
                </button>
              )}
            </div>

          </div>
        </div>
      </div>

      {/* Prev / Next — mobile only, outside scroll container so it's always visible */}
      <div className="mobile-only" style={{ display:'grid', gridTemplateColumns:'1fr 1fr',
        borderTop:'1px solid var(--rule)', flexShrink:0 }}>
        <button onClick={() => prevItem && goTo(prevItem)} disabled={!prevItem}
          style={{ background:'var(--paper-2)', border:'none', borderRight:'1px solid var(--rule)',
            color: prevItem ? 'var(--ink-3)' : 'var(--ink-5)', padding:'12px 14px',
            cursor: prevItem ? 'pointer' : 'default', opacity: prevItem ? 1 : 0.35,
            textAlign:'left', display:'flex', flexDirection:'column', gap:2 }}>
          <span style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.08em',
            textTransform:'uppercase', color:'var(--ink-5)' }}>← Prev</span>
          {prevItem && <span style={{ fontFamily:"var(--font-sans)", fontSize:11,
            color:'var(--ink-4)', lineHeight:1.2 }}>{truncate(prevItem.name)}</span>}
        </button>
        {!nextItem ? (
          <button onClick={onScrollToFindings}
            style={{ background:'var(--btn-bg)', border:'none', color:'var(--btn-ink)', padding:'12px 14px',
              cursor:'pointer', fontFamily:"var(--font-sans)", fontSize:12, fontWeight:600,
              letterSpacing:'0.06em', textTransform:'uppercase', textAlign:'right' }}>
            Review Findings →
          </button>
        ) : (
          <button onClick={() => goTo(nextItem)}
            style={{ background:'var(--paper-2)', border:'none',
              color:'var(--ink-3)', padding:'12px 14px', cursor:'pointer',
              textAlign:'right', display:'flex', flexDirection:'column', gap:2, alignItems:'flex-end' }}>
            <span style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.08em',
              textTransform:'uppercase', color:'var(--ink-5)' }}>Next →</span>
            <span style={{ fontFamily:"var(--font-sans)", fontSize:11,
              color:'var(--ink-4)', lineHeight:1.2 }}>{truncate(nextItem.name)}</span>
          </button>
        )}
      </div>


    </div>
  );
}

function FindingsStage({ audit, checkedIds, setCheckedIds, onUpdateItem }) {
  const failItems = AUDIT_ITEMS.filter(i => getItemState(audit, i.id).status === 'fail');
  const [findingsSort, setFindingsSort] = useState('impact');

  useEffect(() => {
    if (checkedIds === null && failItems.length > 0) {
      setCheckedIds(preCheckItems(audit));
    }
  }, []);

  const ids = checkedIds || new Set();
  const toggle = (id) => setCheckedIds(prev => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });

  const IMPACT_COLOR = { High:'var(--impact-high)', Medium:'var(--impact-medium)', Low:'var(--ink-3)' };
  const IMPACT_BG    = { High:'var(--impact-high-bg)', Medium:'var(--impact-medium-bg)', Low:'var(--paper-3)' };

  const roi = calcROI(audit, ids);
  const sortedFailItems = sortItems(failItems, findingsSort);

  // Phase grouping for 'phase' sort mode
  const quickWins = sortedFailItems.filter(i => getItemState(audit, i.id).phase === 'quick-win');
  const tests     = sortedFailItems.filter(i => getItemState(audit, i.id).phase !== 'quick-win');

  function togglePhase(itemId) {
    if (!onUpdateItem) return;
    const current = getItemState(audit, itemId).phase;
    onUpdateItem(itemId, { phase: current === 'quick-win' ? 'test' : 'quick-win' });
  }

  function PhaseToggle({ item }) {
    const phase = getItemState(audit, item.id).phase;
    const isQW = phase === 'quick-win';
    return (
      <button
        onClick={e => { e.stopPropagation(); togglePhase(item.id); }}
        style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.08em', textTransform:'uppercase',
          padding:'2px 7px', border:'1px solid', cursor:'pointer', flexShrink:0,
          background: isQW ? 'var(--accent-positive-bg)' : 'var(--paper-3)',
          color:       isQW ? 'var(--accent-positive)' : 'var(--ink-5)',
          borderColor: isQW ? 'var(--accent-positive)' : 'var(--rule-2)' }}>
        {isQW ? 'Quick win' : 'Test'}
      </button>
    );
  }

  return (
    <div data-stage="findings">
      {/* Sticky stage header bar */}
      <div style={{ position:'sticky', top:0, zIndex:10, background:'var(--paper-2)',
        borderBottom:'1px solid var(--rule)', padding:'10px 20px',
        display:'flex', alignItems:'center', gap:12, flexWrap:'wrap' }}>
        <span style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.12em', textTransform:'uppercase',
          color:'var(--btn-ink)', background:'var(--btn-bg)', padding:'2px 8px', flexShrink:0 }}>02 — Findings</span>
        <span style={{ fontFamily:"var(--font-mono)", fontSize:10, color:'var(--ink-5)', letterSpacing:'0.04em', flexShrink:0 }}>
          {failItems.length} finding{failItems.length !== 1 ? 's' : ''} · {ids.size} selected for ROI

          {findingsSort === 'phase' && tests.length > 0 && (

                const aov = parseFloat(ci.aov) || 85;
                const cvrRaw = parseFloat(ci.cvr) || 1.8;
                const sessions = revenue > 0 ? revenue / (aov * (cvrRaw / 100)) : 0;
                const midLift = (item.lift_min + item.lift_max) / 2 / 100;

                  <div key={item.id}

                    onMouseLeave={e => { if (!checked) e.currentTarget.style.background='var(--paper-2)'; }}>
                    <div className="findings-row-top">
                      <div style={{ paddingTop:2, flexShrink:0 }}>

                        </div>
                      </div>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontFamily:"var(--font-sans)", fontSize:13, color:'var(--ink-2)', lineHeight:1.3, marginBottom:3 }}>
                          {item.name.split(':')[0]}{itemState.finding ? `: ${itemState.finding}` : ''}
                        </div>
                        {itemState.recommendation && (
                          <div style={{ fontFamily:"var(--font-sans)", fontSize:11, color:'var(--ink-4)', lineHeight:1.4 }}>{itemState.recommendation}</div>
                        )}
                        <div style={{ marginTop:4 }}>
                          <ViewportIcons viewport={item.primary_viewport} status={itemState.status} failsDesktop={itemState.fails_on_desktop} failsMobile={itemState.fails_on_mobile} size="findings" />
                        </div>
                      </div>
                    </div>
                    <div className="findings-row-btm">
                      <div style={{ display:'flex', gap:5, alignItems:'center' }}>
                        <span style={{ fontFamily:"var(--font-mono)", fontSize:10, padding:'2px 7px',

                      </div>
                      <div style={{ fontFamily:"var(--font-mono)", fontSize:11, color:'var(--ink-4)', letterSpacing:'0.04em' }}>
                        <span className="findings-lbl" style={{ fontFamily:"var(--font-mono)", fontSize:9, color:'var(--ink-5)', letterSpacing:'0.08em', textTransform:'uppercase', marginRight:3 }}>Fix </span>

                      </div>
                      <div className="findings-col-lift" style={{ fontFamily:"var(--font-mono)", fontSize:11, color:'var(--accent-positive)', textAlign:'right', letterSpacing:'0.04em' }}>
                        <span className="findings-lbl" style={{ fontFamily:"var(--font-mono)", fontSize:9, color:'var(--ink-5)', letterSpacing:'0.08em', textTransform:'uppercase', marginRight:3 }}>CVR </span>
                        +{item.lift_min}–{item.lift_max}%
                      </div>
                      <div className="findings-col-rev" style={{ fontFamily:"var(--font-mono)", fontSize:11,

                        {checked && revenue > 0 ? `+$${fmt(monthlyImpact)}` : '—'}
                      </div>
                    </div>
                  </div>
                );
              })}
            </>
          )}

        </div>
      )}

      {/* Quick summary */}
      {failItems.length > 0 && ids.size > 0 && (
        <div style={{ marginTop:24, fontFamily:"var(--font-mono)", fontSize:11, color:'var(--ink-4)',
          letterSpacing:'0.04em' }}>
          {roi.hasData
            ? `${ids.size} findings · est. +$${fmt(roi.monthlyRecovery)}/mo · +${Math.round(roi.cappedMin)}–${Math.round(roi.cappedMax)}% CVR lift (+${roi.cappedMinPP.toFixed(2)}–${roi.cappedMaxPP.toFixed(2)}pp${roi.atCeiling ? ', ceiling' : ''})`
            : `${ids.size} findings selected`}
        </div>
      )}
      </div>
    </div>
  );
}

function CalculatorStage({ audit, checkedIds, onUpdatePricing }) {
  const ids = checkedIds || new Set();
  const roi = calcROI(audit, ids);
  const pr = audit.pricing || {};
  const failCount = AUDIT_ITEMS.filter(i => getItemState(audit, i.id).status === 'fail').length;
  const completedCount = AUDIT_ITEMS.filter(i => { const s = getItemState(audit, i.id).status; return s === 'pass' || s === 'fail'; }).length;

  const selectedItems = AUDIT_ITEMS.filter(i => ids.has(i.id));
  const qwCount   = selectedItems.filter(i => getItemState(audit, i.id).phase === 'quick-win').length;
  const testCount = selectedItems.filter(i => getItemState(audit, i.id).phase !== 'quick-win').length;

  function setPricing(k, v) { onUpdatePricing(audit.id, { ...pr, [k]: parseFloat(v) || 0 }); }

  const metricCell = (label, value, sub) => (
    <div style={{ background:'var(--paper-3)', border:'1px solid var(--rule)', padding:'16px 20px' }}>
      <div style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.12em', textTransform:'uppercase',
        color:'var(--ink-5)', marginBottom:6 }}>{label}</div>
      <div style={{ fontFamily:"var(--font-sans)", fontSize:26, color:'var(--ink)',
        letterSpacing:'-0.5px', lineHeight:1 }}>{value}</div>
      {sub && <div style={{ fontFamily:"var(--font-mono)", fontSize:10, color:'var(--ink-4)', marginTop:4 }}>{sub}</div>}
    </div>
  );

  const sanityColor = { pass:'var(--state-pass)', warn:'var(--amber)', fail:'var(--impact-high)', neutral:'var(--ink-4)' };

  return (
    <div data-stage="calculator">
      {/* Sticky stage header bar */}
      <div style={{ position:'sticky', top:0, zIndex:10, background:'var(--paper-2)',
        borderBottom:'1px solid var(--rule)', padding:'10px 20px',
        display:'flex', alignItems:'center', gap:12 }}>
        <span style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.12em', textTransform:'uppercase',
          color:'var(--btn-ink)', background:'var(--btn-bg)', padding:'2px 8px' }}>02 — Revenue</span>
        {!roi.hasData && (
          <span style={{ fontFamily:"var(--font-mono)", fontSize:10, color:'var(--amber)', letterSpacing:'0.04em' }}>
            Add store metrics in Audit Info to unlock
          </span>
        )}
      </div>

      <div style={{ maxWidth:840, margin:'0 auto', padding:'32px 24px 60px' }}>
      <h2 style={{ fontFamily:"var(--font-sans)", fontSize:26, fontWeight:600, color:'var(--ink)',
        letterSpacing:'-0.045em', marginBottom:32 }}>Revenue at stake</h2>

      {/* Revenue Impact Card */}
      {(() => {
        const ci2 = audit.client_info || {};
        const revenue = parseFloat(ci2.monthly_revenue) || 0;
        const storeLabel = revenue >= 1000000
          ? `$${(revenue/1000000).toFixed(1).replace(/\.0$/,'')}M/MO STORE`
          : revenue >= 1000
            ? `$${Math.round(revenue/1000)}K/MO STORE`
            : revenue > 0 ? `$${revenue}/MO STORE` : 'STORE';
        const clientLabel = ci2.client_name || 'Client Store';
        const metricRows = [
          { label: 'Current conversion rate', value: roi.hasData ? fmtPct(roi.cvrRaw) : '—', accent: false },
          { label: 'Selected findings', value: `${ids.size} of ${completedCount}`, accent: true },
          { label: 'Avg. order value', value: roi.hasData ? `$${fmt(roi.aov)}` : '—', accent: false },
          { label: 'Projected CVR lift', value: roi.hasData ? `+${Math.round(roi.cappedMin)}–${Math.round(roi.cappedMax)}% (+${roi.cappedMinPP.toFixed(2)}–${roi.cappedMaxPP.toFixed(2)}pp${roi.atCeiling ? ', ceiling' : ''})` : '—', accent: false },
        ];
        return (
          <div style={{ border:'1px solid var(--rule)', marginBottom:32, overflow:'hidden', borderRadius:4 }}>
            {/* Card header */}
            <div style={{ background:'var(--paper-3)', borderBottom:'1px solid var(--rule)',
              padding:'10px 16px', display:'flex', alignItems:'center', justifyContent:'space-between', gap:12 }}>
              <span style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.12em',

              <span style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.1em',

                <div style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.12em',

                <div style={{ fontFamily:"var(--font-sans)", fontSize:40, color:'var(--accent)',

                  {roi.hasData && roi.annualRecovery > 0 ? `$${fmt(roi.annualRecovery)}` : '—'}
                </div>
                {roi.hasData && roi.annualRecovery > 0 && roi.totalInvestment > 0 && (
                  <div style={{ fontFamily:"var(--font-mono)", fontSize:10, color:'var(--ink-5)', lineHeight:1.6, fontStyle:'italic' }}>
                    Client pays ${fmt(roi.auditFee)} audit + ${fmt(roi.implFee)} to fix. Store recovers ${fmt(roi.annualRecovery)}+/yr.
                  </div>

              </div>
              <div style={{ padding:'20px 24px', background:'var(--paper-2)' }}>
                <div style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.12em',
                  textTransform:'uppercase', color:'var(--ink-5)', marginBottom:10 }}>Return on audit</div>
                <div style={{ fontFamily:"var(--font-sans)", fontSize:40,
                  color:'var(--ink)', letterSpacing:'-1px', lineHeight:1 }}>
                  {roi.hasData && roi.roiMultiple > 0 ? `${roi.roiMultiple.toFixed(1)}×` : '—'}
                </div>
              </div>
            </div>
          </div>
        );
      })()}

      {/* Your Pricing — private, no-print */}
      <div className="no-print" style={{ border:'1px solid var(--rule)', marginBottom:32, borderRadius:4, overflow:'hidden' }}>
        <div style={{ background:'var(--paper-3)', borderBottom:'1px solid var(--rule)', padding:'10px 20px',
          display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.12em',
            textTransform:'uppercase', color:'var(--ink-5)', background:'rgba(255,255,255,0.06)',
            border:'1px solid var(--rule)', padding:'2px 7px' }}>Private</span>
          <span style={{ fontFamily:"var(--font-mono)", fontSize:10, letterSpacing:'0.08em',
            textTransform:'uppercase', color:'var(--ink-4)' }}>Your Pricing</span>
        </div>
        <div style={{ padding:'20px' }}>
          {/* Suggested fee */}
          {roi.hasData && roi.annualRecovery > 0 && (
            <div style={{ marginBottom:20, padding:'14px 16px', background:'var(--paper-3)',
              border:'1px solid var(--rule)', display:'flex', justifyContent:'space-between',
              alignItems:'baseline', flexWrap:'wrap', gap:8 }}>
              <div>
                <div style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.1em',
                  textTransform:'uppercase', color:'var(--ink-5)', marginBottom:4 }}>Suggested fee</div>
                <div style={{ fontFamily:"var(--font-sans)", fontSize:28, color:'var(--accent-positive)',
                  letterSpacing:'-0.5px' }}>${fmt(roi.suggestedFee)}</div>
                <div style={{ fontFamily:"var(--font-mono)", fontSize:10, color:'var(--ink-4)', marginTop:3 }}>
                  {roi.suggestedPct}% of annual recovery · based on {roi.highCount} high-impact finding{roi.highCount !== 1 ? 's' : ''}
                </div>
              </div>
              <div style={{ fontFamily:"var(--font-mono)", fontSize:10, color:'var(--ink-5)',
                textAlign:'right', lineHeight:1.6 }}>
                Range: ${fmt(roi.annualRecovery * 0.10)} (10%) –<br />${fmt(roi.annualRecovery * 0.20)} (20%)
              </div>
            </div>
          )}
          {/* Fee inputs */}
          <div className="fg2" style={{ marginBottom:12 }}>
            <div className="field field-private">
              <label>Audit Fee ($)</label>
              <CIInput type="number" value={pr.audit_fee || ''} onChange={v => setPricing('audit_fee', v)}
                placeholder={roi.suggestedFee ? String(Math.round(roi.suggestedFee * 0.3)) : '2500'} min="0" />
