  function handleSubmit() {
    if (!canSubmit) return;
    onSubmit(form);
  }

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-panel" onClick={e => e.stopPropagation()} style={{ maxWidth: 520 }}>
        <div className="modal-header">
          <span style={{ fontFamily:"var(--font-sans)", fontSize:20, fontWeight:400, letterSpacing:'-0.3px' }}>
            New Audit
          </span>
          <button onClick={onClose} style={{ background:'none', border:'none', color:'var(--ink-4)',
            fontFamily:"var(--font-mono)", fontSize:18, cursor:'pointer', lineHeight:1, padding:'0 4px' }}>
            ×
          </button>
        </div>
        <div className="modal-body">

          {/* Quickstart section */}
          <div style={{ marginBottom:20 }}>
            <div className="field" style={{ marginBottom:12 }}>
              <label>Audit title *</label>
              <CIInput autoFocus value={form.audit_title} onChange={v => set('audit_title', v)}
                placeholder="e.g. Acme Boards Q3 2026" />
            </div>
            <button type="button" onClick={handleSubmit} disabled={!canSubmit}
              style={{ width:'100%', background: canSubmit ? 'var(--btn-bg)' : 'var(--paper-3)',
                color: canSubmit ? 'var(--btn-ink)' : 'var(--ink-5)', border:'none', padding:'11px 20px',
                fontFamily:"var(--font-sans)", fontSize:13, fontWeight:600, letterSpacing:'0.06em',
                textTransform:'uppercase', cursor: canSubmit ? 'pointer' : 'not-allowed', transition:'background 0.15s' }}>
              Let's Go — I'll add the rest later →
            </button>
          </div>

          {/* Divider */}
          <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:20 }}>
            <div style={{ flex:1, height:1, background:'var(--rule)' }} />
            <span style={{ fontFamily:"var(--font-mono)", fontSize:10, letterSpacing:'0.1em',
              textTransform:'uppercase', color:'var(--ink-5)', whiteSpace:'nowrap' }}>
              or complete setup now
            </span>
            <div style={{ flex:1, height:1, background:'var(--rule)' }} />
          </div>

          {/* Full form */}
          <div style={{ marginBottom:18 }}>
            <div style={{ fontFamily:"var(--font-mono)", fontSize:10, letterSpacing:'0.1em', textTransform:'uppercase',
              color:'var(--ink-5)', marginBottom:12 }}>Client &amp; Auditor</div>
            <div className="fg2">
              <div className="field">
                <label>Client name</label>
                <CIInput value={form.client_name} onChange={v => set('client_name', v)} placeholder="Acme Boards Co." />
              </div>
              <div className="field">
                <label>Auditor name</label>
                <CIInput value={form.auditor_name} onChange={v => set('auditor_name', v)} placeholder="Your name" />
              </div>
            </div>
            <div className="fg3">
              <div className="field">
                <label>Store URL</label>
                <CIInput value={form.store_url} onChange={v => set('store_url', v)} placeholder="example.myshopify.com" />
              </div>
              <div className="field">
                <label>Shopify Theme</label>
                <CIInput value={form.shopify_theme} onChange={v => set('shopify_theme', v)} placeholder="Dawn" />
              </div>
              <div className="field">
                <label>Audit Date</label>
                <CIInput type="date" value={form.audit_date} onChange={v => set('audit_date', v)} />
              </div>
            </div>
          </div>
          <div>
            <div style={{ fontFamily:"var(--font-mono)", fontSize:10, letterSpacing:'0.1em', textTransform:'uppercase',
              color:'var(--ink-5)', marginBottom:12 }}>Store Metrics</div>
            <div className="fg4">
              <div className="field">
                <label>Monthly Revenue ($)</label>
                <CIInput type="number" value={form.monthly_revenue} onChange={v => set('monthly_revenue', v)} placeholder="50000" min="0" />
              </div>
              <div className="field">
                <label>Avg. Order Value ($)</label>
                <CIInput type="number" value={form.aov} onChange={v => set('aov', v)} placeholder="85" min="0" />
              </div>
              <div className="field">
                <label>Conversion Rate (%)</label>
                <CIInput type="number" value={form.cvr} onChange={v => set('cvr', v)} placeholder="1.8" step="0.01" min="0" />
              </div>
              <div className="field field-private">
                <label>Audit Fee ($)</label>
                <CIInput type="number" value={form.audit_fee} onChange={v => set('audit_fee', v)} placeholder="2500" min="0" />
              </div>
            </div>
          </div>
        </div>
        <div className="modal-footer">
          <button type="button" className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button type="button" className="btn btn-primary" disabled={!canSubmit} onClick={handleSubmit}>
            Start Audit →
          </button>
        </div>
      </div>
    </div>
  );
}
// ─── END COMPONENTS A ───

// ─── COMPONENTS B: ChecklistStage, FindingsStage ───

function SortControl({ value, onChange, options }) {
  return (
    <div style={{ display:'flex', gap:4, flexWrap:'wrap' }}>
      {options.map(opt => {
        const active = value === opt.value;
        return (
          <button key={opt.value} onClick={() => onChange(opt.value)}
            style={{
              fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.08em',
              textTransform:'uppercase', padding:'4px 8px', cursor:'pointer',
              border: active ? '1px solid var(--btn-bg)' : '1px solid var(--rule-2)',
              background: active ? 'var(--btn-bg)' : 'transparent',
              color: active ? 'var(--btn-ink)' : 'var(--ink-4)',
              transition:'all 0.12s',
              whiteSpace:'nowrap',
            }}>
            {opt.label}
          </button>
        );
      })}
    </div>
  );
}

// ── Checklist sort groups (includes 'priority' mode not in getGroupedItems) ──
function getChecklistGroups(sort) {
  if (sort === 'priority') {
    return [
      { key:'p0', label:'P0 · High',   items: AUDIT_ITEMS.filter(i => i.impact === 'High') },
      { key:'p1', label:'P1 · Medium', items: AUDIT_ITEMS.filter(i => i.impact === 'Medium') },
      { key:'p2', label:'P2 · Low',    items: AUDIT_ITEMS.filter(i => i.impact === 'Low') },
    ].filter(g => g.items.length > 0);
  }
  return getGroupedItems(sort);
}

function ChecklistStage({ audit, onUpdateItem, onScrollToFindings, onContextChange, cardGlowTrigger }) {
  const [activeItemId, setActiveItemId] = useState(AUDIT_ITEMS[0].id);
  const [checklistSort, setChecklistSort] = useState('section');
  const [sortDropdownOpen, setSortDropdownOpen] = useState(false);
  const [hoverCell, setHoverCell] = useState(null); // { item, rect }
  const [showNotes, setShowNotes] = useState(false);
  const [showDetails, setShowDetails] = useState(false);
  const [cardGlowing, setCardGlowing] = useState(false);
  const [revertMsg, setRevertMsg] = useState(false);
  const [failTooltipVisible, setFailTooltipVisible] = useState(false);

  const failTooltipSeen = useRef(
    !demoMode && !!(() => { try { return localStorage.getItem('triage-fail-tooltip-seen'); } catch { return false; } })()
  );
  const mapStripRef = useRef(null);
  const cellElRefs = useRef({});
  const cardRef = useRef(null);
  const touchStartX = useRef(null);
  const touchStartY = useRef(null);

  // ── Derived ──────────────────────────────────────────────────────────────────
  const groups = getChecklistGroups(checklistSort);
  const allItemsFlat = groups.flatMap(g => g.items);
  const activeIdx = allItemsFlat.findIndex(i => i.id === activeItemId);
  const prevItem = activeIdx > 0 ? allItemsFlat[activeIdx - 1] : null;
  const nextItem = activeIdx < allItemsFlat.length - 1 ? allItemsFlat[activeIdx + 1] : null;
  const activeItem = AUDIT_ITEMS.find(i => i.id === activeItemId) || AUDIT_ITEMS[0];
  const activeSection = SECTIONS.find(s => s.items.some(i => i.id === activeItemId));
  const sectionItems = activeSection?.items || [];
  const sectionItemIdx = sectionItems.findIndex(i => i.id === activeItemId);
  const globalIdx = AUDIT_ITEMS.findIndex(i => i.id === activeItemId);
  const itemState = getItemState(audit, activeItemId);
  const isFail = itemState.status === 'fail';

  const totalDone = AUDIT_ITEMS.filter(i => {
    const s = getItemState(audit, i.id).status;
    return s === 'pass' || s === 'fail' || s === 'na';
  }).length;
  const totalFails = AUDIT_ITEMS.filter(i => getItemState(audit, i.id).status === 'fail').length;

  // Monthly recovery estimate for current item when FAIL
  const itemRecovery = (() => {
    if (!isFail) return null;
    const ci = audit.client_info || {};
    const revenue = parseFloat(ci.monthly_revenue) || 0;
    if (!revenue) return null;
    const aov = parseFloat(ci.aov) || 85;
    const cvr = parseFloat(ci.cvr) || 1.8;
    const sessions = revenue / (aov * (cvr / 100));
    const midLift = (activeItem.lift_min + activeItem.lift_max) / 2 / 100;
    return Math.round(sessions * aov * midLift);
  })();

  // ── Effects ───────────────────────────────────────────────────────────────
  useEffect(() => {
    if (!cardGlowTrigger) return;
    setCardGlowing(true);
    const t = setTimeout(() => setCardGlowing(false), 950);
    return () => clearTimeout(t);
  }, [cardGlowTrigger]);

  useEffect(() => {
    onContextChange?.({ short: activeSection?.short || '', idx: sectionItemIdx + 1, len: sectionItems.length });
  }, [activeItemId]);

  useEffect(() => {
    if (!revertMsg) return;
    const t = setTimeout(() => setRevertMsg(false), 3500);
    return () => clearTimeout(t);
  }, [revertMsg]);

  // Scroll active cell into view in the map strip
  useEffect(() => {
    const el = cellElRefs.current[activeItemId];
    const strip = mapStripRef.current;
    if (!el || !strip) return;
    // Walk up to find offset relative to strip's scrollable area
    let offset = 0;
    let node = el;
    while (node && node !== strip) { offset += node.offsetLeft; node = node.offsetParent; }
    const width = el.offsetWidth;
    if (offset < strip.scrollLeft + 60) strip.scrollLeft = offset - 60;
    else if (offset + width > strip.scrollLeft + strip.clientWidth - 60)
      strip.scrollLeft = offset + width - strip.clientWidth + 60;
  }, [activeItemId, checklistSort]);

  // ── Navigation ───────────────────────────────────────────────────────────
  function goTo(item) {
    setActiveItemId(item.id);
    setShowDetails(false);
    setShowNotes(false);
    if (cardRef.current) cardRef.current.scrollTop = 0;
  }

  // ── Status handling ───────────────────────────────────────────────────────
  function handleStatusClick(optId) {
    if (optId === 'fail') {
      if (itemState.status === 'fail' && activeItem.primary_viewport === 'both') {
        // Cycle: both → mobile only → desktop only → both
        const d = itemState.fails_on_desktop !== false;
        const m = itemState.fails_on_mobile  !== false;
        if (d && m)       onUpdateItem(audit.id, activeItemId, { fails_on_desktop: false, fails_on_mobile: true });
        else if (!d && m) onUpdateItem(audit.id, activeItemId, { fails_on_desktop: true,  fails_on_mobile: false });
        else              onUpdateItem(audit.id, activeItemId, { fails_on_desktop: true,  fails_on_mobile: true });
      } else {
        const updates = { status: 'fail' };
        if (activeItem.primary_viewport === 'both') {
          updates.fails_on_desktop = true;
          updates.fails_on_mobile  = true;
          if (!failTooltipSeen.current) {
            failTooltipSeen.current = true;
            if (!demoMode) { try { localStorage.setItem('triage-fail-tooltip-seen', '1'); } catch {} }
            setFailTooltipVisible(true);
            setTimeout(() => setFailTooltipVisible(false), 3400);
          }
        }
        onUpdateItem(audit.id, activeItemId, updates);
      }
    } else {
      onUpdateItem(audit.id, activeItemId, { status: optId });
    }
  }

  // ── Keyboard shortcuts ────────────────────────────────────────────────────
  useEffect(() => {
    function handleKey(e) {
      const tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.key === 'j' || e.key === 'J') { if (nextItem) goTo(nextItem); }
      else if (e.key === 'k' || e.key === 'K') { if (prevItem) goTo(prevItem); }
      else if (e.key === 'p' || e.key === 'P') handleStatusClick('pass');
      else if (e.key === 'f' || e.key === 'F') handleStatusClick('fail');
      else if (e.key === 't' || e.key === 'T') handleStatusClick('tbd');
      else if (e.key === 'n' || e.key === 'N') handleStatusClick('na');
    }
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, [activeItemId, prevItem, nextItem, itemState]);

  // ── Cell status color ─────────────────────────────────────────────────────
  function cellColor(itemId) {
    const s = getItemState(audit, itemId).status;
    if (s === 'pass' || s === 'na') return 'var(--gain)';
    if (s === 'fail') return 'var(--loss)';
    if (s === 'tbd')  return 'var(--mute)';
    return 'var(--rule)';
  }

  // ── Sort options ──────────────────────────────────────────────────────────
  const SORT_OPTIONS = [
    { value:'section',  label:'Section',    note:'Grouped by store area' },
    { value:'priority', label:'Priority',   note:'P0 first · highest CVR impact' },
    { value:'quickwins',label:'Quick wins', note:'Fastest to ship first' },
    { value:'lift',     label:'CVR lift',   note:'Highest lift range first' },
  ];
  const activeSortLabel = SORT_OPTIONS.find(o => o.value === checklistSort)?.label || 'Section';
  const truncate = (str, n=28) => str && str.length > n ? str.slice(0, n) + '…' : str;

  // ── Viewport state for FAIL key display ───────────────────────────────────
  const failD = itemState.fails_on_desktop !== false;
  const failM = itemState.fails_on_mobile  !== false;
  const dApplies = activeItem.primary_viewport !== 'mobile';
  const mApplies = activeItem.primary_viewport !== 'desktop';
  const dOpacity = !isFail ? 0.15 : (dApplies ? (failD ? 1 : 0.3) : 0.12);
  const mOpacity = !isFail ? 0.15 : (mApplies ? (failM ? 1 : 0.3) : 0.12);

  // ── Render ────────────────────────────────────────────────────────────────
  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, minHeight:0, overflow:'hidden' }}>

      {/* ── Map strip ── */}
      <div style={{ background:'var(--surface)', borderBottom:'1px solid var(--rule)', flexShrink:0 }}>
        {/* Strip row: sort button + scrollable cells + summary */}
        <div style={{ display:'flex', alignItems:'stretch', height:56, position:'relative' }}>

          {/* Sort button — sticky left */}
          <div style={{ position:'sticky', left:0, zIndex:10, flexShrink:0,
            background:'var(--surface)', borderRight:'1px solid var(--rule)',
            display:'flex', alignItems:'center' }}>
            <button
              onClick={() => setSortDropdownOpen(v => !v)}
              style={{ padding:'0 14px', height:'100%', background:'none', border:'none',
                fontFamily:'var(--font-mono)', fontSize:10, fontWeight:600,
                letterSpacing:'0.08em', textTransform:'uppercase',
                color: sortDropdownOpen ? 'var(--ink)' : 'var(--mute)',
                cursor:'pointer', display:'flex', alignItems:'center', gap:6,
                whiteSpace:'nowrap' }}>
              ⇅ {activeSortLabel} ▾
            </button>
            {sortDropdownOpen && (
              <div style={{ position:'absolute', top:'100%', left:0, background:'var(--bg)',
                border:'1px solid var(--ink)', zIndex:50, minWidth:220 }}
                onMouseLeave={() => setSortDropdownOpen(false)}>
                {SORT_OPTIONS.map(opt => (
                  <button key={opt.value}
                    onClick={() => { setChecklistSort(opt.value); setSortDropdownOpen(false); }}
                    style={{ display:'block', width:'100%', padding:'12px 16px', background:'none', border:'none',
                      borderBottom:'1px solid var(--rule)', textAlign:'left', cursor:'pointer',
                      background: checklistSort === opt.value ? 'var(--surface)' : 'transparent' }}
                    onMouseEnter={e => e.currentTarget.style.background='var(--surface)'}
                    onMouseLeave={e => e.currentTarget.style.background = checklistSort === opt.value ? 'var(--surface)' : 'transparent'}>
                    <div style={{ fontFamily:'var(--font-mono)', fontSize:11, fontWeight:600,
                      letterSpacing:'0.06em', textTransform:'uppercase',
                      color: checklistSort === opt.value ? 'var(--accent-text)' : 'var(--ink)', marginBottom:2 }}>
                      {opt.label}
                    </div>
                    <div style={{ fontFamily:'var(--font-mono)', fontSize:10, color:'var(--mute)',
                      letterSpacing:'0.04em' }}>{opt.note}</div>
                  </button>
                ))}
              </div>
            )}
          </div>

          {/* Scrollable cells */}
          <div ref={mapStripRef} style={{ flex:1, overflowX:'auto', scrollbarWidth:'none',
            display:'flex', alignItems:'center', gap:0, padding:'0 12px' }}>
            <style>{`.map-strip::-webkit-scrollbar{display:none}`}</style>
            {groups.map((group, gi) => {
              const groupDone = group.items.filter(i => {
                const s = getItemState(audit, i.id).status;
                return s === 'pass' || s === 'fail' || s === 'na';
              }).length;
              return (
                <div key={group.key} style={{ display:'flex', alignItems:'center', gap:6,
                  flexShrink:0, marginRight:16 }}>
                  {/* Group label */}
                  <div style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.08em',
                    textTransform:'uppercase', color:'var(--mute)', whiteSpace:'nowrap',
                    marginRight:4, flexShrink:0 }}>
                    {group.label}
                    <span style={{ marginLeft:4, color: groupDone === group.items.length ? 'var(--gain)' : 'var(--mute)',
                      opacity:0.7 }}>{groupDone}/{group.items.length}</span>
                  </div>
                  {/* Cells */}
                  {group.items.map(item => {
                    const isActive = item.id === activeItemId;
                    const color = cellColor(item.id);
                    return (
                      <div key={item.id}
                        ref={el => { cellElRefs.current[item.id] = el; }}
                        onClick={() => goTo(item)}
                        onMouseEnter={e => {
                          const rect = e.currentTarget.getBoundingClientRect();
                          setHoverCell({ item, x: rect.left + rect.width / 2, y: rect.bottom + 6 });
                        }}
                        onMouseLeave={() => setHoverCell(null)}
                        style={{ width:18, height:18, background:color, cursor:'pointer',
                          flexShrink:0, position:'relative',
                          outline: isActive ? '2px solid var(--ink)' : 'none',
                          outlineOffset: isActive ? '2px' : '0',
                          transition:'outline 0.1s' }} />
                    );
                  })}
                </div>
              );
            })}
          </div>

          {/* Summary — right */}
          <div className="desktop-only" style={{ flexShrink:0, borderLeft:'1px solid var(--rule)',
            padding:'0 16px', display:'flex', alignItems:'center', gap:12,
            fontFamily:'var(--font-mono)', fontSize:10, color:'var(--mute)',
            letterSpacing:'0.04em', whiteSpace:'nowrap' }}>
            <span>{totalDone}/60 reviewed</span>
            {totalFails > 0 && <span style={{ color:'var(--loss)' }}>{totalFails} fail{totalFails !== 1 ? 's' : ''}</span>}
          </div>
        </div>
      </div>

      {/* ── Cell hover tooltip (fixed, rendered outside strip overflow) ── */}
      {hoverCell && (
        <div style={{ position:'fixed', left: Math.min(hoverCell.x - 150, window.innerWidth - 316),
          top: hoverCell.y, width:300, background:'var(--bg)', border:'1px solid var(--ink)',
          padding:'12px 14px', zIndex:200, pointerEvents:'none',
          boxShadow:'0 4px 16px rgba(0,0,0,0.12)' }}>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.1em',
            textTransform:'uppercase', color:'var(--mute)', marginBottom:6 }}>
            {hoverCell.item.section} · {getItemState(audit, hoverCell.item.id).status?.toUpperCase() || 'NOT REVIEWED'}
          </div>
          <div style={{ fontFamily:'var(--font-sans)', fontSize:15, fontWeight:600,
            color:'var(--ink)', lineHeight:1.25, marginBottom:4 }}>
            {hoverCell.item.name.split(':')[0]}
          </div>
          {hoverCell.item.name.includes(':') && (
            <div style={{ fontFamily:'var(--font-sans)', fontSize:13, color:'var(--mute)', lineHeight:1.5 }}>
              {hoverCell.item.name.split(':').slice(1).join(':').trim()}
            </div>
          )}
        </div>
      )}

      {/* ── Item card — two-column on desktop ── */}
      <div className="checklist-body"
        ref={cardRef}
        tabIndex={-1}
        onTouchStart={e => { touchStartX.current = e.touches[0].clientX; touchStartY.current = e.touches[0].clientY; }}
        onTouchEnd={e => {
          if (touchStartX.current === null) return;
          const dx = e.changedTouches[0].clientX - touchStartX.current;
          const dy = Math.abs(e.changedTouches[0].clientY - touchStartY.current);
          touchStartX.current = null; touchStartY.current = null;
          if (dy > 60 || Math.abs(dx) < 50) return;
          if (dx < 0 && nextItem) goTo(nextItem);
          if (dx > 0 && prevItem) goTo(prevItem);
        }}>

        {/* ── LEFT COLUMN: meta + status keys + data table ── */}
        <div className="checklist-left">

          {/* Meta line */}
          <div style={{ fontFamily:'var(--font-mono)', fontSize:10, letterSpacing:'0.1em',
            textTransform:'uppercase', color:'var(--mute)', marginBottom:12 }}>
            {activeSection?.label || activeItem.section}
            {' · '}
            <span className="desktop-only">Item {String(sectionItemIdx + 1).padStart(2,'0')} of {sectionItems.length} · #{globalIdx + 1} of 60</span>
            <span className="mobile-only">{String(sectionItemIdx + 1).padStart(2,'0')}/{sectionItems.length}</span>
          </div>

          {/* Title + question */}
          <div className={cardGlowing ? 'card-glow' : undefined} style={{ marginBottom:20 }}>
            {(() => {
              const colonIdx = activeItem.name.indexOf(':');
              const title = colonIdx === -1 ? activeItem.name : activeItem.name.slice(0, colonIdx);
              const question = colonIdx === -1 ? null : activeItem.name.slice(colonIdx + 1).trim();
              return (
                <>
                  <h2 style={{ fontFamily:'var(--font-sans)', fontSize:22, fontWeight:600,
                    letterSpacing:'-0.03em', lineHeight:1.2, color:'var(--ink)',
                    marginBottom: question ? 8 : 0 }}>
                    {title}
                  </h2>
                  {question && (
                    <p style={{ fontFamily:'var(--font-sans)', fontSize:15, color:'var(--mute)',
                      lineHeight:1.55, margin:0 }}>
                      {question}
                    </p>
                  )}
                </>
              );
            })()}
          </div>

          {/* Status keys — 4 column, 80px tall */}
          <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:6,
            marginBottom:0, position:'relative' }}>
            {[
              { id:'pass', label:'Pass', shortcut:'P',
                activeBg:'var(--gain)', activeColor:'var(--bg)', activeBorder:'var(--gain)',
                idleBg:'var(--surface)', idleColor:'var(--mute)' },
              { id:'fail', label:'Flag', shortcut:'F',
                activeBg:'var(--loss)', activeColor:'var(--bg)', activeBorder:'var(--loss)',
                idleBg:'var(--surface)', idleColor:'var(--mute)' },
              { id:'tbd',  label:'TBD',  shortcut:'T',
                activeBg:'var(--ink)', activeColor:'var(--bg)', activeBorder:'var(--ink)',
                idleBg:'var(--surface)', idleColor:'var(--mute)' },
              { id:'na',   label:'N/A',  shortcut:'N',
                activeBg:'var(--ink)', activeColor:'var(--bg)', activeBorder:'var(--ink)',
                idleBg:'var(--surface)', idleColor:'var(--mute)' },
            ].map(opt => {
              const active = itemState.status === opt.id;
              return (
                <button key={opt.id} onClick={() => handleStatusClick(opt.id)}
                  style={{ height:80, position:'relative', cursor:'pointer',
                    background: active ? opt.activeBg : opt.idleBg,
                    border: `1px solid ${active ? opt.activeBorder : 'var(--rule)'}`,
                    color: active ? opt.activeColor : opt.idleColor,
                    transition:'background 0.12s, border-color 0.12s, color 0.12s',
                    display:'flex', flexDirection:'column', alignItems:'center',
                    justifyContent:'center', gap:4 }}>
                  {/* Keyboard shortcut — top right, desktop only */}
                  <span className="desktop-only" style={{ position:'absolute', top:6, right:7,
                    fontFamily:'var(--font-mono)', fontSize:11, fontWeight:600,
                    opacity:0.55, lineHeight:1 }}>
                    {opt.shortcut}
                  </span>
                  <span style={{ fontFamily:'var(--font-mono)', fontSize:11, fontWeight:600,
                    letterSpacing:'0.08em', textTransform:'uppercase' }}>
                    {opt.label}
                  </span>
                  {/* Viewport icons in FAIL key */}
                  {opt.id === 'fail' && (
                    <div style={{ display:'flex', alignItems:'center', gap:3,
                      position:'absolute', bottom:7, left:8 }}>
                      <svg width="14" height="11" viewBox="0 0 14 11" fill="none"
                        style={{ opacity: dOpacity, transition:'opacity 0.15s' }}>
                        <rect x="0.5" y="0.5" width="13" height="8" stroke="currentColor" strokeWidth="1"/>
                        <rect x="4" y="9" width="6" height="1.5" fill="currentColor"/>
                        <rect x="2" y="10" width="10" height="0.5" fill="currentColor"/>
                      </svg>
                      {failD && failM && isFail && (
                        <span style={{ fontFamily:'var(--font-mono)', fontSize:9, fontWeight:900,
                          lineHeight:1, color:'currentColor', opacity:0.9 }}>+</span>
                      )}
                      <svg width="8" height="13" viewBox="0 0 8 13" fill="none"
                        style={{ opacity: mOpacity, transition:'opacity 0.15s' }}>
                        <rect x="0.5" y="0.5" width="7" height="12" stroke="currentColor" strokeWidth="1"/>
                        <rect x="3" y="10.5" width="2" height="1.5" fill="currentColor"/>
                      </svg>
                    </div>
                  )}
                </button>
              );
            })}

            {/* First-time FAIL tooltip */}
            {failTooltipVisible && (
              <div style={{ position:'absolute', top:'calc(100% + 8px)', left:'25%', width:280,
                background:'var(--ink)', color:'var(--bg)', padding:'12px 14px', zIndex:50,
                pointerEvents:'none' }}>
                <div style={{ fontFamily:'var(--font-mono)', fontSize:10, fontWeight:600,
                  letterSpacing:'0.1em', textTransform:'uppercase', marginBottom:6 }}>
                  Fails on desktop + mobile
                </div>
                <div style={{ fontFamily:'var(--font-sans)', fontSize:13, lineHeight:1.5, opacity:0.85 }}>
                  Click Flag again for mobile only, then desktop only.
                </div>
              </div>
            )}
          </div>

          {/* Read-only meta table (desktop) */}
          <table className="meta-table desktop-only">
            <tbody>
              <tr>
                <td>Priority</td>
                <td>{activeItem.impact} · {IMPACT_LABEL[activeItem.impact]}</td>
              </tr>
              <tr>
                <td>Est. fix time</td>
                <td>
                  <select value={itemState.estimated_fix_time}
                    onChange={e => onUpdateItem(audit.id, activeItemId, { estimated_fix_time: e.target.value })}
                    style={{ fontFamily:'var(--font-mono)', fontSize:11, background:'transparent',
                      color:'var(--ink)', border:'none', cursor:'pointer',
                      appearance:'none', WebkitAppearance:'none', textAlign:'right' }}>
                    {FIX_TIME_OPTIONS.map(v => React.createElement('option', { key:v, value:v }, v))}
                  </select>
                </td>
              </tr>
              <tr>
                <td>Impact area</td>
                <td>{activeItem.impact_area}</td>
              </tr>
              <tr>
                <td>Shopify fix</td>
                <td>{activeItem.shopify_fix_complexity}</td>
              </tr>
              <tr>
                <td>CVR lift</td>
                <td style={{ color:'var(--gain)' }}>+{activeItem.lift_min}–{activeItem.lift_max}%</td>
              </tr>
              {isFail && itemRecovery !== null && (
                <tr>
                  <td>Est. recovery if fixed</td>
                  <td style={{ color:'var(--gain)', fontWeight:600, fontSize:14 }}>
                    +${fmt(itemRecovery)}/MO
                  </td>
                </tr>
              )}
            </tbody>
          </table>

          {/* Mobile meta row: single line */}
          <div className="mobile-only" style={{ fontFamily:'var(--font-mono)', fontSize:11,
            color:'var(--mute)', letterSpacing:'0.06em', marginTop:12, marginBottom:4,
            display:'flex', alignItems:'center', justifyContent:'space-between' }}>
            <span>
              {activeItem.impact} · {IMPACT_LABEL[activeItem.impact]}
              {' · '}{itemState.estimated_fix_time}
              {' · '}{activeItem.shopify_fix_complexity}
            </span>
            {isFail && itemRecovery !== null && (
              <span style={{ color:'var(--gain)', fontWeight:600 }}>+${fmt(itemRecovery)}/MO</span>
            )}
          </div>

          {/* Desktop prev/next inside left column */}
          <div className="desktop-only" style={{ display:'grid', gridTemplateColumns:'1fr 1fr',
            gap:6, marginTop:24 }}>
            <button onClick={() => prevItem && goTo(prevItem)} disabled={!prevItem}
              style={{ background:'var(--surface)', border:'1px solid var(--rule)',
                color: prevItem ? 'var(--ink)' : 'var(--mute)', padding:'11px 12px',
                cursor: prevItem ? 'pointer' : 'default', opacity: prevItem ? 1 : 0.35,
                textAlign:'left', display:'flex', flexDirection:'column', gap:3 }}>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.08em',
                textTransform:'uppercase', color:'var(--mute)' }}>← Prev</span>
              {prevItem && <span style={{ fontFamily:'var(--font-sans)', fontSize:11,
                color:'var(--ink)', lineHeight:1.2 }}>{truncate(prevItem.name.split(':')[0])}</span>}
            </button>
            <button onClick={() => nextItem ? goTo(nextItem) : onScrollToFindings()}
              style={{ background: nextItem ? 'var(--surface)' : 'var(--btn-bg)',
                border: nextItem ? '1px solid var(--rule)' : 'none',
                color: nextItem ? 'var(--ink)' : 'var(--btn-ink)',
                padding:'11px 12px', cursor:'pointer',
                textAlign:'right', display:'flex', flexDirection:'column', gap:3, alignItems:'flex-end' }}>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.08em',
                textTransform:'uppercase', color: nextItem ? 'var(--mute)' : 'var(--btn-ink)' }}>
                {nextItem ? 'Next →' : 'Size the revenue →'}
              </span>
              {nextItem && <span style={{ fontFamily:'var(--font-sans)', fontSize:11,
                color:'var(--ink)', lineHeight:1.2 }}>{truncate(nextItem.name.split(':')[0])}</span>}
            </button>
          </div>
          <div className="desktop-only" style={{ marginTop:12, fontFamily:'var(--font-mono)',
            fontSize:10, color:'var(--mute)', letterSpacing:'0.06em' }}>
            J/K move · / jump
          </div>

        </div>{/* end checklist-left */}

        {/* ── RIGHT COLUMN: text fields ── */}
        <div className="checklist-right">

          {/* FINDING */}
          <FieldBlock
            label="Finding" tag="IN REPORT" tagColor="var(--loss)"
            hasReset={!!itemState.finding}
            onReset={() => onUpdateItem(audit.id, activeItemId, { finding: '' })}
            disabled={!isFail}
            defaultOpen={true}>
            <AuditTextarea value={itemState.finding} placeholder={activeItem.default_finding}
              onChange={v => onUpdateItem(audit.id, activeItemId, { finding: v })} rows={4} />
          </FieldBlock>

          {/* RECOMMENDATION */}
          <FieldBlock
            label="Recommendation" tag="IN REPORT"
            hasReset={!!itemState.recommendation}
            onReset={() => onUpdateItem(audit.id, activeItemId, { recommendation: '' })}
            disabled={!isFail}
            defaultOpen={true}>
            <AuditTextarea value={itemState.recommendation} placeholder={activeItem.default_recommendation}
              onChange={v => onUpdateItem(audit.id, activeItemId, { recommendation: v })} rows={4} />
          </FieldBlock>

          {/* SCREENSHOT URL */}
          <FieldBlock label="Screenshot URL" tag="IN REPORT" disabled={!isFail} defaultOpen={false}>
            <AuditUrlInput value={itemState.screenshot_url}
              onChange={v => onUpdateItem(audit.id, activeItemId, { screenshot_url: v })} />
          </FieldBlock>

          {/* NOTES — private */}
          <FieldBlock label="Notes" tag="PRIVATE" tagStyle="private" defaultOpen={false}>
            <AuditTextarea value={itemState.notes}
              placeholder="Private notes (not in report)…"
              onChange={v => onUpdateItem(audit.id, activeItemId, { notes: v })} rows={4} />
          </FieldBlock>

        </div>{/* end checklist-right */}

      </div>{/* end checklist-body */}

      {/* Mobile prev/next — outside scroll area */}
      <div className="mobile-only" style={{ display:'grid', gridTemplateColumns:'1fr 1fr',
        borderTop:'1px solid var(--rule)', flexShrink:0 }}>
        <button onClick={() => prevItem && goTo(prevItem)} disabled={!prevItem}
          style={{ background:'var(--surface)', border:'none', borderRight:'1px solid var(--rule)',
            color: prevItem ? 'var(--ink)' : 'var(--mute)', padding:'14px',
            cursor: prevItem ? 'pointer' : 'default', opacity: prevItem ? 1 : 0.35,
            textAlign:'left', display:'flex', flexDirection:'column', gap:3 }}>
          <span style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.08em',
            textTransform:'uppercase', color:'var(--mute)' }}>← Prev</span>
          {prevItem && <span style={{ fontFamily:'var(--font-sans)', fontSize:12, color:'var(--ink)',
            lineHeight:1.2 }}>{truncate(prevItem.name.split(':')[0])}</span>}
        </button>
        <button onClick={() => nextItem ? goTo(nextItem) : onScrollToFindings()}
          style={{ background: nextItem ? 'var(--surface)' : 'var(--btn-bg)',
            border:'none', color: nextItem ? 'var(--ink)' : 'var(--btn-ink)',
            padding:'14px', cursor:'pointer',
            textAlign:'right', display:'flex', flexDirection:'column', gap:3, alignItems:'flex-end' }}>
          <span style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.08em',
            textTransform:'uppercase', color: nextItem ? 'var(--mute)' : 'var(--btn-ink)' }}>
            {nextItem ? 'Next item →' : 'Size the revenue →'}
          </span>
          {nextItem && <span style={{ fontFamily:'var(--font-sans)', fontSize:12, color:'var(--ink)',
            lineHeight:1.2 }}>{truncate(nextItem.name.split(':')[0])}</span>}
        </button>
      </div>

    </div>
  );
}

function FindingsStage({ audit, checkedIds, setCheckedIds, onUpdateItem }) {
  const failItems = AUDIT_ITEMS.filter(i => getItemState(audit, i.id).status === 'fail');
  const [findingsSort, setFindingsSort] = useState('impact');

  useEffect(() => {
    if (checkedIds === null && failItems.length > 0) {
      setCheckedIds(preCheckItems(audit));
    }
  }, []);

  const ids = checkedIds || new Set();
  const toggle = (id) => setCheckedIds(prev => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });

  const IMPACT_COLOR = { High:'var(--impact-high)', Medium:'var(--impact-medium)', Low:'var(--ink-3)' };
  const IMPACT_BG    = { High:'var(--impact-high-bg)', Medium:'var(--impact-medium-bg)', Low:'var(--paper-3)' };

  const roi = calcROI(audit, ids);
  const sortedFailItems = sortItems(failItems, findingsSort);

  // Phase grouping for 'phase' sort mode
  const quickWins = sortedFailItems.filter(i => getItemState(audit, i.id).phase === 'quick-win');
  const tests     = sortedFailItems.filter(i => getItemState(audit, i.id).phase !== 'quick-win');

  function togglePhase(itemId) {
    if (!onUpdateItem) return;
    const current = getItemState(audit, itemId).phase;
    onUpdateItem(itemId, { phase: current === 'quick-win' ? 'test' : 'quick-win' });
  }

  function PhaseToggle({ item }) {
    const phase = getItemState(audit, item.id).phase;
    const isQW = phase === 'quick-win';
    return (
      <button
        onClick={e => { e.stopPropagation(); togglePhase(item.id); }}
        style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.08em', textTransform:'uppercase',
          padding:'2px 7px', border:'1px solid', cursor:'pointer', flexShrink:0,
          background: isQW ? 'var(--accent-positive-bg)' : 'var(--paper-3)',
          color:       isQW ? 'var(--accent-positive)' : 'var(--ink-5)',
          borderColor: isQW ? 'var(--accent-positive)' : 'var(--rule-2)' }}>
        {isQW ? 'Quick win' : 'Test'}
      </button>
    );
  }

  return (
    <div data-stage="findings">
      {/* Sticky stage header bar */}
      <div style={{ position:'sticky', top:0, zIndex:10, background:'var(--paper-2)',
        borderBottom:'1px solid var(--rule)', padding:'10px 20px',
        display:'flex', alignItems:'center', gap:12, flexWrap:'wrap' }}>
        <span style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.12em', textTransform:'uppercase',
          color:'var(--btn-ink)', background:'var(--btn-bg)', padding:'2px 8px', flexShrink:0 }}>02 — Findings</span>
        <span style={{ fontFamily:"var(--font-mono)", fontSize:10, color:'var(--ink-5)', letterSpacing:'0.04em', flexShrink:0 }}>
          {failItems.length} finding{failItems.length !== 1 ? 's' : ''} · {ids.size} selected for ROI
        </span>
        <div style={{ marginLeft:'auto' }}>
          <SortControl
            value={findingsSort}
            onChange={setFindingsSort}
            options={[
              { value:'phase',     label:'Phase' },
              { value:'impact',    label:'Impact' },
              { value:'fix_time',  label:'Fix Time' },
              { value:'quickwins', label:'Quick Wins' },
              { value:'lift',      label:'CVR Lift' },
            ]}
          />
        </div>
      </div>

      <div style={{ maxWidth:840, margin:'0 auto', padding:'32px 24px 60px' }}>
      <h2 style={{ fontFamily:"var(--font-sans)", fontSize:26, fontWeight:400, color:'var(--ink)',
        letterSpacing:'-0.4px', marginBottom:6 }}>Findings</h2>
      <p style={{ fontFamily:"var(--font-sans)", fontSize:13, color:'var(--ink-4)', lineHeight:1.6,
        marginBottom:28 }}>
        Select which findings to include in the ROI calculation. High-impact items are checked by default.
      </p>

      {failItems.length === 0 ? (
        <div style={{ border:'1px solid var(--rule)', padding:'40px 24px', textAlign:'center', background:'var(--paper-2)',
          fontFamily:"var(--font-sans)", fontSize:14, color:'var(--ink-4)' }}>
          No failures marked yet — go back to the checklist and mark items as Fail.
        </div>
      ) : (
        <div style={{ border:'1px solid var(--rule)', borderRadius:4, overflow:'hidden' }}>
          {/* Table header — hidden on mobile via .findings-header CSS */}
          <div className="findings-header">
            {['', 'Finding', 'Priority', 'Fix Time', 'CVR Lift', 'Monthly +'].map((h, i) => (
              <div key={i} style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.1em',
                textTransform:'uppercase', color:'var(--ink-5)', textAlign: i >= 4 ? 'right' : 'left' }}>{h}</div>
            ))}
          </div>

          {findingsSort === 'phase' && quickWins.length > 0 && (
            <div style={{ padding:'8px 16px', background:'var(--paper-3)', borderBottom:'1px solid var(--rule)',
              fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.1em', textTransform:'uppercase',
              color:'var(--accent-positive)' }}>
              Phase 1 · Quick wins · ship this week · {quickWins.length} finding{quickWins.length !== 1 ? 's' : ''}
            </div>
          )}

          {(findingsSort === 'phase' ? quickWins : sortedFailItems).map(item => {
            const checked = ids.has(item.id);
            const itemState = getItemState(audit, item.id);
            const ci = audit.client_info || {};
            const revenue = parseFloat(ci.monthly_revenue) || 0;
            const aov = parseFloat(ci.aov) || 85;
            const cvrRaw = parseFloat(ci.cvr) || 1.8;
            const sessions = revenue > 0 ? revenue / (aov * (cvrRaw / 100)) : 0;
            const midLift = (item.lift_min + item.lift_max) / 2 / 100;
            const monthlyImpact = sessions * aov * midLift;
            return (
              <div key={item.id}
                className="findings-row"
                style={{ background: checked ? 'var(--row-checked-bg)' : 'var(--paper-2)' }}
                onClick={() => toggle(item.id)}
                onMouseEnter={e => { if (!checked) e.currentTarget.style.background='var(--paper-3)'; }}
                onMouseLeave={e => { if (!checked) e.currentTarget.style.background='var(--paper-2)'; }}>
                {/* Top section: checkbox + issue name. Desktop: display:contents (grid cols 1–2). Mobile: flex row. */}
                <div className="findings-row-top">
                  <div style={{ paddingTop:2, flexShrink:0 }}>
                    <div className="findings-cb" style={{ width:16, height:16, border:`2px solid ${checked ? 'var(--btn-bg)' : 'var(--rule-2)'}`,
                      background: checked ? 'var(--btn-bg)' : 'transparent', display:'flex',
                      alignItems:'center', justifyContent:'center', transition:'all 0.12s' }}>
                      {checked && <span className="findings-cb-check" style={{ color:'var(--btn-ink)', fontSize:10, lineHeight:1 }}>✓</span>}
                    </div>
                  </div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontFamily:"var(--font-sans)", fontSize:13, color:'var(--ink-2)',
                      lineHeight:1.3, marginBottom:3 }}>
                      {item.name.split(':')[0]}{itemState.finding ? `: ${itemState.finding}` : ''}
                    </div>
                    {itemState.recommendation && (
                      <div style={{ fontFamily:"var(--font-sans)", fontSize:11, color:'var(--ink-4)',
                        lineHeight:1.4 }}>{itemState.recommendation}</div>
                    )}
                    <div style={{ marginTop:4 }}>
                      <ViewportIcons viewport={item.primary_viewport} status={itemState.status} failsDesktop={itemState.fails_on_desktop} failsMobile={itemState.fails_on_mobile} size="findings" />
                    </div>
                  </div>
                </div>
                {/* Bottom section: impact + lift + revenue. Desktop: display:contents (grid cols 3–5). Mobile: flex row indented. */}
                <div className="findings-row-btm">
                  <div style={{ display:'flex', gap:5, alignItems:'center' }}>
                    <span style={{ fontFamily:"var(--font-mono)", fontSize:10, padding:'2px 7px',
                      background:IMPACT_BG[item.impact], color:IMPACT_COLOR[item.impact],
                      letterSpacing:'0.04em', textTransform:'uppercase' }}>{IMPACT_LABEL[item.impact] || item.impact}</span>
                    <PhaseToggle item={item} />
                  </div>
                  <div style={{ fontFamily:"var(--font-mono)", fontSize:11, color:'var(--ink-4)',
                    letterSpacing:'0.04em' }}>
                    <span className="findings-lbl" style={{ fontFamily:"var(--font-mono)", fontSize:9,
                      color:'var(--ink-5)', letterSpacing:'0.08em', textTransform:'uppercase', marginRight:3 }}>Fix </span>
                    {itemState.estimated_fix_time}
                  </div>
                  <div className="findings-col-lift" style={{ fontFamily:"var(--font-mono)", fontSize:11, color:'var(--accent-positive)',
                    textAlign:'right', letterSpacing:'0.04em' }}>
                    <span className="findings-lbl" style={{ fontFamily:"var(--font-mono)", fontSize:9,
                      color:'var(--ink-5)', letterSpacing:'0.08em', textTransform:'uppercase', marginRight:3 }}>CVR </span>
                    +{item.lift_min}–{item.lift_max}%
                  </div>
                  <div className="findings-col-rev" style={{ fontFamily:"var(--font-mono)", fontSize:11,
                    color: revenue > 0 ? 'var(--state-pass)' : 'var(--ink-5)',
                    textAlign:'right', letterSpacing:'0.04em' }}>
                    <span className="findings-lbl" style={{ fontFamily:"var(--font-mono)", fontSize:9,
                      color:'var(--ink-5)', letterSpacing:'0.08em', textTransform:'uppercase', marginRight:3 }}>Mo. </span>
                    {checked && revenue > 0 ? `+$${fmt(monthlyImpact)}` : '—'}
                  </div>
                </div>
              </div>
            );
          })}

          {findingsSort === 'phase' && tests.length > 0 && (
            <>
              <div style={{ padding:'8px 16px', background:'var(--paper-3)', borderBottom:'1px solid var(--rule)',
                borderTop:'2px solid var(--rule-2)', fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.1em',
                textTransform:'uppercase', color:'var(--ink-4)' }}>
                Phase 2 · Testing roadmap · {tests.length} test{tests.length !== 1 ? 's' : ''}
              </div>
              {tests.map(item => {
                const checked = ids.has(item.id);
                const itemState = getItemState(audit, item.id);
                const ci = audit.client_info || {};
                const revenue = parseFloat(ci.monthly_revenue) || 0;
                const aov = parseFloat(ci.aov) || 85;
                const cvrRaw = parseFloat(ci.cvr) || 1.8;
                const sessions = revenue > 0 ? revenue / (aov * (cvrRaw / 100)) : 0;
                const midLift = (item.lift_min + item.lift_max) / 2 / 100;
                const monthlyImpact = sessions * aov * midLift;
                return (
                  <div key={item.id}
                    className="findings-row"
                    style={{ background: checked ? 'var(--row-checked-bg)' : 'var(--paper-2)' }}
                    onClick={() => toggle(item.id)}
                    onMouseEnter={e => { if (!checked) e.currentTarget.style.background='var(--paper-3)'; }}
                    onMouseLeave={e => { if (!checked) e.currentTarget.style.background='var(--paper-2)'; }}>
                    <div className="findings-row-top">
                      <div style={{ paddingTop:2, flexShrink:0 }}>
                        <div className="findings-cb" style={{ width:16, height:16, border:`2px solid ${checked ? 'var(--accent)' : 'var(--rule-2)'}`,
                          background: checked ? 'var(--btn-bg)' : 'transparent', display:'flex',
                          alignItems:'center', justifyContent:'center', transition:'all 0.12s' }}>
                          {checked && <span className="findings-cb-check" style={{ color:'var(--btn-ink)', fontSize:10, lineHeight:1 }}>✓</span>}
                        </div>
                      </div>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontFamily:"var(--font-sans)", fontSize:13, color:'var(--ink-2)', lineHeight:1.3, marginBottom:3 }}>
                          {item.name.split(':')[0]}{itemState.finding ? `: ${itemState.finding}` : ''}
                        </div>
                        {itemState.recommendation && (
                          <div style={{ fontFamily:"var(--font-sans)", fontSize:11, color:'var(--ink-4)', lineHeight:1.4 }}>{itemState.recommendation}</div>
                        )}
                        <div style={{ marginTop:4 }}>
                          <ViewportIcons viewport={item.primary_viewport} status={itemState.status} failsDesktop={itemState.fails_on_desktop} failsMobile={itemState.fails_on_mobile} size="findings" />
                        </div>
                      </div>
                    </div>
                    <div className="findings-row-btm">
                      <div style={{ display:'flex', gap:5, alignItems:'center' }}>
                        <span style={{ fontFamily:"var(--font-mono)", fontSize:10, padding:'2px 7px',
                          background:IMPACT_BG[item.impact], color:IMPACT_COLOR[item.impact],
                          letterSpacing:'0.04em', textTransform:'uppercase' }}>{IMPACT_LABEL[item.impact] || item.impact}</span>
                        <PhaseToggle item={item} />
                      </div>
                      <div style={{ fontFamily:"var(--font-mono)", fontSize:11, color:'var(--ink-4)', letterSpacing:'0.04em' }}>
                        <span className="findings-lbl" style={{ fontFamily:"var(--font-mono)", fontSize:9, color:'var(--ink-5)', letterSpacing:'0.08em', textTransform:'uppercase', marginRight:3 }}>Fix </span>
                        {itemState.estimated_fix_time}
                      </div>
                      <div className="findings-col-lift" style={{ fontFamily:"var(--font-mono)", fontSize:11, color:'var(--accent-positive)', textAlign:'right', letterSpacing:'0.04em' }}>
                        <span className="findings-lbl" style={{ fontFamily:"var(--font-mono)", fontSize:9, color:'var(--ink-5)', letterSpacing:'0.08em', textTransform:'uppercase', marginRight:3 }}>CVR </span>
                        +{item.lift_min}–{item.lift_max}%
                      </div>
                      <div className="findings-col-rev" style={{ fontFamily:"var(--font-mono)", fontSize:11,
                        color: revenue > 0 ? 'var(--state-pass)' : 'var(--ink-5)', textAlign:'right', letterSpacing:'0.04em' }}>
                        <span className="findings-lbl" style={{ fontFamily:"var(--font-mono)", fontSize:9, color:'var(--ink-5)', letterSpacing:'0.08em', textTransform:'uppercase', marginRight:3 }}>Mo. </span>
                        {checked && revenue > 0 ? `+$${fmt(monthlyImpact)}` : '—'}
                      </div>
                    </div>
                  </div>
                );
              })}
            </>
          )}

        </div>
      )}

      {/* Quick summary */}
      {failItems.length > 0 && ids.size > 0 && (
        <div style={{ marginTop:24, fontFamily:"var(--font-mono)", fontSize:11, color:'var(--ink-4)',
          letterSpacing:'0.04em' }}>
          {roi.hasData

        <div style={{ padding:'20px' }}>

          {/* Fee inputs */}

function ReportStage({ audit, checkedIds, onGoToScripts }) {

  // Group fail items by phase for Phase 1 / Phase 2 sections

// ─── COMPONENTS C: AuditWorkspace, App ───────────────────────────────────────

function AuditWorkspace({ auditId, store, onUpdateItem, onUpdatePricing, onSaveClientInfo, onBack, theme, onToggleTheme, saveStatus }) {
  const audit = store.audits[auditId];
  const [clientInfoOpen, setClientInfoOpen] = useState(false);
  const [clientInfoSkipTarget, setClientInfoSkipTarget] = useState(null);

  // Stage layout:
  // 0=Setup  1=Checklist  2=Findings(Revenue)  3=Calculator(Revenue)  4=Report  5=Scripts
  const isNewAudit = (() => {
    const ci2 = audit?.client_info || {};
    return !ci2.audit_title && !ci2.client_name && !ci2.monthly_revenue;
  })();
  const [stageIndex, setStageIndex] = useState(isNewAudit ? 0 : 1);

  const findingsKey = `liftkit-findings-${auditId}`;
  const [checkedIds, setCheckedIds] = useState(() => {
    if (demoMode) return null;
    try {
      const saved = localStorage.getItem(findingsKey);
      return saved ? new Set(JSON.parse(saved)) : null;
    } catch { return null; }
  });
  const [checklistCtx, setChecklistCtx] = useState({ short: SECTIONS[0].short, idx: 1, len: SECTIONS[0].items.length });
  const [cardGlowTrigger, setCardGlowTrigger] = useState(0);

  useEffect(() => {
    if (!demoMode && checkedIds !== null) {
      try { localStorage.setItem(findingsKey, JSON.stringify([...checkedIds])); } catch {}
    }
  }, [checkedIds]);

  if (!audit) return null;

  const ci = audit.client_info || {};
  const auditDisplayTitle = ci.audit_title || ci.client_name || 'New Audit';
  const metricsIncomplete = !ci.monthly_revenue || !ci.aov || !ci.cvr;
  const setupDone = !!(ci.audit_title || ci.client_name) && !!ci.auditor_name;

  // Step strip config: each tab maps to a stage index (Revenue covers stages 2–3)
  const STEPS = [
    { label: '01 Setup',     stage: 0,  activeOn: [0] },
    { label: '02 Checklist', stage: 1,  activeOn: [1] },
    { label: '03 Revenue',   stage: 2,  activeOn: [2, 3] },
    { label: '04 Report',    stage: 4,  activeOn: [4] },
    { label: '05 Scripts',   stage: 5,  activeOn: [5] },
  ];

  // Next-step config per stage
  const NEXT_CONFIG = {
    0: { label: 'Start checklist →', nextStage: 1 },
    1: { label: 'Size the revenue →', nextStage: 2, guard: () => metricsIncomplete },
    2: { label: 'See the numbers →', nextStage: 3 },
    3: { label: 'View report →', nextStage: 4 },
    4: { label: 'See scripts →', nextStage: 5 },
    5: null,
  };

  function goNext() {
    const cfg = NEXT_CONFIG[stageIndex];
    if (!cfg) return;
    if (cfg.guard && cfg.guard()) {
      setClientInfoSkipTarget(cfg.nextStage);
      setClientInfoOpen(true);
    } else {
      setStageIndex(cfg.nextStage);
    }
  }

  function goPrev() {
    if (stageIndex === 0) { onBack(); return; }
    // Revenue Calculator (3) goes back to Revenue Findings (2)
    setStageIndex(stageIndex - 1);
  }

  const stageVisible = (n) => ({
    position:'absolute', inset:0,
    opacity: n === stageIndex ? 1 : 0,
    pointerEvents: n === stageIndex ? 'auto' : 'none',
    transition: 'opacity 0.12s ease',
  });

  const saveLabel = saveStatus === 'saved' ? '✓ Saved · just now'
    : saveStatus === 'saving' ? 'Saving…'
    : 'Draft · saved locally';
  const saveDone = saveStatus === 'saved';

  return (
    <div style={{ position:'fixed', inset:0, display:'flex', flexDirection:'column', background:'var(--bg)' }}>

      {/* Demo banner */}
      {demoMode && (
        <div className="demo-banner no-print">
          <span className="demo-banner__chip">DEMO</span>
          <span>Nothing here is saved. Refreshing the page clears this audit.</span>
          <a href="https://croauditsystem.lemonsqueezy.com/checkout/buy/9da78faa-4513-40c6-9469-621292edd053" className="demo-banner__cta">Get the full kit →</a>
        </div>
      )}

      {/* ── Audit top bar ── */}
      <div className="audit-topbar no-print">
        <button className="audit-topbar__wordmark" onClick={onBack} title="Back to audits"
          style={{ cursor:'pointer', background:'none', border:'none', padding:0 }}>
          {THEME.product.name}
        </button>
        <span className="audit-topbar__sep">/</span>
        <button className="audit-topbar__crumb" onClick={onBack}>Audits</button>
        <span className="audit-topbar__sep">/</span>
        <span className="audit-topbar__title">{auditDisplayTitle}</span>
        <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:10 }}>
          <span className={`audit-topbar__save desktop-only${saveDone ? ' saved' : ''}`}>{saveLabel}</span>
          <button onClick={() => setClientInfoOpen(true)} className="btn btn-secondary btn-sm">
            Edit info
          </button>
          {!demoMode && (
            <button onClick={() => {
              const name = (ci.audit_title || ci.client_name || 'audit').toLowerCase().replace(/\s+/g,'-');
              downloadJSON(audit, `triage-audit-${name}-${audit.id}.json`);
            }} className="btn btn-secondary btn-sm desktop-only">
              Export .json
            </button>
          )}
          <ThemeToggle theme={theme} onToggle={onToggleTheme} />
        </div>
      </div>

      {/* ── Step strip ── */}
      <div className="step-strip no-print">
        {STEPS.map(step => {
          const isActive = step.activeOn.includes(stageIndex);
          const isDone   = step.activeOn.every(s => s < stageIndex) && !isActive;
          return (
            <button
              key={step.label}
              className={`step-tab${isActive ? ' active' : ''}${isDone ? ' done' : ''}`}
              onClick={() => setStageIndex(step.stage)}>
              <span className="step-check" style={{ visibility: isDone ? 'visible' : 'hidden' }}>✓</span>
              {step.label}
            </button>
          );
        })}
        {/* Right-side summary in strip */}
        <div className="desktop-only" style={{ marginLeft:'auto', display:'flex', alignItems:'center',
          paddingRight:20, fontFamily:'var(--font-mono)', fontSize:10, color:'var(--mute)',
          letterSpacing:'0.06em', gap:14, flexShrink:0 }}>
          {stageIndex >= 1 && (
            <span>{AUDIT_ITEMS.filter(i => getItemState(audit,i.id).status !== 'tbd').length}/60 reviewed</span>
          )}
          {stageIndex >= 2 && (
            <span style={{ color:'var(--loss)' }}>
              {AUDIT_ITEMS.filter(i => getItemState(audit,i.id).status === 'fail').length} fails
            </span>
          )}
        </div>
      </div>

      {/* ── Stage container ── */}
      <div style={{ flex:1, overflow:'hidden', position:'relative' }}>

        {/* Setup */}
        <div data-stage="setup" style={{ ...stageVisible(0), overflowY:'auto' }}>
          <SetupStage audit={audit} lastAuditorName={store.last_auditor_name}
            onSave={(data) => { onSaveClientInfo(audit.id, data); setStageIndex(1); setCardGlowTrigger(n => n+1); }}
            onBack={onBack} />
        </div>

        {/* Checklist */}
        <div data-stage="checklist" style={{ ...stageVisible(1), display:'flex', flexDirection:'column', overflow:'hidden' }}>
          <ChecklistStage audit={audit} onUpdateItem={onUpdateItem}
            onScrollToFindings={() => setStageIndex(2)}
            onContextChange={setChecklistCtx}
            cardGlowTrigger={cardGlowTrigger} />
        </div>

        {/* Revenue — Findings */}
        <div data-stage="findings" style={{ ...stageVisible(2), overflowY:'auto' }}>
          <FindingsStage audit={audit} checkedIds={checkedIds} setCheckedIds={setCheckedIds}
            onUpdateItem={(itemId, updates) => onUpdateItem(audit.id, itemId, updates)} />
        </div>

        {/* Revenue — Calculator */}
        <div data-stage="calculator" style={{ ...stageVisible(3), overflowY:'auto' }}>
          <CalculatorStage audit={audit} checkedIds={checkedIds} onUpdatePricing={onUpdatePricing} />
        </div>

        {/* Report */}
        <div data-stage="report" style={{ ...stageVisible(4), overflowY:'auto' }}>
          <ReportStage audit={audit} checkedIds={checkedIds} onGoToScripts={() => setStageIndex(5)} />
        </div>

        {/* Scripts */}
        <div data-stage="scripts" style={{ ...stageVisible(5), overflowY:'auto' }}>
          <ScriptsStage audit={audit} />
        </div>

      </div>

      {/* ── Footer action bar ── */}
      <div className="footer-bar no-print">
        <button onClick={goPrev} className="btn btn-secondary">
          ← {stageIndex === 0 ? 'Audits' : 'Previous step'}
        </button>
        <div />
        {NEXT_CONFIG[stageIndex] && (
          <button onClick={goNext} className="btn btn-primary btn-lg">
            {NEXT_CONFIG[stageIndex].label}
          </button>
        )}
      </div>

      {/* Client info overlay */}
      {clientInfoOpen && (
        <ClientInfoOverlay audit={audit} lastAuditorName={store.last_auditor_name}
          onSave={(data) => { onSaveClientInfo(audit.id, data); if (clientInfoSkipTarget !== null) setStageIndex(clientInfoSkipTarget); setClientInfoOpen(false); setClientInfoSkipTarget(null); }}
          onClose={() => { setClientInfoOpen(false); setClientInfoSkipTarget(null); }}
          onSkip={clientInfoSkipTarget !== null ? () => { setStageIndex(clientInfoSkipTarget); setClientInfoOpen(false); setClientInfoSkipTarget(null); } : null} />
      )}
    </div>
  );
}

function App() {
  const [store, setStore] = useState(initStore);
  const [appScreen, setAppScreen] = useState('list'); // 'list' | 'audit'
  const [activeAuditId, setActiveAuditId] = useState(null);
  const [theme, setTheme] = useState(() => localStorage.getItem('triage-theme') || 'light');
  const [user, setUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(!demoMode);
  const [auditsLoading, setAuditsLoading] = useState(!demoMode);
  const [dbError, setDbError] = useState(null);
  const [confirmDialog, setConfirmDialog] = useState(null);
  const [showNewAuditModal, setShowNewAuditModal] = useState(false);
  const [showHelpModal, setShowHelpModal] = useState(false);
  const saveTimers = useRef({});
  // Track updated_at of last-saved version per audit to skip unnecessary Supabase writes
  const savedAt = useRef({});

  useEffect(() => {
    if (theme === 'light') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
    try { localStorage.setItem('triage-theme', theme); } catch {}
  }, [theme]);

  function toggleTheme() { setTheme(t => t === 'dark' ? 'light' : 'dark'); }

  useEffect(() => {
    if (demoMode) return;
    _supabase.auth.getUser().then(({ data: { user } }) => {
      setUser(user ?? null);
      setAuthLoading(false);
    });
    const { data: { subscription } } = _supabase.auth.onAuthStateChange((_event, session) => {
      setUser(session?.user ?? null);
      setAuthLoading(false);
    });
    return () => subscription.unsubscribe();
  }, []);

  async function handleSignOut() {
    await _supabase.auth.signOut();
  }

  // Persist last_auditor_name to localStorage (audits live in Supabase now)
  useEffect(() => {
    if (!demoMode) {
      try { localStorage.setItem(THEME.storage.key, JSON.stringify({ last_auditor_name: store.last_auditor_name })); } catch {}
    }
  }, [store.last_auditor_name]);

  // Load audits from Supabase after auth resolves
  useEffect(() => {
    if (demoMode || !user) return;
    setAuditsLoading(true);
    fetchAuditsFromDB(user.id)
      .then(audits => {
        Object.values(audits).forEach(a => { savedAt.current[a.id] = a.updated_at; });
        setStore(prev => ({ ...prev, audits }));
        setAuditsLoading(false);
      })
      .catch(err => {
        console.error('fetchAudits:', err);
        setDbError('Could not load audits. Check your connection.');
        setAuditsLoading(false);
      });
  }, [user?.id]);

  // Debounced save — only fires for audits whose updated_at changed since last save
  useEffect(() => {
    if (demoMode || !user) return;
    Object.values(store.audits).forEach(audit => {
      if (savedAt.current[audit.id] === audit.updated_at) return;
      clearTimeout(saveTimers.current[audit.id]);
      saveTimers.current[audit.id] = setTimeout(() => {
        upsertAuditToDB(user.id, audit)
          .then(() => { savedAt.current[audit.id] = audit.updated_at; })
          .catch(err => {
            console.error('upsertAudit:', err);
            setDbError('Save failed. Check your connection.');
          });
      }, 1500);
    });
  }, [store.audits]);

  function updateStore(fn) { setStore(prev => fn(prev)); }

  function handleDismissError() { setDbError(null); }

  function handleNew() {
    if (!demoMode && Object.keys(store.audits).length >= THEME.limits.maxActiveAudits) {
      setDbError(THEME.copy.workspaceFull);
      return;
    }
    setShowNewAuditModal(true);
  }

  async function handleCreateAudit(formData) {
    const base = newAudit(store.last_auditor_name);
    const audit = {
      ...base,
      client_info: {
        ...base.client_info,
        audit_title:     formData.audit_title.trim(),
        client_name:     formData.client_name.trim(),
        auditor_name:    formData.auditor_name.trim(),
        store_url:       formData.store_url.trim(),
        shopify_theme:   formData.shopify_theme.trim(),
        audit_date:      formData.audit_date || today(),
        monthly_revenue: parseFloat(formData.monthly_revenue) || 0,
        aov:             parseFloat(formData.aov) || 0,
        cvr:             parseFloat(formData.cvr) || 0,
      },
      pricing: { ...base.pricing, audit_fee: parseFloat(formData.audit_fee) || 0 },
    };
    setShowNewAuditModal(false);
    if (!demoMode) {
      try {
        await upsertAuditToDB(user.id, audit);
        savedAt.current[audit.id] = audit.updated_at;
      } catch (err) {
        setDbError(err.message?.includes('audit_limit_reached')
          ? THEME.copy.workspaceFull
          : 'Could not create audit. Check your connection.');
        return;
      }
    }
    updateStore(prev => ({
      ...prev,
      last_auditor_name: formData.auditor_name.trim() || prev.last_auditor_name,
      audits: { ...prev.audits, [audit.id]: audit },
    }));
    setActiveAuditId(audit.id);
    setAppScreen('audit');
  }

  function handleOpen(id) {
    setActiveAuditId(id);
    setAppScreen('audit');
  }

  function handleArchive(id) {
    const audit = store.audits[id];
    const auditTitle = audit.client_info?.audit_title || audit.client_info?.client_name || 'this audit';
    setConfirmDialog({
      title: 'Export & Delete',
      message: `"${auditTitle}" will be exported as a JSON file and removed from your active audits. You can reimport it later if you have an open slot.`,
      confirmLabel: 'Export & Delete',
      danger: true,
      onConfirm: async () => {
        const name = auditTitle.toLowerCase().replace(/\s+/g, '-');
        downloadJSON(audit, `cro-audit-${name}-${id}.json`);
        if (!demoMode) {
          try {
            await deleteAuditFromDB(id);
            delete savedAt.current[id];
          } catch (err) {
            setDbError('Delete failed. Check your connection.');
            return;
          }
        }
        updateStore(prev => { const { [id]: _, ...rest } = prev.audits; return { ...prev, audits: rest }; });
      },
    });
  }

  async function handleDuplicate(id) {
    if (!demoMode && Object.keys(store.audits).length >= THEME.limits.maxActiveAudits) {
      setDbError(THEME.copy.workspaceFull);
      return;
    }
    const audit = store.audits[id];
    const newId = genId();
    const now = new Date().toISOString();
    const dupeAudit = { ...audit, id: newId, created_at: now, updated_at: now,
      client_info: { ...audit.client_info }, items: { ...audit.items } };
    if (!demoMode) {
      try {
        await upsertAuditToDB(user.id, dupeAudit);
        savedAt.current[newId] = dupeAudit.updated_at;
      } catch (err) {
        setDbError(err.message?.includes('audit_limit_reached')
          ? THEME.copy.workspaceFull
          : 'Could not duplicate audit. Check your connection.');
        return;
      }
    }
    updateStore(prev => ({ ...prev, audits: { ...prev.audits, [newId]: dupeAudit } }));
  }

  function handleDelete(id) {
    const audit = store.audits[id];
    const auditTitle = audit.client_info?.audit_title || audit.client_info?.client_name || 'this audit';
    setConfirmDialog({
      title: 'Delete Audit',
      message: `Delete "${auditTitle}"? This cannot be undone.`,
      confirmLabel: 'Delete',
      danger: true,
      onConfirm: async () => {
        if (!demoMode) {
          try {
            await deleteAuditFromDB(id);
            delete savedAt.current[id];
          } catch (err) {
            setDbError('Delete failed. Check your connection.');
            return;
          }
        }
        updateStore(prev => { const { [id]: _, ...rest } = prev.audits; return { ...prev, audits: rest }; });
        if (activeAuditId === id) { setActiveAuditId(null); setAppScreen('list'); }
      },
    });
  }

  async function handleImport(data) {
    if (!demoMode && Object.keys(store.audits).length >= THEME.limits.maxActiveAudits) {
      setDbError(THEME.copy.workspaceFull);
      return;
    }
    const newId = genId();
    const now = new Date().toISOString();
    const audit = { ...data, id: newId, updated_at: now };
    if (!demoMode) {
      try {
        await upsertAuditToDB(user.id, audit);
        savedAt.current[newId] = audit.updated_at;
      } catch (err) {
        setDbError(err.message?.includes('audit_limit_reached')
          ? THEME.copy.workspaceFull
          : 'Could not import audit. Check your connection.');
        return;
      }
    }
    updateStore(prev => ({ ...prev, audits: { ...prev.audits, [newId]: audit } }));
  }

  function handleUpdateItem(auditId, itemId, updates) {
    updateStore(prev => {
      const audit = prev.audits[auditId];
      return { ...prev, audits: { ...prev.audits, [auditId]: {
        ...audit, updated_at: new Date().toISOString(),
        items: { ...audit.items, [itemId]: { ...(audit.items[itemId] || {}), ...updates } },
      }}};
    });
  }

  function handleUpdatePricing(auditId, pricing) {
    updateStore(prev => {
      const audit = prev.audits[auditId];
      return { ...prev, audits: { ...prev.audits, [auditId]: {
        ...audit, updated_at: new Date().toISOString(), pricing,
      }}};
    });
  }

  function handleSaveClientInfo(auditId, { client_info, pricing }) {
    updateStore(prev => {
      const audit = prev.audits[auditId];
      return {
        ...prev,
        last_auditor_name: client_info.auditor_name,
        audits: { ...prev.audits, [auditId]: {
          ...audit, client_info, updated_at: new Date().toISOString(),
          pricing: { ...audit.pricing, audit_fee: pricing.audit_fee },
        }},
      };
    });
  }

  if (authLoading) return null;
  if (!demoMode && !user) return <LoginScreen />;

  if (appScreen === 'audit' && activeAuditId) {
    return (
      <>
        <AuditWorkspace
          auditId={activeAuditId}
          store={store}
          onUpdateItem={handleUpdateItem}
          onUpdatePricing={handleUpdatePricing}
          onSaveClientInfo={handleSaveClientInfo}
          onBack={() => setAppScreen('list')}
          theme={theme}
          onToggleTheme={toggleTheme}
          saveStatus={demoMode ? 'local' : (
            store.audits[activeAuditId] &&
            savedAt.current[activeAuditId] === store.audits[activeAuditId]?.updated_at
              ? 'saved' : 'saving'
          )}
        />
        <ConfirmDialog dialog={confirmDialog} onClose={() => setConfirmDialog(null)} />
      </>
    );
  }

  return (
    <>
      {demoMode && (
        <div className="demo-banner">
          <span className="demo-banner__chip">DEMO</span>
          <span>Nothing here is saved. Refreshing the page clears this audit.</span>
          <a href="https://croauditsystem.lemonsqueezy.com/checkout/buy/9da78faa-4513-40c6-9469-621292edd053" className="demo-banner__cta">Get the full kit →</a>
        </div>
      )}
      <SiteHeader theme={theme} onToggleTheme={toggleTheme} onHelp={() => setShowHelpModal(true)} user={user} onSignOut={handleSignOut} />
      <AuditList
        store={store}
        onNew={handleNew}
        onOpen={handleOpen}
        onArchive={handleArchive}
        onDuplicate={handleDuplicate}
        onDelete={handleDelete}
        onImport={handleImport}
        onSaveClientInfo={handleSaveClientInfo}
        user={user}
        onSignOut={handleSignOut}
        auditsLoading={auditsLoading}
        dbError={dbError}
        onDismissError={handleDismissError}
      />
      {showNewAuditModal && (
        <NewAuditModal
          lastAuditorName={store.last_auditor_name}
          onSubmit={handleCreateAudit}
          onClose={() => setShowNewAuditModal(false)}
        />
      )}
      {showHelpModal && <HelpModal onClose={() => setShowHelpModal(false)} />}
      <ConfirmDialog dialog={confirmDialog} onClose={() => setConfirmDialog(null)} />
    </>
  );
}
// ─── END COMPONENTS C ───

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
