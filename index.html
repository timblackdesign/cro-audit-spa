        <div style={{ background:'var(--paper-3)', borderBottom:'1px solid var(--rule)', padding:'10px 20px' }}>
          <span style={{ fontFamily:"var(--font-mono)", fontSize:10, letterSpacing:'0.08em',
            textTransform:'uppercase', color:'var(--ink-4)' }}>Proposal Summary</span>
        </div>
        {[
          ['Scope',
            `${ids.size} of ${failCount} finding${failCount !== 1 ? 's' : ''} in scope`,
            ids.size > 0 ? `${qwCount} quick win${qwCount !== 1 ? 's' : ''} · ${testCount} test${testCount !== 1 ? 's' : ''}` : null],
          ['Estimated CVR lift from scope',
            roi.hasData ? `+${Math.round(roi.cappedMin)}–${Math.round(roi.cappedMax)}% (+${roi.cappedMinPP.toFixed(2)}–${roi.cappedMaxPP.toFixed(2)}pp${roi.atCeiling ? ', ceiling' : ''})` : '—',
            roi.hasData ? `mid: +${Math.round(roi.cappedMid)}% (+${roi.cappedMidPP.toFixed(2)}pp)` : 'Add store metrics to calculate'],
          ['Revenue at stake · per year',
            roi.hasData ? `$${fmt(roi.annualRecovery)}` : '—',
            roi.hasData ? `$${fmt(roi.monthlyRecovery)}/month` : null],
          ['Suggested fee for the scope',
            roi.totalInvestment > 0 ? `$${fmt(roi.totalInvestment)}` : '—',
            roi.auditFee > 0 || roi.implFee > 0
              ? `Audit $${fmt(roi.auditFee)} · Implementation $${fmt(roi.implFee)}`
              : 'Set fees in Your Pricing above'],
          ['Client ROI',
            roi.hasData && roi.roiMultiple > 0 ? `${roi.roiMultiple.toFixed(1)}× return` : '—',
            roi.hasData && roi.paybackMonths > 0 ? `payback in ${roi.paybackMonths.toFixed(1)} months` : null],
        ].map(([label, value, sub], i, arr) => (
          <div key={label}
            className="proposal-row"
            style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', padding:'14px 20px',
              borderBottom: i < arr.length - 1 ? '1px solid var(--rule)' : 'none',
              background:'var(--paper-2)', gap:16, flexWrap:'wrap' }}>
            <span style={{ fontFamily:"var(--font-mono)", fontSize:11, letterSpacing:'0.06em',
              textTransform:'uppercase', color:'var(--ink-4)', flexShrink:0 }}>{label}</span>
            <div className="proposal-val" style={{ textAlign:'right' }}>
              <div style={{ fontFamily:"var(--font-sans)", fontSize:18, color:'var(--ink)',
                letterSpacing:'-0.3px' }}>{value}</div>
              {sub && <div style={{ fontFamily:"var(--font-mono)", fontSize:10, color:'var(--ink-5)', marginTop:2 }}>{sub}</div>}
            </div>
          </div>
        ))}
      </div>

      </div>
    </div>
  );
}

function ReportStage({ audit, checkedIds, onGoToScripts }) {
  const ids = checkedIds || new Set();
  const roi = calcROI(audit, ids);
  const ci = audit.client_info || {};
  const failItems = AUDIT_ITEMS.filter(i => getItemState(audit, i.id).status === 'fail' && ids.has(i.id));
  const completedCount = AUDIT_ITEMS.filter(i => { const s = getItemState(audit, i.id).status; return s === 'pass' || s === 'fail'; }).length;

  // Group fail items by phase for Phase 1 / Phase 2 sections
  const phase1Items = [...failItems].sort((a, b) => IMPACT_RANK[a.impact] - IMPACT_RANK[b.impact])
    .filter(i => getItemState(audit, i.id).phase === 'quick-win');
  const phase2Items = [...failItems].sort((a, b) => IMPACT_RANK[a.impact] - IMPACT_RANK[b.impact])
    .filter(i => getItemState(audit, i.id).phase !== 'quick-win');

  // Also group by section for legacy section layout (kept for fallback)
  const failsBySec = SECTION_ORDER
    .map(sec => ({ label: sec, items: failItems.filter(i => i.section === sec) }))
    .filter(s => s.items.length > 0);

  const sectionCount = failsBySec.length;

  // Neutral print palette — white bg, black ink, no triage branding
  const r = {
    ink:    '#0B0C0A',
    ink2:   '#2A2C28',
    ink3:   '#5A5D56',
    ink4:   '#9A9D94',
    rule:   '#CBCEC4',
    rule2:  '#B8BBB0',
    bg:     '#ffffff',
    bg2:    '#f5f5f3',
    accent: '#0B0C0A',
    high:   '#C2381C', highBg: '#fdf0ed',
    med:    '#B85C00', medBg:  '#fdf4ec',
    low:    '#5A5D56', lowBg:  '#f3f4f1',
  };

  const mono  = "'Geist Mono', monospace";
  const serif = "'Geist', sans-serif";
  const sans  = "'Geist', sans-serif";

  const impactColor = { High: r.high, Medium: r.med, Low: r.low };
  const impactBg    = { High: r.highBg, Medium: r.medBg, Low: r.lowBg };

  const pill = (text, color, bg) => (
    <span style={{ fontFamily:mono, fontSize:9, letterSpacing:'0.06em', textTransform:'uppercase',
      color, background:bg, padding:'3px 8px', border:`1px solid ${color}22`, whiteSpace:'nowrap' }}>
      {text}
    </span>
  );

  return (
    <div data-stage="report">
      {/* Sticky dark header bar — matches other stages */}
      <div className="no-print" style={{ position:'sticky', top:0, zIndex:10, background:'var(--paper-2)',
        borderBottom:'1px solid var(--rule)', padding:'10px 20px',
        display:'flex', alignItems:'center', gap:12 }}>
        <span style={{ fontFamily:mono, fontSize:9, letterSpacing:'0.12em', textTransform:'uppercase',
          color:'var(--on-accent,#0B0C0A)', background:'var(--accent)', padding:'2px 8px' }}>03 — Report</span>
        <button onClick={() => window.print()} className="no-print"
          style={{ background:'none', border:'1px solid var(--rule)', color:'var(--ink-4)', padding:'6px 14px',
            fontFamily:mono, fontSize:10, letterSpacing:'0.06em', textTransform:'uppercase', cursor:'pointer' }}>
          Print / Export PDF
        </button>
        {onGoToScripts && (
          <button onClick={onGoToScripts} className="no-print"
            style={{ marginLeft:'auto', background:'none', border:'1px solid var(--rule)', color:'var(--ink-4)',
              padding:'6px 14px', fontFamily:mono, fontSize:10, letterSpacing:'0.06em', textTransform:'uppercase',
              cursor:'pointer' }}>
            04 — Scripts →
          </button>
        )}
      </div>

      {/* White paper body */}
      <div style={{ background: r.bg, minHeight:'100%' }}>
        <div style={{ maxWidth:760, margin:'0 auto', padding:'48px 32px 80px' }}>

          {/* ── COVER ── */}
          <div style={{ marginBottom:40 }}>
            <div style={{ fontFamily:mono, fontSize:10, letterSpacing:'0.14em', textTransform:'uppercase',
              color:r.ink3, marginBottom:20 }}>
              Shopify CRO Audit

            <h1 style={{ fontFamily:serif, fontSize:52, fontWeight:600, color:r.ink,
              letterSpacing:'-0.05em', lineHeight:1, marginBottom:20 }}>
              {ci.audit_title || ci.client_name || 'Client'}

            <div style={{ display:'flex', gap:32, flexWrap:'wrap', marginBottom:24 }}>

                ['Date',   fmtDate(ci.audit_date)],

                <div key={l}>

                    textTransform:'uppercase', color:r.ink4, marginBottom:4 }}>{l}</div>
                  <div style={{ fontFamily:mono, fontSize:12, color:r.ink2 }}>{v}</div>
                </div>
              ))}
            </div>
            <div style={{ height:3, background:r.accent }} />
          </div>

          {/* ── REVENUE IMPACT SUMMARY ── */}
          <div style={{ marginBottom:40 }}>
            <div style={{ fontFamily:mono, fontSize:9, letterSpacing:'0.12em', textTransform:'uppercase',
              color:r.ink4, marginBottom:14 }}>Revenue Impact Summary</div>
            <div className="rpt-metric-grid" style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)',
              border:`1px solid ${r.rule}`, borderBottom:'none' }}>
              {[
                ['Monthly Sessions', roi.hasData ? fmt(roi.sessions)         : '—', 'estimated'],
                ['Current CVR',      roi.hasData ? fmtPct(roi.cvrRaw)        : '—', 'baseline'],
                ['Projected CVR',    roi.hasData ? fmtPct(roi.projCVRRaw) : '—',
                  roi.hasData ? (roi.atCeiling ? `≤80% (+${roi.cappedMinPP.toFixed(2)}–${roi.cappedMaxPP.toFixed(2)}pp)` : `+${Math.round(roi.cappedMin)}–${Math.round(roi.cappedMax)}% (+${roi.cappedMinPP.toFixed(2)}–${roi.cappedMaxPP.toFixed(2)}pp)`) : '—'],
                ['Monthly Recovery', roi.hasData ? `$${fmt(roi.monthlyRecovery)}` : '—', 'per month'],
                ['Annual at Risk',   roi.hasData ? `$${fmt(roi.annualRecovery)}`  : '—', 'if findings persist'],
                ['Findings',         failItems.length, `across ${sectionCount} section${sectionCount !== 1 ? 's' : ''}`],
              ].map(([label, value, sub], i) => (
                <div key={label} className="rpt-metric-cell" style={{ padding:'20px 18px', borderRight: i % 3 < 2 ? `1px solid ${r.rule}` : 'none',
                  borderBottom:`1px solid ${r.rule}` }}>
                  <div style={{ fontFamily:mono, fontSize:9, letterSpacing:'0.1em', textTransform:'uppercase',
                    color:r.ink4, marginBottom:8 }}>{label}</div>
                  <div style={{ fontFamily:serif, fontSize:28, color:r.ink, letterSpacing:'-0.5px',
                    lineHeight:1, marginBottom:5 }}>{value}</div>
                  <div style={{ fontFamily:mono, fontSize:10, color:r.ink4 }}>{sub}</div>
                </div>
              ))}
            </div>
          </div>

          {/* ── ENGAGEMENT SUMMARY (proposal) ── */}
          {roi.hasData && (
            <div style={{ marginBottom:48, border:`1px solid ${r.rule}` }}>
              <div style={{ background:r.bg2, padding:'10px 18px', borderBottom:`1px solid ${r.rule}` }}>
                <span style={{ fontFamily:mono, fontSize:9, letterSpacing:'0.1em', textTransform:'uppercase',
                  color:r.ink3 }}>Engagement Summary</span>
              </div>
              {[
                ['Scope',                   `${ids.size} finding${ids.size !== 1 ? 's' : ''}`],
                ['Estimated CVR lift',      roi.atCeiling ? `≤80% (+${roi.cappedMinPP.toFixed(2)}–${roi.cappedMaxPP.toFixed(2)}pp, at ceiling)` : `+${Math.round(roi.cappedMin)}–${Math.round(roi.cappedMax)}% (+${roi.cappedMinPP.toFixed(2)}–${roi.cappedMaxPP.toFixed(2)}pp)`],
                ['Revenue at stake · /yr', `$${fmt(roi.annualRecovery)}`],
                ['Suggested fee',           roi.totalInvestment > 0 ? `$${fmt(roi.totalInvestment)}` : 'TBD'],
                ['Return on audit',         roi.roiMultiple > 0 ? `${roi.roiMultiple.toFixed(1)}× · payback ${roi.paybackMonths.toFixed(1)} mo` : '—'],
              ].map(([l, v], i, arr) => (
                <div key={l} style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline',
                  padding:'12px 18px', borderBottom: i < arr.length - 1 ? `1px solid ${r.rule}` : 'none', gap:16 }}>
                  <span style={{ fontFamily:mono, fontSize:10, letterSpacing:'0.06em', textTransform:'uppercase',
                    color:r.ink3, flexShrink:0 }}>{l}</span>
                  <span style={{ fontFamily:serif, fontSize:16, color:r.ink, letterSpacing:'-0.2px',
                    textAlign:'right' }}>{v}</span>
                </div>

            </div>

          {/* ── ESTIMATES NOTE ── */}
          <div style={{ borderTop:`1px solid ${r.rule}`, paddingTop:20, marginBottom:40 }}>
            <p style={{ fontFamily:sans, fontSize:12, color:r.ink3, lineHeight:1.7, margin:0 }}>
              Figures are estimates built on benchmarked CVR lift ranges — not guarantees. Traffic, season, offer and audience all move conversion rate. The testing roadmap in phase 2 is how these numbers get confirmed: each test proves what a fix is worth.

          </div>

          {/* ── PHASE 1: QUICK WINS ── */}

                <div style={{ fontFamily:serif, fontSize:18, fontWeight:600, color:r.ink, letterSpacing:'-0.03em' }}>

                <div style={{ fontFamily:mono, fontSize:10, color:r.ink4, marginLeft:'auto' }}>

              </div>
              {phase1Items.map(item => {

                return (
                  <div key={item.id} style={{ marginBottom:24, paddingBottom:24, borderBottom:`1px solid ${r.rule}` }} className="print-section">
                    <div style={{ marginBottom:12 }}>

                      </div>
                    </div>
                    <div style={{ marginBottom:10 }}>
                      <div style={{ fontFamily:mono, fontSize:9, letterSpacing:'0.1em', textTransform:'uppercase', color:r.high, marginBottom:4 }}>Finding</div>
                      <p style={{ fontFamily:sans, fontSize:14, color:r.ink2, lineHeight:1.65, margin:0 }}>{state.finding || item.default_finding}</p>
                    </div>
                    <div style={{ paddingLeft:14, borderLeft:`3px solid ${r.rule}` }}>
                      <div style={{ fontFamily:mono, fontSize:9, letterSpacing:'0.1em', textTransform:'uppercase', color:r.ink3, marginBottom:4 }}>Fix</div>
                      <p style={{ fontFamily:sans, fontSize:14, color:r.ink2, lineHeight:1.65, margin:0 }}>{state.recommendation || item.default_recommendation}</p>
                    </div>
                    {state.screenshot_url && (
                      <div style={{ marginTop:8 }}>
                        <div style={{ fontFamily:mono, fontSize:9, letterSpacing:'0.1em', textTransform:'uppercase', color:r.ink4, marginBottom:3 }}>Screenshot</div>
                        <a href={state.screenshot_url} target="_blank" rel="noopener noreferrer"
                          style={{ fontFamily:mono, fontSize:10, color:r.ink2, wordBreak:'break-all', textDecoration:'underline', textUnderlineOffset:2 }}>{state.screenshot_url}</a>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {/* ── PHASE 2: TESTING ROADMAP ── */}
          {phase2Items.length > 0 && (
            <div style={{ marginBottom:48 }}>
              <div style={{ display:'flex', alignItems:'baseline', gap:12, marginBottom:24,
                paddingBottom:10, borderBottom:`2px solid ${r.rule2}` }}>
                <div style={{ fontFamily:mono, fontSize:9, letterSpacing:'0.12em', textTransform:'uppercase', color:r.ink3 }}>
                  Phase 2
                </div>
                <div style={{ fontFamily:serif, fontSize:18, fontWeight:600, color:r.ink, letterSpacing:'-0.03em' }}>
                  Testing roadmap
                </div>
                <div style={{ fontFamily:mono, fontSize:10, color:r.ink4, marginLeft:'auto' }}>
                  {phase2Items.length} test{phase2Items.length !== 1 ? 's' : ''}
                </div>
              </div>
              {phase2Items.map(item => {
                const state = getItemState(audit, item.id);
                return (
                  <div key={item.id} style={{ marginBottom:20, paddingBottom:20, borderBottom:`1px solid ${r.rule}` }} className="print-section">
                    <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:12, marginBottom:6 }}>
                      <div style={{ fontFamily:serif, fontSize:15, fontWeight:600, color:r.ink, letterSpacing:'-0.02em', lineHeight:1.3 }}>{item.name}</div>
                      <div style={{ display:'flex', gap:4, flexShrink:0 }}>
                        {pill(IMPACT_LABEL[item.impact] || item.impact, impactColor[item.impact], impactBg[item.impact])}
                      </div>
                    </div>
                    <p style={{ fontFamily:sans, fontSize:13, color:r.ink3, lineHeight:1.6, margin:0 }}>{state.finding || item.default_finding}</p>
                  </div>
                );
              })}
            </div>
          )}

          {/* Empty state */}
          {failItems.length === 0 && (
            <div style={{ padding:'48px 24px', textAlign:'center', border:`1px solid ${r.rule}`,
              fontFamily:mono, fontSize:12, color:r.ink4 }}>
              No findings yet — go back to the checklist and mark items as Flagged.
            </div>
          )}

        </div>
      </div>
    </div>
  );
}

function ScriptsStage({ audit }) {
  const ci = audit.client_info || {};
  const roi = calcROI(audit, new Set(Object.keys(audit.item_states || {}).filter(id => audit.item_states[id]?.status === 'fail')));

  const [extra, setExtra] = useState({ finding1:'', finding2:'', finding3:'' });

  function fill(str) {
    const vars = {
      '%client%':   ci.client_name   || '[client name]',
      '%store%':    ci.store_url     || ci.client_name || '[store]',
      '%you%':      ci.auditor_name  || '[your name]',
      '%rev%':      ci.monthly_revenue ? Number(ci.monthly_revenue).toLocaleString() : '[monthly revenue]',
      '%roi%':      roi.hasData ? Math.round(roi.monthlyRecovery).toLocaleString() : '[recovery estimate]',
      '%finding1%': extra.finding1 || '[top finding #1]',
      '%finding2%': extra.finding2 || '[top finding #2]',
      '%finding3%': extra.finding3 || '[top finding #3]',
    };
    return Object.entries(vars).reduce((s, [k, v]) => s.split(k).join(v), str);
  }

  async function copyText(text, id) {
    try { await navigator.clipboard.writeText(text); } catch(e) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;'; document.body.appendChild(ta);
      ta.select(); try { document.execCommand('copy'); } catch(e2) {} document.body.removeChild(ta);
    }
    const btn = document.getElementById(id);
    if (!btn) return;
    const orig = btn.textContent;
    btn.textContent = 'Copied ✓'; btn.style.color = 'var(--state-pass)';
    setTimeout(() => { btn.textContent = orig; btn.style.color = ''; }, 1800);
  }

  return (
    <div style={{ maxWidth:780, margin:'0 auto', padding:'32px 24px 80px' }}>
      <h2 style={{ fontFamily:"var(--font-sans)", fontSize:26, fontWeight:600, letterSpacing:'-0.045em',
        color:'var(--ink)', marginBottom:8 }}>Scripts</h2>
      <p style={{ fontFamily:"var(--font-mono)", fontSize:11, color:'var(--ink-4)', letterSpacing:'0.04em',
        marginBottom:32 }}>
        Use the structure. Add one specific detail about their store — a product, a recent launch, something from their About page.
      </p>

      {SCRIPT_TEMPLATES.map(t => (
        <div key={t.id} style={{ border:'1px solid var(--rule)', borderRadius:4, overflow:'hidden', marginBottom:24 }}>
          {/* Card header */}
          <div style={{ background:'var(--paper-2)', borderBottom:'1px solid var(--rule)', padding:'12px 18px',
            display:'flex', alignItems:'baseline', gap:10, flexWrap:'wrap' }}>

            <span style={{ fontFamily:"var(--font-sans)", fontSize:16, fontWeight:600, letterSpacing:'-0.03em',
              color:'var(--ink)' }}>{t.name}</span>
            <span style={{ fontFamily:"var(--font-mono)", fontSize:11, color:'var(--ink-4)', marginLeft:'auto' }}
              className="desktop-only">{t.tagline}</span>
          </div>

          {/* Extra fields for T3 */}
          {t.extraFields && (
            <div style={{ padding:'14px 18px', borderBottom:'1px solid var(--rule)', background:'var(--paper-3)' }}>
              <div style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.1em', textTransform:'uppercase',

        </p>

  );
}

// ─── COMPONENTS C: AuditWorkspace, App ───────────────────────────────────────

function AuditWorkspace({ auditId, store, onUpdateItem, onUpdatePricing, onSaveClientInfo, onBack, theme, onToggleTheme }) {
  const audit = store.audits[auditId];
  const [clientInfoOpen, setClientInfoOpen] = useState(false);
  const [clientInfoSkipTarget, setClientInfoSkipTarget] = useState(null);
  const [stageIndex, setStageIndex] = useState(0);
  const findingsKey = `liftkit-findings-${auditId}`;
  const [checkedIds, setCheckedIds] = useState(() => {
    if (demoMode) return null;
    try {
      const saved = localStorage.getItem(findingsKey);
      return saved ? new Set(JSON.parse(saved)) : null;
    } catch { return null; }
  });
  const [checklistCtx, setChecklistCtx] = useState({ short: SECTIONS[0].short, idx: 1, len: SECTIONS[0].items.length });
  const [nameEditing, setNameEditing] = useState(false);
  const [nameDraft, setNameDraft] = useState('');
  const [cardGlowTrigger, setCardGlowTrigger] = useState(0);
  const nameInputRef = useRef(null);
  const nameCancelRef = useRef(false);

  useEffect(() => {
    if (!demoMode && checkedIds !== null) {
      try { localStorage.setItem(findingsKey, JSON.stringify([...checkedIds])); } catch {}
    }
  }, [checkedIds]);

  useEffect(() => {
    if (nameEditing && nameInputRef.current) nameInputRef.current.focus();
  }, [nameEditing]);

  if (!audit) return null;

  const ci = audit.client_info || {};
  const auditDisplayTitle = ci.audit_title || ci.client_name || 'New Audit';
  const isSetupIncomplete = (!ci.audit_title && !ci.client_name) || !ci.monthly_revenue || !ci.aov || !ci.cvr;

  function commitName() {
    const trimmed = nameDraft.trim();
    if (trimmed) {
      onSaveClientInfo(audit.id, {
        client_info: { ...ci, audit_title: trimmed },
        pricing: audit.pricing,
      });
      setCardGlowTrigger(n => n + 1);
    }
    setNameEditing(false);
  }

  const STAGE_LABELS = ['01 — Checklist', '02 — Revenue', '02 — Revenue', '03 — Report', '04 — Scripts'];
  const NEXT_LABELS  = ['Size the Revenue', 'See the numbers', 'View Report', 'See Scripts', null];

  const SLIDE = 'transform 0.55s cubic-bezier(0.25,0.46,0.45,0.94)';
  const stageStyle = (n) => ({
    position:'absolute', inset:0,
    transition: SLIDE,
    transform: `translateY(calc((${n} - ${stageIndex}) * 100%))`,
    willChange: 'transform',
  });

  return (
    <div style={{ position:'fixed', inset:0, display:'flex', flexDirection:'column', background:'var(--paper)' }}>
      {/* Demo banner (inside fixed layout so it isn't obscured) */}
      {demoMode && (
        <div className="demo-banner no-print">
          <span className="demo-banner__chip">DEMO</span>
          <span>Nothing here is saved. Refreshing the page clears this audit.</span>
          <a href="https://croauditsystem.lemonsqueezy.com/checkout/buy/9da78faa-4513-40c6-9469-621292edd053" className="demo-banner__cta">Get the full kit →</a>
        </div>
      )}

      {/* Audit header */}
      <div className="no-print" style={{ background:'var(--paper-2)', borderBottom:'1px solid var(--rule)', padding:'0 32px',
        height:52, display:'flex', alignItems:'center', justifyContent:'space-between', gap:16,
        flexShrink:0, zIndex:90 }}>
        <div style={{ display:'flex', alignItems:'center', gap:16, minWidth:0 }}>
          <button onClick={onBack} className="site-header__back" title="Back to audits">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
          </button>
          <div style={{ display:'flex', alignItems:'center', gap:8, minWidth:0 }}>
            {nameEditing ? (
              <React.Fragment>
                <input
                  ref={nameInputRef}
                  value={nameDraft}
                  onChange={e => setNameDraft(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') { commitName(); } if (e.key === 'Escape') { nameCancelRef.current = true; setNameEditing(false); } }}
                  onBlur={() => { if (!nameCancelRef.current) commitName(); nameCancelRef.current = false; }}
                  placeholder="Audit title..."
                  style={{ fontFamily:"var(--font-sans)", fontSize:16, color:'var(--ink)',
                    letterSpacing:'-0.2px', background:'transparent', border:'none',
                    borderBottom:'1px solid var(--accent)', outline:'none', minWidth:80, width:180 }}
                />
                <button
                  onMouseDown={e => e.preventDefault()}
                  onClick={commitName}
                  style={{ fontFamily:"var(--font-mono)", fontSize:10, letterSpacing:'0.06em',
                    background:'var(--btn-bg)', border:'none', color:'var(--btn-ink)', padding:'3px 8px',
                    cursor:'pointer', flexShrink:0 }}>
                  GO →
                </button>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <span
                  onClick={() => { setNameDraft(ci.audit_title || ''); setNameEditing(true); }}
                  style={{ fontFamily:"var(--font-sans)", fontSize:16, color:'var(--ink)',
                    letterSpacing:'-0.2px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap',
                    cursor:'text' }}>
                  {auditDisplayTitle}
                </span>
                {isSetupIncomplete && (
                  <button
                    onClick={() => setClientInfoOpen(true)}
                    style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:'0.08em',
                      textTransform:'uppercase', color:'var(--amber)', background:'rgba(200,131,74,0.1)',
                      border:'1px solid rgba(200,131,74,0.25)', padding:'2px 7px', whiteSpace:'nowrap',
                      flexShrink:0, cursor:'pointer' }}
                    className="desktop-only">
                    Setup incomplete
                  </button>
                )}
              </React.Fragment>
            )}
          </div>
        </div>
        <div style={{ display:'flex', gap:8, flexShrink:0 }}>
          <button onClick={() => setClientInfoOpen(true)}
            style={{ background:'none', border:'1px solid var(--rule)', color:'var(--ink-4)', padding:'6px 14px',
              fontFamily:"var(--font-mono)", fontSize:10, letterSpacing:'0.06em', textTransform:'uppercase',
              cursor:'pointer' }}>
            {isSetupIncomplete ? '+ Audit Info' : 'Edit Info'}
          </button>
          {!demoMode && (
            <button onClick={() => {
              const name = (ci.audit_title || ci.client_name || 'audit').toLowerCase().replace(/\s+/g,'-');
              downloadJSON(audit, `cro-audit-${name}-${audit.id}.json`);
            }} style={{ background:'none', border:'1px solid var(--rule)', color:'var(--ink-4)', padding:'6px 14px',
              fontFamily:"var(--font-mono)", fontSize:10, letterSpacing:'0.06em', textTransform:'uppercase',
              cursor:'pointer' }} className="desktop-only">
              Export Audit
            </button>
          )}
          <ThemeToggle theme={theme} onToggle={onToggleTheme} />
        </div>
      </div>

      {/* Stage container — overflow hidden blocks manual scrolling; navigation is CTA-only */}
      <div style={{ flex:1, overflow:'hidden', position:'relative' }}>

        {/* Checklist — flex column so sidebar/card scroll independently */}
        <div data-stage="checklist" style={{ ...stageStyle(0), display:'flex', flexDirection:'column', overflow:'hidden' }}>
          <ChecklistStage audit={audit} onUpdateItem={onUpdateItem}
            onScrollToFindings={() => setStageIndex(1)}
            onContextChange={setChecklistCtx}
            cardGlowTrigger={cardGlowTrigger} />
        </div>

        {/* Findings */}
        <div data-stage="findings" style={{ ...stageStyle(1), overflowY:'auto' }}>
          <FindingsStage audit={audit} checkedIds={checkedIds} setCheckedIds={setCheckedIds} onUpdateItem={(itemId, updates) => onUpdateItem(audit.id, itemId, updates)} />
        </div>

        {/* Calculator */}
        <div data-stage="calculator" style={{ ...stageStyle(2), overflowY:'auto' }}>
          <CalculatorStage audit={audit} checkedIds={checkedIds} onUpdatePricing={onUpdatePricing} />
        </div>

        {/* Report */}
        <div data-stage="report" style={{ ...stageStyle(3), overflowY:'auto' }}>
          <ReportStage audit={audit} checkedIds={checkedIds} onGoToScripts={() => setStageIndex(4)} />
        </div>

        {/* Scripts */}
        <div data-stage="scripts" style={{ ...stageStyle(4), overflowY:'auto' }}>
          <ScriptsStage audit={audit} />
        </div>

      </div>

      {/* Stage nav bar — visible on all breakpoints */}
      <div className="mobile-bottom-bar no-print">
        <button onClick={stageIndex > 0 ? () => setStageIndex(stageIndex - 1) : onBack}
          style={{ background:'none', border:'1px solid var(--rule)', color:'var(--ink-3)', padding:'10px 18px',
            fontFamily:"var(--font-sans)", fontSize:12, fontWeight:600, letterSpacing:'0.06em',
            textTransform:'uppercase', cursor:'pointer', flexShrink:0 }}>
          ← Back
        </button>
        <div style={{ flex:1, display:'flex', justifyContent:'flex-start' }}>
          <span className="desktop-only" style={{ fontFamily:"var(--font-mono)", fontSize:10,
            color:'var(--ink-5)', letterSpacing:'0.04em' }}>
            {STAGE_LABELS[stageIndex]}
          </span>
        </div>
        {NEXT_LABELS[stageIndex] ? (
          <button onClick={() => {
            const nextIdx = stageIndex + 1;
            const metricsIncomplete = !ci.monthly_revenue || !ci.aov || !ci.cvr;
            if (stageIndex === 1 && metricsIncomplete) {
              setClientInfoSkipTarget(nextIdx);
              setClientInfoOpen(true);
            } else {
              setStageIndex(nextIdx);
            }
          }}
            style={{ background:'var(--btn-bg)', border:'none', color:'var(--btn-ink)', padding:'10px 22px',
              fontFamily:"var(--font-mono)", fontSize:12, fontWeight:600, letterSpacing:'0.08em',
              textTransform:'uppercase', cursor:'pointer', flexShrink:0 }}>
            {NEXT_LABELS[stageIndex]} →
          </button>
        ) : <div />}
      </div>

      {/* Client info overlay */}
      {clientInfoOpen && (
        <ClientInfoOverlay audit={audit} lastAuditorName={store.last_auditor_name}
          onSave={(data) => { onSaveClientInfo(audit.id, data); if (clientInfoSkipTarget !== null) setStageIndex(clientInfoSkipTarget); setClientInfoOpen(false); setClientInfoSkipTarget(null); }}
          onClose={() => { setClientInfoOpen(false); setClientInfoSkipTarget(null); }}
          onSkip={clientInfoSkipTarget !== null ? () => { setStageIndex(clientInfoSkipTarget); setClientInfoOpen(false); setClientInfoSkipTarget(null); } : null} />
      )}
    </div>
  );
}

function App() {
  const [store, setStore] = useState(initStore);
  const [appScreen, setAppScreen] = useState('list'); // 'list' | 'audit'
  const [activeAuditId, setActiveAuditId] = useState(null);
  const [theme, setTheme] = useState(() => localStorage.getItem('triage-theme') || 'light');
  const [user, setUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(!demoMode);
  const [auditsLoading, setAuditsLoading] = useState(!demoMode);
  const [dbError, setDbError] = useState(null);
  const [confirmDialog, setConfirmDialog] = useState(null);
  const [showNewAuditModal, setShowNewAuditModal] = useState(false);
  const [showHelpModal, setShowHelpModal] = useState(false);
  const saveTimers = useRef({});
  // Track updated_at of last-saved version per audit to skip unnecessary Supabase writes
  const savedAt = useRef({});

  useEffect(() => {
    if (theme === 'light') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
    try { localStorage.setItem('triage-theme', theme); } catch {}
  }, [theme]);

  function toggleTheme() { setTheme(t => t === 'dark' ? 'light' : 'dark'); }

  useEffect(() => {
    if (demoMode) return;
    _supabase.auth.getUser().then(({ data: { user } }) => {
      setUser(user ?? null);
      setAuthLoading(false);
    });
    const { data: { subscription } } = _supabase.auth.onAuthStateChange((_event, session) => {
      setUser(session?.user ?? null);
      setAuthLoading(false);
    });
    return () => subscription.unsubscribe();
  }, []);

  async function handleSignOut() {
    await _supabase.auth.signOut();
  }

  // Persist last_auditor_name to localStorage (audits live in Supabase now)
  useEffect(() => {
    if (!demoMode) {
      try { localStorage.setItem(THEME.storage.key, JSON.stringify({ last_auditor_name: store.last_auditor_name })); } catch {}
    }
  }, [store.last_auditor_name]);

  // Load audits from Supabase after auth resolves
  useEffect(() => {
    if (demoMode || !user) return;
    setAuditsLoading(true);
    fetchAuditsFromDB(user.id)
      .then(audits => {
        Object.values(audits).forEach(a => { savedAt.current[a.id] = a.updated_at; });
        setStore(prev => ({ ...prev, audits }));
        setAuditsLoading(false);
      })
      .catch(err => {
        console.error('fetchAudits:', err);
        setDbError('Could not load audits. Check your connection.');
        setAuditsLoading(false);
      });
  }, [user?.id]);

  // Debounced save — only fires for audits whose updated_at changed since last save
  useEffect(() => {
    if (demoMode || !user) return;
    Object.values(store.audits).forEach(audit => {
      if (savedAt.current[audit.id] === audit.updated_at) return;
      clearTimeout(saveTimers.current[audit.id]);
      saveTimers.current[audit.id] = setTimeout(() => {
        upsertAuditToDB(user.id, audit)
          .then(() => { savedAt.current[audit.id] = audit.updated_at; })
          .catch(err => {
            console.error('upsertAudit:', err);
            setDbError('Save failed. Check your connection.');
          });
      }, 1500);
    });
  }, [store.audits]);

  function updateStore(fn) { setStore(prev => fn(prev)); }

  function handleDismissError() { setDbError(null); }

  function handleNew() {
    if (!demoMode && Object.keys(store.audits).length >= THEME.limits.maxActiveAudits) {
      setDbError(THEME.copy.workspaceFull);
      return;
    }
    setShowNewAuditModal(true);
  }

  async function handleCreateAudit(formData) {
    const base = newAudit(store.last_auditor_name);
    const audit = {
      ...base,
      client_info: {
        ...base.client_info,
        audit_title:     formData.audit_title.trim(),
        client_name:     formData.client_name.trim(),
        auditor_name:    formData.auditor_name.trim(),
        store_url:       formData.store_url.trim(),
        shopify_theme:   formData.shopify_theme.trim(),
        audit_date:      formData.audit_date || today(),
        monthly_revenue: parseFloat(formData.monthly_revenue) || 0,
        aov:             parseFloat(formData.aov) || 0,
        cvr:             parseFloat(formData.cvr) || 0,
      },
      pricing: { ...base.pricing, audit_fee: parseFloat(formData.audit_fee) || 0 },
    };
    setShowNewAuditModal(false);
    if (!demoMode) {
      try {
        await upsertAuditToDB(user.id, audit);
        savedAt.current[audit.id] = audit.updated_at;
      } catch (err) {
        setDbError(err.message?.includes('audit_limit_reached')
          ? THEME.copy.workspaceFull
          : 'Could not create audit. Check your connection.');
        return;
      }
    }
    updateStore(prev => ({
      ...prev,
      last_auditor_name: formData.auditor_name.trim() || prev.last_auditor_name,
      audits: { ...prev.audits, [audit.id]: audit },
    }));
    setActiveAuditId(audit.id);
    setAppScreen('audit');
  }

  function handleOpen(id) {
    setActiveAuditId(id);
    setAppScreen('audit');
  }

  function handleArchive(id) {
    const audit = store.audits[id];
    const auditTitle = audit.client_info?.audit_title || audit.client_info?.client_name || 'this audit';
    setConfirmDialog({
      title: 'Export & Delete',
      message: `"${auditTitle}" will be exported as a JSON file and removed from your active audits. You can reimport it later if you have an open slot.`,
      confirmLabel: 'Export & Delete',
      danger: true,
      onConfirm: async () => {
        const name = auditTitle.toLowerCase().replace(/\s+/g, '-');
        downloadJSON(audit, `cro-audit-${name}-${id}.json`);
        if (!demoMode) {
          try {
            await deleteAuditFromDB(id);
            delete savedAt.current[id];
          } catch (err) {
            setDbError('Delete failed. Check your connection.');
            return;
          }
        }
        updateStore(prev => { const { [id]: _, ...rest } = prev.audits; return { ...prev, audits: rest }; });
      },
    });
  }

  async function handleDuplicate(id) {
    if (!demoMode && Object.keys(store.audits).length >= THEME.limits.maxActiveAudits) {
      setDbError(THEME.copy.workspaceFull);
      return;
    }
    const audit = store.audits[id];
    const newId = genId();
    const now = new Date().toISOString();
    const dupeAudit = { ...audit, id: newId, created_at: now, updated_at: now,
      client_info: { ...audit.client_info }, items: { ...audit.items } };
    if (!demoMode) {
      try {
        await upsertAuditToDB(user.id, dupeAudit);
        savedAt.current[newId] = dupeAudit.updated_at;
      } catch (err) {
        setDbError(err.message?.includes('audit_limit_reached')
          ? THEME.copy.workspaceFull
          : 'Could not duplicate audit. Check your connection.');
        return;
      }
    }
    updateStore(prev => ({ ...prev, audits: { ...prev.audits, [newId]: dupeAudit } }));
  }

  function handleDelete(id) {
    const audit = store.audits[id];
    const auditTitle = audit.client_info?.audit_title || audit.client_info?.client_name || 'this audit';
    setConfirmDialog({
      title: 'Delete Audit',
      message: `Delete "${auditTitle}"? This cannot be undone.`,
      confirmLabel: 'Delete',
      danger: true,
      onConfirm: async () => {
        if (!demoMode) {
          try {
            await deleteAuditFromDB(id);
            delete savedAt.current[id];
          } catch (err) {
            setDbError('Delete failed. Check your connection.');
            return;
          }
        }
        updateStore(prev => { const { [id]: _, ...rest } = prev.audits; return { ...prev, audits: rest }; });
        if (activeAuditId === id) { setActiveAuditId(null); setAppScreen('list'); }
      },
    });
  }

  async function handleImport(data) {
    if (!demoMode && Object.keys(store.audits).length >= THEME.limits.maxActiveAudits) {
      setDbError(THEME.copy.workspaceFull);
      return;
    }
    const newId = genId();
    const now = new Date().toISOString();
    const audit = { ...data, id: newId, updated_at: now };
    if (!demoMode) {
      try {
        await upsertAuditToDB(user.id, audit);
        savedAt.current[newId] = audit.updated_at;
      } catch (err) {
        setDbError(err.message?.includes('audit_limit_reached')
          ? THEME.copy.workspaceFull
          : 'Could not import audit. Check your connection.');
        return;
      }
    }
    updateStore(prev => ({ ...prev, audits: { ...prev.audits, [newId]: audit } }));
  }

  function handleUpdateItem(auditId, itemId, updates) {
    updateStore(prev => {
      const audit = prev.audits[auditId];
      return { ...prev, audits: { ...prev.audits, [auditId]: {
        ...audit, updated_at: new Date().toISOString(),
        items: { ...audit.items, [itemId]: { ...(audit.items[itemId] || {}), ...updates } },
      }}};
    });
  }

  function handleUpdatePricing(auditId, pricing) {
    updateStore(prev => {
      const audit = prev.audits[auditId];
      return { ...prev, audits: { ...prev.audits, [auditId]: {
        ...audit, updated_at: new Date().toISOString(), pricing,
      }}};
    });
  }

  function handleSaveClientInfo(auditId, { client_info, pricing }) {
    updateStore(prev => {
      const audit = prev.audits[auditId];
      return {
        ...prev,
        last_auditor_name: client_info.auditor_name,
        audits: { ...prev.audits, [auditId]: {
          ...audit, client_info, updated_at: new Date().toISOString(),
          pricing: { ...audit.pricing, audit_fee: pricing.audit_fee },
        }},
      };
    });
  }

  if (authLoading) return null;
  if (!demoMode && !user) return <LoginScreen />;

  if (appScreen === 'audit' && activeAuditId) {
    return (
      <>
        <AuditWorkspace
          auditId={activeAuditId}
          store={store}
          onUpdateItem={handleUpdateItem}
          onUpdatePricing={handleUpdatePricing}
          onSaveClientInfo={handleSaveClientInfo}
          onBack={() => setAppScreen('list')}
          theme={theme}
          onToggleTheme={toggleTheme}
        />
        <ConfirmDialog dialog={confirmDialog} onClose={() => setConfirmDialog(null)} />
      </>
    );
  }

  return (
    <>
      {demoMode && (
        <div className="demo-banner">
          <span className="demo-banner__chip">DEMO</span>
          <span>Nothing here is saved. Refreshing the page clears this audit.</span>
          <a href="https://croauditsystem.lemonsqueezy.com/checkout/buy/9da78faa-4513-40c6-9469-621292edd053" className="demo-banner__cta">Get the full kit →</a>
        </div>
      )}
      <SiteHeader theme={theme} onToggleTheme={toggleTheme} onHelp={() => setShowHelpModal(true)} />
      <AuditList
        store={store}
        onNew={handleNew}
        onOpen={handleOpen}
        onArchive={handleArchive}
        onDuplicate={handleDuplicate}
        onDelete={handleDelete}
        onImport={handleImport}
        onSaveClientInfo={handleSaveClientInfo}
        user={user}
        onSignOut={handleSignOut}
        auditsLoading={auditsLoading}
        dbError={dbError}
        onDismissError={handleDismissError}
      />
      {showNewAuditModal && (
        <NewAuditModal
          lastAuditorName={store.last_auditor_name}
          onSubmit={handleCreateAudit}
          onClose={() => setShowNewAuditModal(false)}
        />
      )}
      {showHelpModal && <HelpModal onClose={() => setShowHelpModal(false)} />}
      <ConfirmDialog dialog={confirmDialog} onClose={() => setConfirmDialog(null)} />
    </>
  );
}
// ─── END COMPONENTS C ───

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
